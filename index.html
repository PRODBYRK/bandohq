   Ett fejkat Dropbox i minnet, så hela kedjan — koppla, sätta upp mappar,
   skanna, ladda upp, spela, ta bort — går att köra utan riktiga uppgifter.
   Testerna når filsystemet via window.__mockDbx. Rörs aldrig i skarpt läge.
   ===================================================================== */
const MOCK = new URLSearchParams(location.search).get('mock')==='1';
if(MOCK){
  const MX = {n:1, f:{}, shared:'', members:[], mounted:false, calls:[]};
  window.__mockDbx = MX;
  const nid = () => 'id:mock' + (MX.n++);
  const low = p => String(p).toLowerCase();
  const byPath = p => Object.values(MX.f).find(f=>low(f.path)===low(p));
  const meta = f => f.folder ? {'.tag':'folder', id:f.id, name:f.name, path_lower:low(f.path), path_display:f.path}
    : {'.tag':'file', id:f.id, name:f.name, path_lower:low(f.path), path_display:f.path, size:f.size||0,
       client_modified:f.at||new Date().toISOString(), server_modified:f.at||new Date().toISOString()};
  /* hjälp för testerna: lägg en fil "från datorn" */
  MX.put = (path, size) => { const f = {id:nid(), name:path.split('/').pop(), path, size:size||1000, at:new Date().toISOString()};
    MX.f[f.id] = f; return f; };
  const J = (o, st) => Promise.resolve(new Response(JSON.stringify(o),
    {status:st||200, headers:{'Content-Type':'application/json'}}));
  const E = sum => J({error_summary:sum, error:{}}, 409);
  /* ett kort tyst wav-ljud, så spelaren har något att ladda */
  const WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
  /* platshållarbild: en mörk gradient i appens färger, olika per fil */
  const mockPic = name => {
    const c = document.createElement('canvas'); c.width = 480; c.height = 480;
    const x = c.getContext('2d'), h = [...String(name)].reduce((a,ch)=>a*31 + ch.charCodeAt(0) >>> 0, 7);
    const hues = [262, 200, 330, 28, 160], g = x.createLinearGradient(0, 0, 480, 480);
    g.addColorStop(0, `hsl(${hues[h%5]} 55% 34%)`); g.addColorStop(1, `hsl(${hues[(h>>>3)%5]} 60% 12%)`);
    x.fillStyle = g; x.fillRect(0, 0, 480, 480);
    x.fillStyle = 'rgba(255,255,255,.07)'; x.beginPath(); x.arc(120 + h%240, 140 + (h>>>5)%200, 90 + h%60, 0, 7); x.fill();
    return c;
  };

  dbxConnect = async () => {
    if(!dbxConfigured()) return toast('Dropbox-nyckeln saknas — AZ lägger in den');
    saveDbx({access:'mock', refresh:'mock', exp:Date.now()+864e5});
    await dbxMount(); closeSheet(); render(); toast('Dropbox kopplat');
  };

  const realFetch = window.fetch.bind(window);
  window.fetch = (url, opt) => {
    url = String(url); opt = opt||{};
    if(!/dropboxapi\.com/.test(url)) return realFetch(url, opt);
    if(url.includes('/oauth2/token')) return J({access_token:'mock', refresh_token:'mock', expires_in:14400});
    const ep = url.split('/2/')[1], a = opt.body ? JSON.parse(opt.body) : null;
    MX.calls.push(ep);
    switch(ep){
      case 'files/create_folder_v2':
        if(byPath(a.path)) return E('path/conflict/folder/..');
        { const f = {id:nid(), name:a.path.split('/').pop(), path:a.path, folder:true}; MX.f[f.id] = f;
          return J({metadata:meta(f)}); }
      case 'files/get_metadata':
        { const f = byPath(a.path) || MX.f[a.path]; return f ? J(Object.assign(meta(f), MX.shared && low(f.path)===low(DBX_ROOT)
          ? {shared_folder_id:MX.shared} : {})) : E('path/not_found/..'); }
      case 'sharing/share_folder':
        if(MX.shared) return E('bad_path/already_shared/..');
        MX.shared = 'sf' + (MX.n++); return J({'.tag':'complete', shared_folder_id:MX.shared, path_lower:low(DBX_ROOT)});
      case 'sharing/add_folder_member':
        a.members.forEach(m=>{ if(!MX.members.includes(m.member.email)) MX.members.push(m.member.email); }); return J(null);
      case 'sharing/mount_folder':
        if(MX.mounted) return E('already_mounted/..');
        MX.mounted = true; return J({shared_folder_id:a.shared_folder_id, path_lower:low(DBX_ROOT)});
      case 'sharing/get_folder_metadata':
        return J({shared_folder_id:a.shared_folder_id, path_lower:low(DBX_ROOT)});
      case 'files/list_folder': {
        const pre = low(a.path) + '/';
        if(!byPath(a.path)) return E('path/not_found/..');
        const all = Object.values(MX.f).filter(f=>low(f.path).startsWith(pre)
          && (a.recursive || !low(f.path).slice(pre.length).includes('/')));
        /* två sidor när det är många, så continue också provas */
        return J({entries:all.slice(0,3).map(meta), cursor:'c:'+pre, has_more:all.length>3});
      }
      case 'files/list_folder/continue': {
        const pre = String(a.cursor).slice(2);
        const all = Object.values(MX.f).filter(f=>low(f.path).startsWith(pre));
        return J({entries:all.slice(3).map(meta), cursor:'c2', has_more:false});
      }
      case 'files/get_thumbnail_v2': {
        const arg = JSON.parse((opt.headers||{})['Dropbox-API-Arg'] || '{}'), f = MX.f[(arg.resource||{}).path];
        MX.thumbs = (MX.thumbs||0) + 1;
        /* toDataURL i stället för toBlob — toBlob kan stå still i headless med virtuell tid */
        return f ? realFetch(mockPic(f.name).toDataURL('image/jpeg', .8)).then(r=>r.blob()).then(bl=>new Response(bl, {status:200, headers:{'Content-Type':'image/jpeg'}})) : E('path/not_found/..');
      }
      case 'files/get_temporary_link':
        return MX.f[a.path] ? J({metadata:meta(MX.f[a.path]), link: MEDIA_IMG.test(MX.f[a.path].name) ? mockPic(MX.f[a.path].name).toDataURL('image/jpeg', .8) : WAV}) : E('path/not_found/..');
      case 'files/delete_v2':
        if(!MX.f[a.path]) return E('path_lookup/not_found/..');
        { const f = MX.f[a.path]; delete MX.f[a.path]; return J({metadata:meta(f)}); }
    }
    return J({}, 200);
  };

  /* uppladdning: progress i tre steg, filen hamnar i det fejkade filsystemet */
  const realXhr = xhrUpload;
  xhrUpload = (url, method, headers, body, onProg) => {
    if(!/content\.dropboxapi\.com/.test(url)) return realXhr(url, method, headers, body, onProg);
    const arg = JSON.parse(headers['Dropbox-API-Arg']);
    return new Promise(res=>{
      let p = 0;
      const t = setInterval(()=>{ p = Math.min(1, p+.34); if(onProg) onProg(p);
        if(p>=1){ clearInterval(t);
          let path = arg.path;
          if(byPath(path)){ const i = path.lastIndexOf('.'); path = path.slice(0,i) + ' (1)' + path.slice(i); }
          const f = MX.put(path, body.size||0);
          res({body:JSON.stringify(meta(f))});
        } }, 90);
    });
  };
}

/* ===================== START ===================== */
function wireDrop(){
  const mpick = document.getElementById('mediapick');
  mpick.onchange = e => { if(e.target.files.length) uploadMedia(e.target.files); mpick.value=''; };
  document.addEventListener('dragover', e=>{ if(view==='gallery' && dbxReady() && can('uploadMedia') && e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
  document.addEventListener('drop', async e=>{
    if(view!=='gallery' || !dbxReady() || !can('uploadMedia') || !e.dataTransfer || !e.dataTransfer.files.length) return;
    e.preventDefault(); uploadMedia(await filesFromDrop(e.dataTransfer));
  });
  const pick = document.getElementById('filepick');
  pick.onchange = e => { if(e.target.files.length) uploadBeats(e.target.files); pick.value=''; };
  const fpick = document.getElementById('folderpick');
  fpick.onchange = e => { if(e.target.files.length) uploadBeats(e.target.files); fpick.value=''; };
  ['dragenter','dragover'].forEach(ev=>document.addEventListener(ev, e=>{
    if(view!=='beats' || !dbxReady()) return;
    e.preventDefault(); const d=document.getElementById('drop'); if(d) d.classList.add('hot');
  }));
  ['dragleave','drop'].forEach(ev=>document.addEventListener(ev, e=>{
    const d=document.getElementById('drop'); if(d && (ev==='drop'||e.relatedTarget===null)) d.classList.remove('hot');
  }));
  document.addEventListener('drop', async e=>{
    if(view!=='beats' || !dbxReady()) return;
    e.preventDefault();
    if(e.dataTransfer) uploadBeats(await filesFromDrop(e.dataTransfer));
  });
}

/* Länkar som landar i appen: delningskod, inbjudan, mejllänkar från Supabase
   (bekräftelse, nytt lösenord) och svaret från Dropbox efter godkännandet. */
async function readLanding(){
  const h = location.hash, qs = new URLSearchParams(location.search);
  const clean = () => history.replaceState(null, '', location.pathname + (MOCK ? '?mock=1' : ''));
  if(h.startsWith('#s=')){
    const code = h.slice(3); clean();
    try{
      const r = mergeData(JSON.parse(unb64(code)));
      setTimeout(()=>toast(`Hämtade in schemat · ${r.add} nya · ${r.upd} uppdaterade`), 500);
    }catch(e){}
  }
  /* gamla bokningslänkar och QR-koder: registreringen */
  if(h==='#boka'){ clean(); return goAccess(); }
  /* tillbaka från registreringen: inloggad, in i appen */
  if(h==='#welcome' || h==='#profil'){
    clean(); accessLanding = h.slice(1);
    if(PREVIEW_LOGIN) takeAccessPreview();
    else if(AUTH){ try{ await cloudEnter(); }catch(e){ gateErr = e.message; } }
  }
  if(h==='#integritet'){ clean(); setTimeout(openPrivacy, 300); }
  if(h==='#support'){ clean(); setTimeout(openSupport, 300); }
  if(h.startsWith('#join=')){
    joinToken = decodeURIComponent(h.slice(6)).trim().toUpperCase();
    if(!/^[A-Z0-9-]{10,40}$/.test(joinToken)) joinToken = null;
  }
  if(!PREVIEW_LOGIN && /access_token=|error_description=/.test(h)){
    const hp = new URLSearchParams(h.slice(1)); clean();
    if(hp.get('error_description')){
      gateErr = /expired|invalid/i.test(hp.get('error_description')) ? 'Länken har gått ut — försök igen' : hp.get('error_description');
    } else if(hp.get('type')==='recovery'){
      recoverToken = {access_token:hp.get('access_token'), refresh_token:hp.get('refresh_token'),
        expires_in:+hp.get('expires_in')||3600};
    } else {
      /* bekräftad e-post: logga in direkt, och lös in inbjudan om den väntar */
      const tok = {access_token:hp.get('access_token'), refresh_token:hp.get('refresh_token'), expires_in:+hp.get('expires_in')||3600};
      try{ tok.user = await sbAuth('/user', null, 'GET', tok.access_token); }catch(e){}
      takeSession(tok);
      try{ await cloudEnter(); }
      catch(e){ gateErr = e.message; if(pendingInvite()) gateMode = 'finish'; }
    }
  }
  if(qs.get('state')==='dbx' && (qs.get('code') || qs.get('error'))){
    const code = qs.get('code'); clean();
    if(code){ try{ await dbxFinish(code); setTimeout(()=>toast('Dropbox är kopplat'), 400); }
              catch(e){ setTimeout(()=>toast(e.message), 400); } }
    else setTimeout(()=>toast('Dropbox-kopplingen avbröts'), 400);
  }
}

(async function init(){
  wireDrop();
  await readLanding();
  nativeInit();
  /* kontot skapat men koden inte inskriven än (appen stängdes emellan) */
  if(!PREVIEW_LOGIN && !AUTH && !joinToken && !recoverToken && gateMode==='login'){
    const p = pendingInvite(); if(p && p.email){ gateEmail = p.email; gateMode = 'code'; }
  }
  /* v8: Costa och Nabbe (admins) och Moez (kamerateam) läggs in i förhandsläget
     en gång. I drift går de med via länk. */
  if(PREVIEW_LOGIN && !S.seed8){
    DEFAULT_CREW.filter(d=>['costa','nabbe','moez'].includes(d.id) && !byId(d.id) && !byName(d.n))
      .forEach(d=>S.accounts.push(Object.assign({email:'',phone:'',active:true,del:false,up:Date.now()}, d)));
    S.seed8 = 1; save();
  }
  syncState = (cloudOn() || dbxReady()) ? 'ok' : 'off';

  /* I skarpt läge räcker inte en sparad session — Supabase-inloggningen måste finnas också. */
  const signedIn = S.session && byName(S.session.member) && (PREVIEW_LOGIN || AUTH) && !joinToken && !recoverToken;
  if(signedIn) showApp(); else showGate();
  if(signedIn && accessLanding) setTimeout(afterAccess, 400);

  /* IDAG är tidskänslig: rita om varje minut så pågår-kortet stämmer */
  setInterval(()=>{ if(view==='today' && S.session) render(); }, 60000);
  const canSync = () => S.session && (cloudOn() || dbxReady());
  setInterval(()=>{ if(!document.hidden && canSync()) sync(true); }, 60000);
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden || !S.session) return;
    render();
    if(canSync()) sync(true);
  });
  if(signedIn && canSync()) setTimeout(()=>sync(true), 900);
  if(signedIn) setTimeout(pushRefresh, 1500);
})();
</script>
