const MEDIA_IMG = /\.(jpe?g|png|heic|heif|webp|gif)$/i, MEDIA_VID = /\.(mp4|mov|m4v|webm|avi)$/i;
let galFilter = '', galArtist = '', galOnlyNew = false;
const thumbCache = new Map();
async function scanMedia(){
  if(!dbxReady()) return 0;
  const base = (dbxRoot() + '/Media/').toLowerCase(), m = me();
  let r, entries = [];
  try{ r = await dbx('files/list_folder', {path:dbxRoot()+'/Media', recursive:true, limit:2000}); }
  catch(e){ if(/not_found/.test(e.summary||'')) return 0; throw e; }
  entries = r.entries || [];
  for(let n=0; r.has_more && n<50; n++){ r = await dbx('files/list_folder/continue', {cursor:r.cursor}); entries = entries.concat(r.entries || []); }
  const known = new Set((S.media||[]).map(x=>x.fileId).filter(Boolean));
  let added = 0;
  for(const f of entries){
    if(f['.tag']!=='file' || known.has(f.id) || !(MEDIA_IMG.test(f.name) || MEDIA_VID.test(f.name))) continue;
    const lp = String(f.path_lower||''); if(!lp.startsWith(base)) continue;
    const seg = lp.slice(base.length).split('/'); if(seg.length < 2) continue;
    const owners = teamAcc().filter(a=>creditOf(a).toLowerCase()===seg[0]); if(!owners.length) continue;
    /* posten skrivs av den som skannar — kameran får bara skriva sina egna */
    const by = owners.some(a=>a.id===(m&&m.id)) ? m.id : owners[0].id;
    if(m && m.r==='camera' && by!==m.id) continue;
    S.media.push(bump(mediaRec(f, by, creditOf(owners[0]))));
    known.add(f.id); added++;
  }
  if(added){ save(); if(view==='gallery') render(); }
  return added;
}
const mediaRec = (f, by, team) => ({id:uid(), by, team, name:f.name.replace(/\.[^.]+$/,''), file:f.name, fileId:f.id,
  path:f.path_display||f.path_lower||'', type: MEDIA_VID.test(f.name) ? 'video' : 'image', size:+f.size||0,
  added:f.client_modified||f.server_modified||new Date().toISOString(), caption:'', artistId:'', posted:{}, del:false});
async function uploadMedia(files){
  const list = Array.from(files).filter(f=>MEDIA_IMG.test(f.name) || MEDIA_VID.test(f.name));
  if(!list.length) return toast('Inga bilder eller filmer i det du valde');
  if(!dbxReady()) return toast('Koppla Dropbox först — under Profil');
  const m = me(), dir = dbxRoot() + '/Media/' + creditOf(m);
  let ok = 0;
  for(const f of list){
    const job = {id:uid(), name:f.name, size:f.size, p:0, err:''};
    uploads.push(job); render();
    try{
      const r = await dbxUpload(f, dir + '/' + f.name, p=>{ job.p = p; paintUploads(); });
      S.media.push(bump(mediaRec(Object.assign({}, r, {name:f.name, size:r.size||f.size}), m.id, creditOf(m))));
      ok++; save();
    }catch(e){ job.err = e.message; }
    if(!job.err) uploads = uploads.filter(u=>u!==job);
    render();
  }
  toast(`${ok} av ${list.length} uppladdade`); sync(true);
}
async function dbxThumb(fileId){
  const r = await fetch(DBX_CONTENT + '/files/get_thumbnail_v2', {method:'POST', headers:{Authorization:'Bearer ' + await dbxTok(),
    'Dropbox-API-Arg': dbxArg({resource:{'.tag':'path', path:fileId}, format:{'.tag':'jpeg'}, size:{'.tag':'w480h320'}, mode:{'.tag':'fitone_bestfit'}})}});
  if(!r.ok) throw new Error('miniatyr ' + r.status);
  return URL.createObjectURL(await r.blob());
}
/* Miniatyrerna hämtas efter ritningen, fyra åt gången, och sparas i minnet. */
async function loadThumbs(){
  if(!dbxConnected()) return;
  const imgs = [...document.querySelectorAll('img.thumb[data-f]')].filter(i=>!i.src);
  imgs.forEach(i=>{ const c = thumbCache.get(i.dataset.f); if(c) i.src = c; });
  const todo = imgs.filter(i=>!i.src);
  const work = async () => { while(todo.length){ const i = todo.shift(), f = i.dataset.f;
    try{ const u = await dbxThumb(f); thumbCache.set(f, u); document.querySelectorAll(`img.thumb[data-f="${CSS.escape(f)}"]`).forEach(x=>x.src = u); }
    catch(e){ i.closest('.mtile') && i.closest('.mtile').classList.add('nothumb'); } } };
  await Promise.all([work(), work(), work(), work()]);
}

/* Telefonen: filen till delningsmenyn (Instagram, spara i bilder …). Datorn: ladda ner. */
async function shareMedia(id){
  const x = (S.media||[]).find(y=>y.id===id); if(!x) return;
  try{
    const r = await dbx('files/get_temporary_link', {path:x.fileId});
    const blob = await (await fetch(r.link)).blob();
    const file = new File([blob], x.file || x.name, {type: blob.type || (x.type==='video'?'video/mp4':'image/jpeg')});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], text:captionFor(x)}).catch(()=>{});
    } else {
      const u = URL.createObjectURL(blob), el = document.createElement('a');
      el.href = u; el.download = x.file || x.name; document.body.appendChild(el); el.click(); el.remove();
      setTimeout(()=>URL.revokeObjectURL(u), 4000);
      copy(captionFor(x), 'Filen laddas ner · bildtexten kopierad');
    }
  }catch(e){ toast(e.message); }

        : `<div class="tiny muted agp-e">${list.length?'Allt klart ✓':'Inget inlagt för veckan'}</div>`}
    </div>`;
  };

/* =====================================================================
   PUSH — gratis notiser
   Enheten prenumererar hos sin push-tjänst (Apple, Google, Mozilla) med
   vår publika nyckel; servern krypterar och skickar (edge-funktionen
   notify-send). På iPhone krävs att appen ligger på hemskärmen.
   ===================================================================== */
const PUSH_LS = 'bandohq_push';
const b64uDecode = s => { s = String(s).replace(/-/g,'+').replace(/_/g,'/'); s += '='.repeat((4 - s.length % 4) % 4);
  return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); };
const b64uEncode = u8 => btoa(String.fromCharCode(...new Uint8Array(u8))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
/* Vad enheten klarar och vad som är gjort. Egen funktion så att testerna kan byta den. */
function pushEnv(){
  const ua = navigator.userAgent || '';
  return {supported: 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window,
    ios: /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1),
    standalone: !!(window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true,
    perm: 'Notification' in window ? Notification.permission : 'default'};
}
function pushState(){
  const e = pushEnv(); let ep = ''; try{ ep = localStorage.getItem(PUSH_LS) || ''; }catch(_){}
  return Object.assign(e, {on: !!ep && e.perm === 'granted', endpoint: ep});
}
/* Vad påminnelsen ska säga — eller '' om den inte behövs. */
function pushAdvice(){
  if(PREVIEW_LOGIN || !S.session) return '';
  const st = pushState();
  if(st.on) return '';
  if(st.ios && !st.standalone) return 'home';
  if(!st.supported) return 'unsupported';
  if(st.perm === 'denied') return 'denied';
  return 'ask';
}
let pushBusy = false;
function pushBanner(){
  const a = pushAdvice(); if(!a || a==='unsupported') return '';
  const txt = {
    home: `<b>Notiser i telefonen:</b> lägg BANDOHQ på hemskärmen — tryck på dela-knappen i Safari och <b>Lägg till på hemskärmen</b>, öppna appen därifrån och slå på notiser. Tills dess kommer påminnelser som mejl.`,
    denied: `<b>Notiserna är avstängda</b> för BANDOHQ i telefonens inställningar. Slå på dem där — tills dess kommer påminnelser som mejl.`,
    ask: `<b>Slå på notiser</b> — gratis och direkt i telefonen. Utan dem kommer påminnelser och agendan som mejl.`}[a];
  return `<div class="pushban ${a}" role="status"><div class="grow">${txt}</div>
    ${a==='ask' ? `<button class="btn slim" style="width:auto;flex:none;padding:10px 14px" ${pushBusy?'disabled':''} onclick="enablePush()">${pushBusy?'…':'SLÅ PÅ'}</button>` : ''}</div>`;
}
function pushCard(){
  if(PREVIEW_LOGIN) return `<div class="note" style="margin-top:8px">Påminnelser kommer som <b>push</b> (gratis) när servern är inkopplad —
    eller som mejl för den som inte slagit på push. Bekräftelser kommer alltid på mejlen.</div>`;
  const st = pushState(), a = pushAdvice();
  return `<div class="note" style="margin-top:8px">${st.on
      ? `Påslaget på den här enheten. Påminnelser, förfrågningar och svar kommer som notiser — gratis.`
      : {home:'På iPhone kommer push bara när appen ligger på <b>hemskärmen</b> (Dela → Lägg till på hemskärmen).',
         denied:'Notiserna är avstängda i telefonens inställningar för BANDOHQ.',
         unsupported:'Den här webbläsaren klarar inte push.', ask:'Inte påslaget på den här enheten än.'}[a] + ' Tills dess kommer påminnelserna som mejl.'}</div>
    ${a==='ask' ? `<button class="btn" style="margin-top:10px" onclick="enablePush()">SLÅ PÅ NOTISER</button>` : ''}
    ${st.on ? `<button class="btn ghost slim" style="margin-top:9px" onclick="testPush()">SKICKA EN TESTNOTIS</button>` : ''}`;

/* Kräver ett tryck (webbläsarna tillåter bara frågan efter en användarhandling). */
async function enablePush(){
  if(pushBusy) return;
  pushBusy = true; render();
  try{
    const key = await sbRpc('push_public_key', {});
    if(!key) throw new Error('Push är inte uppsatt än — managern skapar nycklarna under Crew → Notiser');
    const sub = await pushSubscribe(key);
    const j = sub.toJSON ? sub.toJSON() : sub;
    await sbRpc('save_push_sub', {p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth,

/* Själva prenumerationen hos webbläsaren. Egen funktion så att testerna kan byta den. */
async function pushSubscribe(key){
  const reg = await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  const perm = await Notification.requestPermission();
  if(perm !== 'granted') throw new Error(perm === 'denied' ? 'Notiser nekades — slå på dem i telefonens inställningar' : 'Notiser slogs inte på');
  const old = await reg.pushManager.getSubscription();
  /* gammal prenumeration med en annan servernyckel måste bort först */
  if(old && old.options && old.options.applicationServerKey &&
     b64uEncode(old.options.applicationServerKey) !== key){ await old.unsubscribe(); }
  return (await reg.pushManager.getSubscription()) ||
    reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64uDecode(key)});
}
/* Vid start: håll prenumerationen färsk (push-tjänster byter ibland adress). */
async function pushRefresh(){
  if(PREVIEW_LOGIN || !S.session || !AUTH || !pushState().on) return;
  try{
    const reg = await navigator.serviceWorker.getRegistration('sw.js');
    const sub = reg && await reg.pushManager.getSubscription();
    if(!sub){ try{ localStorage.removeItem(PUSH_LS); }catch(_){} return render(); }
    const j = sub.toJSON();
    await sbRpc('save_push_sub', {p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth, p_ua:(navigator.userAgent||'').slice(0,200)});
    try{ localStorage.setItem(PUSH_LS, j.endpoint); }catch(_){}
  }catch(_){}
}
function pushOff(){
  let ep = ''; try{ ep = localStorage.getItem(PUSH_LS) || ''; localStorage.removeItem(PUSH_LS); }catch(_){}
  if(ep && AUTH) sbRpc('remove_push_sub', {p_endpoint:ep}).catch(()=>{});
}

let vapidMade = null;

    : S.pushCfg.publicKey ? `<div class="tiny muted" style="margin-top:8px">Uppsatta. Publik nyckel: <span class="mono">${esc(S.pushCfg.publicKey.slice(0,18))}…</span></div>
      <button class="btn ghost slim" style="margin-top:10px" onclick="makeVapid(true)">SKAPA NYA NYCKLAR</button>`
    : `<div class="tiny muted" style="margin-top:8px;line-height:1.55">Behövs en gång innan någon kan slå på push. Se SETUP.md, steg 5.</div>
      <button class="btn" style="margin-top:10px" onclick="makeVapid(false)">SKAPA PUSH-NYCKLAR</button>`}</div>`;

async function makeVapid(again){
  if(!can('grantManager')) return;
  if(again && !confirm('Nya nycklar betyder att alla måste slå på notiserna igen. Fortsätta?')) return;
  const kp = await crypto.subtle.generateKey({name:'ECDSA', namedCurve:'P-256'}, true, ['sign','verify']);
  const pub = b64uEncode(await crypto.subtle.exportKey('raw', kp.publicKey));
  const priv = (await crypto.subtle.exportKey('jwk', kp.privateKey)).d;
  S.pushCfg = {publicKey:pub, up:Date.now()}; save(); sync(true);
  vapidMade = {pub, priv}; render();
}

/* ---------- SÄKERHETSKOPIA ----------
   Gratisplanen hos Supabase har ingen backup — därför en knapp. Filen innehåller
   allt managern/admin får läsa och går att läsa tillbaka. Inga lösenord. */
const BACKUP_DAYS = 7;
const backupDue = () => !PREVIEW_LOGIN && can('manageCrew') && Date.now() - (S.backupCfg.at||0) > BACKUP_DAYS*864e5;
async function backupData(){
  if(PREVIEW_LOGIN) return {app:'BANDOHQ', v:1, mode:'preview', at:new Date().toISOString(), payload:fullPayload()};
  const records = []; let from = -1;
  for(let page=0; page<200; page++){
    const rows = (await sb('/records?select=kind,id,data,up,del,ts&ts=gt.' + from + '&order=ts.asc&limit=1000')) || [];
    records.push(...rows);
    if(rows.length < 1000) break;
    from = +rows[rows.length-1].ts;
  }
  const get = async path => { try{ return (await sb(path)) || []; }catch(_){ return []; } };
  return {app:'BANDOHQ', v:1, mode:'cloud', at:new Date().toISOString(), by:(me()||{}).n||'',
    records, members:await get('/members?select=*'), invites:await get('/invites?select=*'), leads:await get('/leads?select=*')};
}
async function downloadBackup(){
  if(!can('manageCrew')) return;
  try{
    const data = await backupData();
    const url = URL.createObjectURL(new Blob([JSON.stringify(data)], {type:'application/json'}));
    const el = document.createElement('a'); el.href = url; el.download = `bandohq-backup-${iso(new Date())}.json`;
    document.body.appendChild(el); el.click(); el.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000);
    S.backupCfg = {at:Date.now(), by:(me()||{}).n||'', up:Date.now()}; save(); sync(true); render();
    toast(`Säkerhetskopia sparad · ${data.records ? data.records.length + ' poster' : 'förhandsläget'}`);
    return data;
  }catch(e){ toast('Säkerhetskopian misslyckades: ' + e.message); }
}
/* Läs tillbaka: bara det som saknas eller är nyare än serverns kommer in. */
async function restoreBackup(file){
  if(!can('manageCrew') || !file) return;
  let d; try{ d = JSON.parse(await file.text()); }catch(_){ return toast('Filen är inte en säkerhetskopia från BANDOHQ'); }
  if(d.app!=='BANDOHQ') return toast('Filen är inte en säkerhetskopia från BANDOHQ');
  if(!confirm(`Läsa tillbaka säkerhetskopian från ${String(d.at).slice(0,10)}?\n\nDet som finns nu skrivs inte över — bara det som saknas, eller är äldre här än i filen, kommer tillbaka.`)) return;
  try{
    if(PREVIEW_LOGIN || d.mode==='preview'){ if(d.payload) mergeData(d.payload); else (d.records||[]).forEach(applyRecord); save(); }
    else {
      const rows = (d.records||[]).map(r=>({kind:r.kind, id:r.id, data:r.data, up:+r.up||0, del:!!r.del}));
      for(let i=0; i<rows.length; i+=200) await sbRpc('push_records', {rows:rows.slice(i, i+200)});
      const acc = (d.members||[]).filter(m=>can('grantManager') || m.role!=='manager')
        .map(m=>({id:m.id, role:m.role, name:m.name, email:m.email, phone:m.phone, color:m.color, glow:m.glow,
          team:m.team||null, ig:m.ig||null, producer:m.producer||null, active:m.active!==false, up:+m.up||0}));
      if(acc.length) await sb('/members?on_conflict=id', {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
        body:JSON.stringify(acc)});
      S.cloud.pulledTs = 0; await sync(true);
    }
    render(); toast('Säkerhetskopian är tillbakaläst');
  }catch(e){ toast('Gick inte: ' + e.message); }
}
function backupCard(){
  const at = S.backupCfg.at;
  return `<div class="card">
    <div class="row"><div class="grow"><div class="studio-name">SÄKERHETSKOPIA</div>
      <div class="tiny ${backupDue()?'':'muted'}" style="margin-top:6px;${backupDue()?'color:var(--warn)':''}">${at

/* ---------- SYSTEMSTATUS ----------
   Allt som behöver fungera för att appen ska vara "på", på ett ställe. */
let outboxPeek = null, outboxPeekAt = 0;
function statusCard(){
  const rows = [];
  const R = (st, label, txt) => rows.push(`<div class="srow-s"><i class="sdot-${st}"></i><b>${label}</b><span>${txt}</span></div>`);
  if(PREVIEW_LOGIN) R('warn', 'Servern', 'Förhandsläge — Supabase är inte inkopplat');
  else R(syncState==='err' ? 'err' : 'ok', 'Servern', syncState==='err' ? esc(syncMsg) : 'Ansluten' + (syncMsg ? ' · ' + esc(syncMsg) : ''));
  R(S.pushCfg.publicKey ? 'ok' : 'warn', 'Push-nycklar', S.pushCfg.publicKey ? 'Uppsatta' : 'Saknas — skapa dem under Notiser');
  if(!PREVIEW_LOGIN){
    if(Date.now() - outboxPeekAt > 60000){ outboxPeekAt = Date.now();
      sb('/outbox?select=id,sent_at,channel,error,send_after&order=id.desc&limit=40').then(r=>{ outboxPeek = r||[]; if(view==='team') render(); }).catch(()=>{}); }
    const o = outboxPeek;
    if(!o) R('warn', 'Notisutskick', 'Läser…');
    else {
      const sent = o.filter(x=>x.sent_at).sort((a,b)=>String(b.sent_at).localeCompare(String(a.sent_at)))[0];
      const stuck = o.filter(x=>!x.sent_at && Date.now() - Date.parse(x.send_after) > 10*60000);
      const err = o.find(x=>x.error && x.error!=='skickas');
      R(stuck.length ? 'err' : 'ok', 'Notisutskick', stuck.length
        ? `${stuck.length} fastnar i kön${err ? ' — ' + esc(String(err.error).slice(0,80)) : ' — kolla edge-funktionen och db/05'}`
        : sent ? 'Senast ' + new Date(sent.sent_at).toLocaleString('sv-SE',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) + ' (' + esc(sent.channel||'mejl') + ')'
        : 'Inget skickat än');
    }
  }
  R(dbxReady() ? 'ok' : 'warn', 'Dropbox', dbxReady() ? 'Uppsatt och kopplat här' : S.dropbox.setupAt ? 'Uppsatt — inte kopplat på den här enheten' : 'Inte uppsatt');
  R(S.backupCfg.at && !backupDue() ? 'ok' : 'warn', 'Säkerhetskopia', S.backupCfg.at ? new Date(S.backupCfg.at).toLocaleDateString('sv-SE') : 'Aldrig');
  return `<div class="card statuscard">${rows.join('')}</div>`;
}

async function deletePerson(id){

  if(!confirm(`Radera ${a.n}?\n\nKontot och inloggningen försvinner. Namnet tas bort från gamla pass, men passen och cirkeltimmarna ligger kvar. Det går inte att ångra.`)) return;
  try{
    if(PREVIEW_LOGIN) deleteLocally(a);
    else { await sbRpc('delete_member', {p_id:id}); deleteLocally(a); await sync(true); }
    closeSheet(); buildNav(); render(); toast(a.n + ' är raderad');
  }catch(e){ toast(e.message); }
}
/* Samma regler som delete_member i databasen. */
function deleteLocally(a){
  const gone = 'Raderad person';
  S.bookings.forEach(b=>{ let ch = false;
    if(b.who===a.n){ b.who = gone; ch = true; }
    if((b.with||[]).includes(a.n)){ b.with = b.with.filter(n=>n!==a.n); ch = true; }
    if(ch) bump(b); });
  S.circles.forEach(c=>{ let ch = false;
    if(c.leader===a.n){ c.leader = ''; ch = true; }
    if((c.members||[]).includes(a.id)){ c.members = c.members.filter(x=>x!==a.id); ch = true; }
    if(ch) bump(c); });
  S.agenda.forEach(x=>{ if(x.who===a.n) bump(Object.assign(x, {del:true})); });
  S.goals.forEach(x=>{ if(x.owner===a.id) bump(Object.assign(x, {del:true})); });
  S.plans.forEach(x=>{ if(x.id===a.id) bump(Object.assign(x, {del:true})); });
  S.beats.forEach(x=>{ if(x.who===a.n) bump(Object.assign(x, {who:gone})); });
  (S.media||[]).forEach(x=>{ if(x.by===a.id) bump(Object.assign(x, {by:''})); });
  S.accounts = S.accounts.filter(x=>x.id!==a.id);
  save();
}

let addDraft = null;
function openAddPerson(role, existingId){

    : {role: role || 'producer', circle:(lcircle()[0]||{}).id||'', team:'', producer:''};

function paintAddPerson(){

/* Cirkeln en deltagare är med i, eller som en ledare leder — för inbjudan. */
function inviteCircleFor(a){
  if(!a) return null;
  const c = a.r==='participant' ? lcircle().find(c=>(c.members||[]).includes(a.id))
          : a.r==='leader' ? lcircle().find(c=>c.leader===a.n) : null;
  return c ? c.id : null;
}
const ROLE_HELP = {
  manager:'Ser och styr allt, även allas mål och statistik.',
  admin:'Sköter konton, inbjudningar, cirklar, schemat och artister. Ser inte allas mål och statistik.',
  producer:'Crewets vy: bokar studio, beats, agenda, och leder de cirklar hen tilldelas.',
  camera:'Ser schemat, har sin agenda och laddar upp bilder och film i galleriet.',
  leader:'Bokar pass för sina cirklar och når sina medlemmar.',
  participant:'Ser sin läroplan och föreslår tider med sin cirkelledare.',
  customer:'Ser lediga studiotider och skickar bokningsförfrågningar.'};
async function saveAddPerson(){
  const d = addDraft, ex = d.id ? byId(d.id) : null;
  const name = ex ? ex.n : (d.name||'').trim(), em = String(d.email||'').trim().toLowerCase();
  if(name.length < 2) return toast('Fyll i namn');
  if(!PREVIEW_LOGIN && !EMAIL_RE.test(em)) return toast('Fyll i en e-postadress — inbjudan kommer som mejl');
  if(em && !EMAIL_RE.test(em)) return toast('E-postadressen ser fel ut');
  if(!ex && accounts().some(a=>a.n.toLowerCase()===name.toLowerCase())) return toast('Namnet finns redan');
  const circle = (d.role==='leader'||d.role==='participant') ? (d.circle || (document.getElementById('apC')||{}).value) : null;
  if((d.role==='leader'||d.role==='participant') && !circle) return toast('Skapa en cirkel först');
  const team = d.role==='camera' ? (d.team||'') : '', producer = d.role==='customer' ? (d.producer||'') : '';
  /* personen läggs in (eller uppdateras) först — inbjudan kopplas sedan till raden */
  let acc = ex;
  if(!acc){
    const pal = PALETTE[S.accounts.length % PALETTE.length], tm = isTeamRole(d.role);
    acc = bump({id:'m_'+uid(), n:name, r:d.role, email:em, phone:'', team, producer,
      c: tm?pal[0]:'#6633b8', g: tm?pal[1]:'#9d5cf5', active:true, del:false, login:false});
    S.accounts.push(acc);
    const c = circle ? circleById(circle) : null;
    if(c && d.role==='participant'){ c.members = (c.members||[]).concat(acc.id); bump(c); }
    if(c && d.role==='leader'){ c.leader = acc.n; bump(c); }
  } else {
    bump(Object.assign(acc, {email:em || acc.email}, d.role==='camera' ? {team} : {}, d.role==='customer' ? {producer} : {}));
  }
  save();
  try{
    if(!PREVIEW_LOGIN) await pushMember(acc);
    const tok = await createInvite(d.role, circle, 14, 1, {member:acc.id, email:em, team});
    invListAt = 0; refreshInvites(true);
    document.getElementById('apOut').innerHTML = PREVIEW_LOGIN
      ? `<div class="okbox"><b>${esc(name)} är tillagd.</b> I drift går inbjudan som mejl — här kan du prova länken direkt.</div>
         <button class="btn ghost slim" style="margin-top:9px" onclick="copy(inviteUrl('${tok}'),'Länken kopierad')">KOPIERA LÄNKEN</button>`
      : `<div class="okbox"><b>Klart.</b> ${esc(name)} får ett mejl till <b>${esc(em)}</b> inom någon minut.
          Länken gäller i 14 dagar.</div>
         <button class="btn ghost slim" style="margin-top:9px" onclick="copy(inviteUrl('${tok}'),'Länken kopierad')">KOPIERA LÄNKEN OCKSÅ</button>`;
    if(!ex){ addDraft.name = ''; addDraft.email = ''; }
    buildNav(); render(); sync(true);
  }catch(e){ toast(e.message); }
}

/* ---------- INBJUDNINGAR I CREW ----------
   Alla som finns i appen men inte har loggat in, med e-post och status. */
let invList = null, invListAt = 0, invAll = false;
function refreshInvites(force){
  if(!can('manageCrew')) return;
  if(!force && Date.now() - invListAt < 60000) return;
  invListAt = Date.now();
  listInvites().then(r=>{ invList = r || []; if(view==='team') render(); }).catch(()=>{});
}
const invCreated = i => +new Date(i.created_at || i.created || 0);
function inviteStatus(a){
  const i = (invList||[]).filter(x=>x.member_id===a.id).sort((x,y)=>invCreated(y)-invCreated(x))[0];
  if(!i) return {txt:'inte inbjuden', open:false};
  const st = inviteState(i);
  if(st.ok) return {txt:'inbjuden ' + new Date(invCreated(i)).toLocaleDateString('sv-SE',{day:'numeric',month:'short'})
    + (i.role && i.role!==a.r ? ' som ' + (ROLE_NAME[i.role]||i.role).toLowerCase() : ''), open:true};
  return {txt: st.why.replace(/^Länken /, 'länken ').toLowerCase(), open:false};
}
const waitingAccounts = () => S.accounts.filter(a=>a.active!==false && !a.del && !a.login && a.r!=='manager')
  .sort((x,y)=>ROLES.indexOf(x.r)-ROLES.indexOf(y.r) || x.n.localeCompare(y.n,'sv'));
const inviteReady = a => a.email && !inviteStatus(a).open && INVITE_ROLES[a.r]
  && (!['leader','participant'].includes(a.r) || inviteCircleFor(a));
function invitesSection(){
  const w = waitingAccounts(); if(!w.length) return '';
  refreshInvites();
  const ready = w.filter(inviteReady);
  return `<div class="eyebrow">INBJUDNINGAR<span class="ln"></span><span style="color:var(--warn)">${w.length}</span></div>
    <div class="card">
      <div class="tiny muted" style="line-height:1.55;margin-bottom:6px">De här finns i appen men har inte loggat in.
        Skicka en inbjudan — de väljer användarnamn och lösenord och skriver in en kod från mejlet.</div>
      ${(invAll ? w : w.slice(0,5)).map(a=>{ const st = inviteStatus(a); return `<div class="member invrow" style="cursor:default">${avatar(a)}
        <div class="grow"><div class="mname">${esc(a.n)}</div>
          <div class="mrole">${ROLE_NAME[a.r]} · ${a.email ? esc(a.email) : '<span style="color:var(--warn)">ingen e-post</span>'} · ${esc(st.txt)}</div></div>
        <button class="btn slim ${st.open?'ghost':''}" style="width:auto;flex:none;padding:9px 12px" onclick="openAddPerson(null,'${a.id}')">${st.open?'IGEN':'BJUD IN'}</button>
      </div>`; }).join('')}
      ${w.length > 5 ? `<button class="linkbtn" style="margin-top:4px" onclick="invAll=!invAll;render()">${invAll ? 'Visa färre' : 'Visa alla ' + w.length}</button>` : ''}
      ${ready.length ? `<button class="btn" style="margin-top:12px" onclick="inviteAll()">SKICKA TILL ALLA MED E-POST (${ready.length})</button>` : ''}
    </div>`;
}
async function inviteAll(){
  const ready = waitingAccounts().filter(inviteReady);
  if(!ready.length || !confirm(`Skicka inbjudan till ${ready.length} ${ready.length===1?'person':'personer'}?`)) return;
  let n = 0; const errs = [];
  for(const a of ready){
    try{ await createInvite(a.r, inviteCircleFor(a), 14, 1, {member:a.id, email:a.email, team:a.team||''}); n++; }
    catch(e){ errs.push(a.n + ': ' + e.message); }
  }
  invListAt = 0; refreshInvites(true); render();
  toast(n + ' ' + (n===1?'inbjudan skickad':'inbjudningar skickade') + (errs.length ? ' · ' + errs.length + ' gick inte' : ''));
  if(errs.length) setTimeout(()=>toast(errs[0]), 2600);
}

/* =====================================================================
   MANAGERDASHBOARD
   Diagramreglerna som styr här:
   · "Timmar per producent" är EN serie över nominella kategorier → alla
     staplar bär samma hue. Identiteten bärs av namnet + prickens färg,
     inte av stapelfärgen (att färga staplar efter värde slösar bort
     identitetskanalen på det stapellängden redan visar).
   · Studio A/B är två riktiga serier → två validerade kategoriska slots,
     med både legend och direktetiketter.
   · Värmekartan är magnitud → en hue, ljus→mörk, aldrig regnbåge.
   · Siffror och etiketter bär textfärger, aldrig seriefärgen.
   ===================================================================== */

function periodRange(p, back){
  const now = new Date(); let from, to, label;
  if(p==='week'){
    from = addDays(monday(now), back?-7:0); to = addDays(from,7);
    label = back?'förra veckan':'denna vecka';
  } else if(p==='month'){
    const mo = now.getMonth() - (back?1:0);
    from = new Date(now.getFullYear(), mo, 1); to = new Date(now.getFullYear(), mo+1, 1);
    label = back?'förra månaden':'denna månad';
  } else {
    to = addDays(new Date(now.getFullYear(),now.getMonth(),now.getDate()), back?-90:1);
    from = addDays(to,-90); label = back?'föregående 90 dagar':'senaste 90 dagarna';
  }
  return {from, to, label};
}
function inRange(b, r){ const s=startAt(b); return s>=r.from && s<r.to; }
function rateFor(who){ const p=S.rates.per||{}; return +(p[who] ?? S.rates.default ?? 0) || 0; }
function revenue(list){ return list.filter(b=>b.paid).reduce((a,b)=>a+dur(b)*rateFor(b.who),0); }

function vDash(){
  const r = periodRange(period), rp = periodRange(period, true);
  const cur = booked().filter(b=>inRange(b,r)), prev = booked().filter(b=>inRange(b,rp));
  const H = l => l.reduce((a,b)=>a+dur(b),0);
  const hours = H(cur), pHours = H(prev);
  const days = Math.max(1, Math.round((r.to-r.from)/864e5));
  const cap = days * 2 * 14;                       /* två studios, 14 rimliga timmar per dygn */
  const util = cap ? hours/cap*100 : 0;
  const pCap = Math.max(1, Math.round((rp.to-rp.from)/864e5)) * 2 * 14;
  const rev = revenue(cur), pRev = revenue(prev);
  const noRates = !S.rates.default && !Object.keys(S.rates.per||{}).length;

  const money = can('seeRevenue');
  const rel = lreleases().filter(x=>x.date && x.date>=iso(r.from) && x.date<iso(r.to));
  const pRel = lreleases().filter(x=>x.date && x.date>=iso(rp.from) && x.date<iso(rp.to));
  return `
    <div class="h1">Statistik</div>
    <div class="sub">Hela crewet, ${r.label}. Bara du ser den här vyn.</div>
    <div class="seg">
      ${[['week','VECKA'],['month','MÅNAD'],['90','90 DAGAR']].map(([k,l])=>
        `<button class="${period===k?'on':''}" onclick="period='${k}';render()">${l}</button>`).join('')}
    </div>

    <div class="kpis">
      ${kpi('TIMMAR I STUDION', hours, pHours, 'h', 1)}
      ${kpi('PASS', cur.length, prev.length, '', 0)}
      ${kpi('BELÄGGNING', util, pCap?pHours/pCap*100:0, '%', 0)}
      ${money ? kpi('INTÄKT', rev, pRev, ' kr', 0) : kpi('SLÄPP', rel.length, pRel.length, '', 0)}
    </div>
    ${money && noRates ? `<div class="note">Intäkten står på 0 kr tills du lagt in ett pris.
      Sätt kr/timme under <b>Crew → Prislista</b> och kryssa <b>betald session</b> på passen —
      då räknas den här rutan och kolumnen i tabellen automatiskt.</div>` : ''}

    <div class="dash-grid">
    <section class="dsec"><div class="eyebrow">TIMMAR PER PRODUCENT<span class="ln"></span></div>
    <div class="card">${barsPerProducer(cur, prev)}</div></section>

    <section class="dsec"><div class="eyebrow">VEM JOBBAR MED VEM<span class="ln"></span></div>
    <div class="card">${collabTop(cur, prev)}${collabMatrix(cur)}</div></section>

    <section class="dsec full"><div class="eyebrow">ARTISTER · SLÄPP · STREAMS<span class="ln"></span></div>
    <div class="card"><div class="scrollx">${artistTable()}</div>
      <div class="tiny muted" style="margin-top:10px">Pass per släpp räknas på allt som hänt,
        inte bara perioden — det är kvoten som visar hur mycket som krävs för att släppa.</div></div></section>

    <section class="dsec"><div class="eyebrow">STUDIOBELÄGGNING<span class="ln"></span></div>
    <div class="card">${studioBars(cur, days)}</div></section>

    <section class="dsec"><div class="eyebrow">NÄR STUDION FAKTISKT ANVÄNDS<span class="ln"></span></div>
    <div class="card">${heatmap(cur)}</div></section>

    <section class="dsec full"><div class="eyebrow">ALLA SIFFROR<span class="ln"></span></div>
    <div class="card"><div class="scrollx">${table(cur, prev)}</div>
      <div class="tiny muted" style="margin-top:10px">Dra i sidled för fler kolumner.</div></div></section>
    </div>
  `;
}

function kpi(label, val, prev, unit, dec){
  /* Ett tal som redan ÄR en procent jämförs i procentenheter — annars blir
     "8 % mot 2 %" till "+325 %", vilket låter enormt och betyder ingenting. */
  const pct = unit==='%';
  const d = pct ? (val-prev) : (prev ? (val-prev)/prev*100 : (val?100:0));
  const flat = pct ? Math.abs(d)<0.5 : Math.abs(d)<1;
  const dir = flat ? 'flat' : d>0 ? 'up' : 'down';
  const arrow = dir==='up' ? '▲' : dir==='down' ? '▼' : '▬';
  const change = !prev && !pct ? 'nytt'
    : flat ? 'oförändrat'
    : pct ? (d>0?'+':'−') + hh(Math.abs(d)) + ' p.e.'
    : Math.abs(Math.round(d)) + '%';
  return `<div class="kpi">
    <em>${label}</em>
    <b><span class="cnt" data-to="${val}" data-dec="${dec}">${dec?hh(val):Math.round(val)}</span><u>${unit}</u></b>
    <span class="dlt ${dir}">${arrow} ${change}
      <span style="color:var(--mut2);font-weight:600">mot ${dec||pct?hh(prev):Math.round(prev)}${unit}</span></span>
  </div>`;
}

/* En serie över nominella kategorier → samma hue på alla staplar.
   Identiteten sitter i namnet och pricken bredvid, inte i stapelfärgen. */
function barsPerProducer(cur, prev){
  /* En producent som var MED på någon annans pass var också i studion. */
  const rows = crew().map(c=>({
    c, h: cur.filter(b=>crewOn(b).includes(c.n)).reduce((a,b)=>a+dur(b),0),
       p: prev.filter(b=>crewOn(b).includes(c.n)).reduce((a,b)=>a+dur(b),0)
  })).sort((a,b)=>b.h-a.h);
  const max = Math.max(1, ...rows.map(r=>r.h));
  if(!rows.some(r=>r.h)) return `<div class="empty" style="border:0">Inga pass i perioden.</div>`;
  const RH = 42, W = 340, L = 0, BW = W;
  const h = rows.length*RH + 6;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${h}" role="img"
      aria-label="Timmar i studion per producent, ${rows.map(r=>r.c.n+' '+hh(r.h)+' timmar').join(', ')}">
    ${rows.map((r,i)=>{
      const y = i*RH, w = Math.max(r.h>0?3:0, r.h/max*BW);
      const d = r.p ? Math.round((r.h-r.p)/r.p*100) : null;
      return `<g>
        <circle cx="4" cy="${y+8}" r="4" fill="${r.c.c}"/>
        <text class="ct-lab" x="14" y="${y+12}">${esc(r.c.n)}</text>
        <text class="ct-val" x="${W}" y="${y+12}" text-anchor="end">${hh(r.h)} h${
          d!==null && r.h ? `<tspan class="ct-ax" dx="6">${d>0?'+':''}${d}%</tspan>` : ''}</text>
        <rect x="${L}" y="${y+20}" width="${BW}" height="9" rx="4.5" fill="rgba(255,255,255,.05)"/>
        <rect x="${L}" y="${y+20}" width="${w}" height="9" rx="4.5" fill="var(--c1)"/>
      </g>`;
    }).join('')}
  </svg></div>
  <div class="tiny muted" style="margin-top:10px">Staplarna delar färg med flit — längden bär siffran,
    pricken bär personen. Procenten jämför mot ${periodRange(period,true).label}.
    Ett pass räknas på alla som var med, så staplarna kan tillsammans bli fler än studiotimmarna.</div>`;
}

/* Två riktiga serier → två kategoriska slots, legend + direktetiketter. */
function studioBars(cur, days){
  const cap = days*14;
  const data = ['A','B'].map(s=>({s, h:cur.filter(b=>b.studio===s).reduce((a,b)=>a+dur(b),0)}));
  const max = Math.max(1, cap, ...data.map(d=>d.h));
  const W=340, RH=52;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${data.length*RH}" role="img"
      aria-label="Beläggning per studio: ${data.map(d=>S.studios[d.s]+' '+hh(d.h)+' av '+cap+' timmar').join(', ')}">
    ${data.map((d,i)=>{
      const y=i*RH, w=Math.max(d.h>0?3:0, d.h/max*W);
      return `<g>
        <text class="ct-lab" x="0" y="${y+12}">${esc(S.studios[d.s])}</text>
        <text class="ct-val" x="${W}" y="${y+12}" text-anchor="end">${hh(d.h)} h
          <tspan class="ct-ax" dx="4">av ${cap}</tspan></text>
        <rect x="0" y="${y+20}" width="${W}" height="11" rx="5.5" fill="rgba(255,255,255,.05)"/>
        <rect x="0" y="${y+20}" width="${w}" height="11" rx="5.5" fill="${SC[d.s]}"/>
        <text class="ct-ax" x="0" y="${y+44}">${Math.round(d.h/cap*100)}% av rimlig kapacitet</text>
      </g>`;
    }).join('')}
  </svg></div>
  <div class="legend">${['A','B'].map(s=>
    `<span><i style="background:${SC[s]}"></i>${esc(S.studios[s])}</span>`).join('')}</div>`;
}

/* Magnitud → en hue, ljus→mörk. Tomma rutor sjunker mot ytan. */
const BLOCKS = [[0,4,'00–04'],[4,8,'04–08'],[8,12,'08–12'],[12,16,'12–16'],[16,20,'16–20'],[20,24,'20–24']];
function heatmap(cur){
  const g = BLOCKS.map(()=>[0,0,0,0,0,0,0]);
  cur.forEach(b=>{
    let t = startAt(b); const e = endAt(b);
    while(t < e){                                  /* timme för timme, så nattpass hamnar rätt dygn */
      const wd = (t.getDay()+6)%7, hr = t.getHours();
      const bi = BLOCKS.findIndex(x=>hr>=x[0] && hr<x[1]);
      const nxt = new Date(t); nxt.setHours(hr+1,0,0,0);
      if(bi>=0) g[bi][wd] += (Math.min(nxt,e)-t)/36e5;
      t = nxt;
    }
  });
  const max = Math.max(...g.flat(), 0);
  if(!max) return `<div class="empty" style="border:0">Inga pass i perioden.</div>`;
  const step = v => v<=0 ? SEQ[0] : SEQ[Math.min(SEQ.length-1, 1+Math.floor(v/max*(SEQ.length-1.001)))];
  return `
    <div style="display:grid;grid-template-columns:44px repeat(7,1fr);gap:2px;align-items:center">
      <span></span>${DAY.slice(1).concat(DAY[0]).map(d=>
        `<span class="ct-ax" style="text-align:center;font-size:9px;color:var(--mut2);font-weight:800">${d}</span>`).join('')}
      ${BLOCKS.map((bk,i)=>`
        <span class="ct-ax" style="font-size:9px;color:var(--mut2);font-weight:800">${bk[2]}</span>
        ${g[i].map((v,j)=>`<div class="hm-cell" style="background:${step(v)}"
          title="${DAY[(j+1)%7]} ${bk[2]} · ${hh(v)} h"></div>`).join('')}`).join('')}
    </div>
    <div class="hm-scale">0 h ${SEQ.map(c=>`<i style="background:${c}"></i>`).join('')} ${hh(max)} h</div>
    <div class="tiny muted" style="margin-top:8px">Mörkt = tomt, ljust = fullt. Nattpass räknas
      på den timme de faktiskt pågår, så 22–02 landar i två block.</div>`;
}

/* "Flest pass ihop" — paren i ordning, med förändring mot förra perioden.
   Det är den raka läsningen av mönstret; matrisen under visar helheten. */
function pairCounts(list){
  const pair = {};
  list.forEach(b=>{ const on = [...new Set(crewOn(b))].sort();
    for(let i=0;i<on.length;i++) for(let j=i+1;j<on.length;j++){ const k = on[i]+'|'+on[j]; pair[k] = (pair[k]||0)+1; } });
  return pair;
}
function collabTop(cur, prev){
  const now = pairCounts(cur), before = pairCounts(prev||[]);
  const rows = Object.entries(now).sort((a,b)=>b[1]-a[1]).slice(0,6);
  if(!rows.length) return '';
  const max = rows[0][1];
  return `<div class="ctop">${rows.map(([k,v],i)=>{ const [a,b] = k.split('|'), d = v - (before[k]||0);
    return `<div class="ctop-r">
      <span class="ctop-i">${i+1}</span>
      <span class="ctop-n"><span style="color:${glow(a)}">${esc(a)}</span> <span class="muted">+</span> <span style="color:${glow(b)}">${esc(b)}</span></span>
      <span class="ctop-b"><i style="width:${v/max*100}%"></i></span>
      <b class="nums">${v}</b>
      <span class="ctop-d ${d>0?'up':d<0?'down':'flat'}">${d>0?'▲ '+d:d<0?'▼ '+(-d):'–'}</span></div>`; }).join('')}
    <div class="tiny muted" style="margin:8px 0 14px">Pass där båda var med, jämfört med föregående period.</div></div>`;
}
/* Vem jobbar med vem: rutan i rad A, kolumn B = pass där båda var med.
   Magnitud → en hue ljus→mörk, samma ramp som värmekartan. Diagonalen är
   tom med flit — "RKAY med RKAY" är inget samarbete. */
function collabMatrix(cur){
  const ppl = crew();
  const pair = {}, key = (a,b)=>[a,b].sort().join('|');
  cur.forEach(b=>{
    const on = [...new Set(crewOn(b))];
    for(let i=0;i<on.length;i++) for(let j=i+1;j<on.length;j++){
      const k = key(on[i],on[j]); pair[k] = (pair[k]||0)+1;
    }
  });
  const max = Math.max(0, ...Object.values(pair));
  if(!max) return `<div class="empty" style="border:0">Inga gemensamma pass i perioden.<br>
    <span class="tiny">Kryssa i <b>MED</b> när ni bokar, så syns mönstren här.</span></div>`;
  const step = v => v<=0 ? 'rgba(255,255,255,.03)' : SEQ[Math.min(SEQ.length-1, 1+Math.floor(v/max*(SEQ.length-1.001)))];
  const short = n => n.length>5 ? n.slice(0,4)+'.' : n;
  const top = Object.entries(pair).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return `
    <div class="scrollx"><div style="display:grid;grid-template-columns:56px repeat(${ppl.length},minmax(30px,1fr));
      gap:3px;align-items:center;min-width:${56+ppl.length*34}px">
      <span></span>${ppl.map(c=>`<span class="ct-ax" style="text-align:center;font-size:9px;font-weight:800;
        color:var(--mut)">${esc(short(c.n))}</span>`).join('')}
      ${ppl.map(r=>`<span style="font-size:10px;font-weight:800;color:var(--mut);letter-spacing:.04em;
          display:flex;align-items:center;gap:5px"><i style="width:7px;height:7px;border-radius:50%;
          background:${r.c};flex:none"></i>${esc(short(r.n))}</span>
        ${ppl.map(c=>{
          if(r.n===c.n) return `<div style="aspect-ratio:1;border-radius:5px;background:transparent;
            border:1px dashed var(--line3)"></div>`;
          const v = pair[key(r.n,c.n)]||0;
          return `<div title="${esc(r.n)} + ${esc(c.n)}: ${v} pass" style="aspect-ratio:1;border-radius:5px;
            background:${step(v)};display:grid;place-items:center;font-size:10.5px;font-weight:800;
            color:${v/max>.55?'#0a0713':'var(--txt)'}">${v||''}</div>`;}).join('')}`).join('')}
    </div></div>
    <div class="hm-scale" style="margin-top:12px">0 ${SEQ.slice(1).map(c=>`<i style="background:${c}"></i>`).join('')} ${max} pass</div>
    <div class="eyebrow" style="margin-top:18px">FLEST PASS IHOP<span class="ln"></span></div>
    ${top.map(([k,v],i)=>{ const [a,b] = k.split('|');
      return `<div class="kv" style="${i===top.length-1?'border:0':''}"><span>
        <span style="color:${glow(a)}">${esc(a)}</span> <span style="color:var(--mut2)">+</span>
        <span style="color:${glow(b)}">${esc(b)}</span></span><b>${v} pass</b></div>`;}).join('')}`;
}

function artistTable(){
  const rows = artistsRanked().map(a=>Object.assign({a, r:rankOf(a.id), p:prioOf(a)}, artistStats(a.id)));
  if(!rows.length) return `<div class="empty" style="border:0">Inga artister inlagda än — lägg in dem under Mer → Artister.</div>`;
  return `<table class="tbl">
    <thead><tr><th class="l">PRIO</th><th class="l">ARTIST</th><th>SESSIONS</th><th>TIM</th><th>LÅTAR SLÄPPTA</th><th>SESS./LÅT</th><th>STREAMS</th><th>STR/LÅT</th></tr></thead>
    <tbody>${rows.map(r=>`<tr onclick="openArtist('${r.a.id}')" style="cursor:pointer">
      <td class="l ${r.p===1?'hl':''}">${r.p} · #${r.r}</td><td class="l" style="font-weight:700">${esc(r.a.n)}</td>

function table(cur, prev){
  const rows = crew().map(c=>{
    const l = cur.filter(b=>crewOn(b).includes(c.n));
    const h = l.reduce((a,b)=>a+dur(b),0);
    const last = booked().filter(b=>crewOn(b).includes(c.n) && startAt(b)<=new Date())
      .sort((a,b)=>startAt(b)-startAt(a))[0];
    return {c, n:l.length, h, avg: l.length?h/l.length:0,
      files: lbeats().filter(f=>f.who===c.n).length,
      rev: revenue(l), last};
  }).sort((a,b)=>b.h-a.h);
  return `<table class="tbl">
    <thead><tr><th>PERSON</th><th>PASS</th><th>TIM</th><th>SNITT</th><th>BEATS</th>${can('seeRevenue')?'<th>INTÄKT</th>':''}<th>SENAST</th></tr></thead>

/* Siffrorna räknas upp när vyn ritas. Uppräkningen är ren dekor — det som
   spelar roll är att den ALLTID landar på rätt tal. Går klockan inte framåt
   (bakgrundsflik, fryst virtuell tid vid test) eller stryps rAF, snappar vi
   till slutvärdet i stället för att lämna en halvfärdig siffra på skärmen. */
function countUp(){
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  document.querySelectorAll('.cnt').forEach(el=>{
    const to = +el.dataset.to, dec = +el.dataset.dec;
    const final = dec ? hh(to) : String(Math.round(to));
    const land = () => { el.textContent = final; };
    if(reduce || !isFinite(to) || to===0) return land();
    const t0 = performance.now(), D = 620;
    let frames = 0, done = false;
    const finish = () => { if(!done){ done = true; land(); } };
    const tick = t => {
      if(done) return;
      const k = Math.min(1, (t-t0)/D);
      if(k>=1 || ++frames > 90) return finish();     /* 90 bildrutor ≈ 1,5 s */
      const e = 1-Math.pow(1-k,3);
      el.textContent = dec ? hh(to*e) : Math.round(to*e);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    setTimeout(finish, D+240);                        /* sista skyddsnätet */
  });
}

/* Lediga tider: studions öppettid minus det som är bokat, i block om minst en timme. */
/* Öppettiderna ställs in under Crew → Studios (sparas med studionamnen). */
const openFrom = () => /^\d\d:\d\d$/.test(S.studios.openFrom||'') ? S.studios.openFrom : '10:00';
const openTo   = () => /^\d\d:\d\d$/.test(S.studios.openTo||'') ? S.studios.openTo : '23:00';
const toMin = t => { const [h,m] = String(t).split(':').map(Number); return h*60 + (m||0); };
const toHm  = n => String(Math.floor(n/60)).padStart(2,'0') + ':' + String(n%60).padStart(2,'0');
function freeBlocks(date, studio, busyList){
  const busy = (busyList || booked()).filter(b=>b.date===date && b.studio===studio)
    .map(b=>[toMin(b.start), toMin(b.end) <= toMin(b.start) ? 24*60 : toMin(b.end)]).sort((x,y)=>x[0]-y[0]);
  let from = toMin(openFrom()); const to = toMin(openTo()) || 24*60, out = [];
  if(date === iso(new Date())){ const n = new Date(); from = Math.max(from, Math.ceil((n.getHours()*60 + n.getMinutes())/30)*30 + 30); }
  for(const [s0, e0] of busy){ if(s0 - from >= 60) out.push([from, Math.min(s0, to)]); from = Math.max(from, e0); }
  if(to - from >= 60) out.push([from, to]);
  return out.filter(([x,y])=>y-x>=60).map(([x,y])=>({start:toHm(x), end:toHm(y)}));
}
let custDay = null;
function vCustomer(){
  const m = me(), now = new Date();
  const mine = live().filter(b=>b.who===m.n && !b.busy).sort((a,b)=>startAt(a)-startAt(b));
  const waiting = mine.filter(b=>b.status==='request' && endAt(b)>now);
  const upcoming = mine.filter(b=>b.status!=='request' && b.status!=='declined' && endAt(b)>now);
  const past = mine.filter(b=>b.status!=='request' && b.status!=='declined' && endAt(b)<=now).reverse();
  const rate = rateFor(m.n), prod = S.myProducer || (byId(m.producer)||{}).n || '';
  const days = [...Array(14)].map((_,i)=>iso(addDays(now, i)));
  if(!custDay || !days.includes(custDay)) custDay = days.find(d=>['A','B'].some(st=>freeBlocks(d, st).length)) || days[0];
  const row = (b, act) => `<div class="srow ${b.status==='request'?'req':''}">
      <div class="srow-d"><b>${fromIso(b.date).getDate()}</b><span>${MON[fromIso(b.date).getMonth()]}</span></div>
      <div class="grow" style="min-width:0"><div class="srow-t">${DAY2[fromIso(b.date).getDay()]} · ${b.start}–${b.end}</div>
        <div class="srow-m">${esc(S.studios[b.studio]||'')}${rate?' · '+Math.round(dur(b)*rate)+' kr':''}${b.status==='request'?' · väntar på svar':''}</div></div>
      ${act||''}</div>`;
  const sm = (label, js) => `<button class="btn ghost slim" style="width:auto;flex:none;padding:9px 13px" onclick="${js}">${label}</button>`;
  return `
    <div class="h1">Boka studio</div>
    <div class="sub">${rate?hh(rate)+' kr per timme':'Pris enligt överenskommelse'}${prod?` · din producent är <b>${esc(prod)}</b>`:''}</div>

    <div class="eyebrow" style="margin-top:0">LEDIGA TIDER<span class="ln"></span></div>
    <div class="chips">${days.map(d=>{ const n = ['A','B'].reduce((a,st)=>a+freeBlocks(d, st).length, 0);
      return `<button class="chip ${custDay===d?'on':''}" ${n?'':'disabled style="opacity:.4"'} onclick="custDay='${d}';render()">${
        relDay(d) ? relDay(d).toLowerCase().replace(/^./,c=>c.toUpperCase()) : DAY2[fromIso(d).getDay()] + ' ' + fromIso(d).getDate() + '/' + (fromIso(d).getMonth()+1)}</button>`; }).join('')}</div>
    ${['A','B'].map(st=>{ const fb = freeBlocks(custDay, st);
      return `<div class="card" style="margin-bottom:var(--s2)"><div class="studio-name">${esc(S.studios[st])}</div>
        ${fb.length ? `<div class="chips wrap" style="margin-top:10px">${fb.map(f=>`<button class="chip slot" onclick="openCustRequest('${custDay}','${st}','${f.start}','${f.end}')">${f.start}–${f.end}</button>`).join('')}</div>`
          : `<div class="tiny muted" style="margin-top:8px">Fullbokat den här dagen.</div>`}</div>`; }).join('')}
    <div class="note">Tryck på en ledig tid och skicka en förfrågan. Du får svar på mejlen — tiden är din först när den är bekräftad.</div>

    ${waiting.length?`<div class="eyebrow">VÄNTAR PÅ SVAR<span class="ln"></span><span style="color:var(--warn)">${waiting.length}</span></div>
      ${waiting.map(b=>row(b, sm('Ta tillbaka',`cancelRequest('${b.id}')`))).join('')}`:''}
    <div class="eyebrow">BOKADE<span class="ln"></span></div>
    ${upcoming.length ? upcoming.map(b=>row(b, sm('Avboka',`del('${b.id}')`))).join('') : `<div class="empty">Inga bekräftade bokningar än.</div>`}
    ${past.length?`<div class="eyebrow">TIDIGARE<span class="ln"></span></div>${past.slice(0,10).map(b=>row(b)).join('')}`:''}`;
}
function openCustRequest(date, studio, s0, e0){
  const end = toHm(Math.min(toMin(e0), toMin(s0) + 240));
  openSheet(`${X}<h2>Skicka förfrågan</h2>
    <div class="sub">${esc(longDate(date))} · ${esc(S.studios[studio])} · ledigt ${s0}–${e0}</div>

async function sendCustRequest(date, studio, s0, e0){
  const a = document.getElementById('crS').value, b = document.getElementById('crE').value, note = document.getElementById('crN').value.trim();
  const msg = t => document.getElementById('crMsg').innerHTML = `<div class="warn">${esc(t)}</div>`;
  if(!a || !b || toMin(b) <= toMin(a)) return msg('Sluttiden måste vara efter starttiden.');
  if(toMin(a) < toMin(s0) || toMin(b) > toMin(e0)) return msg(`Välj en tid mellan ${s0} och ${e0}.`);
  const m = me();
  const ok = await act('request_customer_slot', {p_date:date, p_start:a, p_end:b, p_studio:studio, p_note:note}, ()=>{
    S.bookings.push(bump({id:uid(), studio, date, start:a, end:b, who:m.n, title:'Studiotid', note, circleId:'',
      status:'request', reqBy:m.id, hours:null, present:[], with:[], artistId:'', paid:true, del:false}));
    save(); });
  if(!ok) return;
  closeSheet(); render(); toast('Förfrågan skickad — du får svar på mejlen'); sync(true);
}

async function approveLead(id, studio){
  const l = (S.leads||[]).find(x=>x.id===id); if(!l) return;
  try{
    if(PREVIEW_LOGIN){
      if(!freeAt(studio, l.date, l.start_t, l.end_t, null)) throw new Error('Studion hann bli upptagen');
      S.bookings.push(bump({id:uid(), studio, date:l.date, start:l.start_t, end:l.end_t, who:l.name, title:'Studiotid',
        note:l.message||'', circleId:'', status:'', hours:null, present:[], with:[], artistId:'', paid:true, leadId:l.id, del:false}));
      const tok = localToken();
      S.invites.push({token:tok, role:'customer', circle_id:null, expires_at:Date.now()+30*864e5, max_uses:1, uses:0,
        closed:false, created:Date.now(), name:l.name, email:l.email||null, lead_id:l.id});
      Object.assign(l, {status:'approved', invite:tok}); save();
      toast('Bokad · i drift får kunden ett mejl med länken');
    } else {
      await sbRpc('approve_lead', {p_lead:id, p_studio:studio, p_url:appUrl()});
      l.status = 'approved'; await sync(true);
      toast('Bokad · kunden får en bekräftelse med länken på mejlen');
    }
    closeSheet(); render();
  }catch(e){ toast(e.message); }
}
async function declineLead(id){
  const l = (S.leads||[]).find(x=>x.id===id); if(!l) return;
  if(!confirm(`Avböj ${l.name}? Kunden får ett mejl.`)) return;
  try{
    if(!PREVIEW_LOGIN) await sbRpc('decline_lead', {p_lead:id, p_reason:''});
    l.status = 'declined'; save(); closeSheet(); render(); toast('Avböjd');
  }catch(e){ toast(e.message); }
}

      <button class="btn" style="margin-top:20px" ${gateBusy?'disabled':''}>${gateBusy?'SKICKAR…':'SKICKA FÖRFRÅGAN'}</button>
      ${gateErrBox()}</form>` : ''}

function sendPublic(){
  const d = pubDraft, v = id => document.getElementById(id).value.trim();
  const f = {name:v('puN'), email:v('puM'), msg:v('puX'), hp:v('puH'), start:v('puS'), end:v('puE')};
  const agreed = (document.getElementById('puC')||{}).checked;
  return gateRun(async ()=>{
    if(!agreed) throw new Error('Kryssa i att du läst hur dina uppgifter hanteras');
    if(!f.start || !f.end || toMin(f.end) <= toMin(f.start)) throw new Error('Sluttiden måste vara efter starttiden');
    if(toMin(f.start) < toMin(d.block) || toMin(f.end) > toMin(d.bEnd)) throw new Error(`Välj en tid mellan ${d.block} och ${d.bEnd}`);
    if(!EMAIL_RE.test(f.email)) throw new Error('Fyll i din e-post — svaret kommer på mejlen');
    if(PREVIEW_LOGIN){
      if(f.hp) return;
      if(f.name.length < 2) throw new Error('Fyll i ditt namn');
      S.leads = (S.leads||[]).concat({id:'l_'+uid(), name:f.name, email:f.email, phone:'', date:d.day,
        start_t:f.start, end_t:f.end, studio:d.studio, message:f.msg, status:'new', created_at:new Date().toISOString()});
      save();
    } else {
      const r = await fetch(CLOUD.url + '/rest/v1/rpc/public_request', {method:'POST',
        headers:{apikey:CLOUD.key, 'Content-Type':'application/json'},
        body:JSON.stringify({p_name:f.name, p_email:f.email, p_phone:'', p_date:d.day, p_start:f.start, p_end:f.end,
          p_studio:d.studio, p_message:f.msg, p_hp:f.hp})});
      if(!r.ok) throw new Error(await sbErr(r));
    }
    Object.assign(d, {done:true, email:f.email, start:f.start, end:f.end});
  });
}
function leavePublic(){
  gateMode = 'login'; pubDraft = null; pubBusy = null; gateErr = '';
  if(location.hash==='#boka') history.replaceState(null, '', location.pathname + location.search);
  renderGate();
}

async function sendRequest(cid){
  const c = circleById(cid), m = me();
  const d = document.getElementById('rqD').value;
  const a = document.getElementById('rqS').value, b = document.getElementById('rqE').value;
  const msg = document.getElementById('rqMsg');
  if(!d || !a || !b){ msg.innerHTML = '<div class="warn">Fyll i datum och tid.</div>'; return; }
  if(a === b){ msg.innerHTML = '<div class="warn">Start och slut är samma tid.</div>'; return; }
  const ok = await act('request_session', {p_circle:cid, p_date:d, p_start:a, p_end:b}, ()=>{
    S.bookings.push({id:uid(), studio:'', date:d, start:a, end:b, who:c.leader,
      title:c.n, note:'', circleId:cid, status:'request', reqBy:m.id,
      hours:null, present:[], up:Date.now(), del:false, paid:false});
    save(); });
  if(!ok) return;
  closeSheet(); render(); toast('Förfrågan skickad till '+c.leader); sync(true);
}
async function cancelRequest(id){
  const b = S.bookings.find(x=>x.id===id); if(!b) return;
  if(b.reqBy !== (me()||{}).id) return toast('Det är inte din förfrågan');
  if(!confirm('Ta tillbaka förfrågan?')) return;
  if(!await act('cancel_my_booking', {p_booking:id}, ()=>{ b.del = true; b.up = Date.now(); save(); })) return;
  render(); toast('Förfrågan borttagen'); sync(true);
}

function openApprove(id){
  const b = S.bookings.find(x=>x.id===id); if(!b) return;
  if(!mayAnswer(b)) return toast('Bara cirkelns ledare kan svara');
  const who = byId(b.reqBy);
  const free = ['A','B'].filter(st=>freeAt(st, b.date, b.start, b.end, b.id));
  openSheet(`${X}
    <h2>Godkänn förfrågan</h2>

async function doApprove(id, studio){
  const b = S.bookings.find(x=>x.id===id); if(!b) return;
  if(!mayAnswer(b)) return toast('Bara cirkelns ledare kan svara');
  /* Kollas igen vid godkännandet — någon kan ha bokat tiden under tiden. */
  if(!freeAt(studio, b.date, b.start, b.end, b.id))
    return toast(S.studios[studio] + ' hann bli upptagen');
  if(!await act('answer_request', {p_booking:id, p_approve:true, p_studio:studio}, ()=>{
    Object.assign(b, {studio, status:'', up:Date.now()}); save(); })) return;
  closeSheet(); render();
  toast('Godkänd · ' + S.studios[studio] + ' bokad'); sync(true);
}
async function declineRequest(id){
  const b = S.bookings.find(x=>x.id===id); if(!b) return;
  if(!mayAnswer(b)) return toast('Bara cirkelns ledare kan svara');
  if(!confirm('Avböj förfrågan?')) return;
  if(!await act('answer_request', {p_booking:id, p_approve:false, p_studio:null}, ()=>{
    Object.assign(b, {status:'declined', up:Date.now()}); save(); })) return;
  closeSheet(); render(); toast('Avböjd'); sync(true);
}

    <label class="lbl" for="acK">KUNDENS PRODUCENT <span class="muted">(kund)</span></label>
    <select id="acK"><option value="">Ingen särskild</option>${producers().map(c=>`<option value="${c.id}" ${a&&a.producer===c.id?'selected':''}>${esc(c.n)}</option>`).join('')}</select>

    ${leads.length?`<div class="eyebrow">LEDER<span class="ln"></span></div>
      ${leads.map(c=>`<div class="kv"><span>CIRKEL</span><b>${esc(c.n)}</b></div>`).join('')}`:''}

    <button class="btn" style="margin-top:22px" onclick="saveAccount('${a?a.id:''}')">SPARA</button>
    ${a && a.id!==(me()||{}).id ? `
      ${can('grantManager') ? `<button class="btn danger" style="margin-top:9px" onclick="deletePerson('${a.id}')">RADERA PERSON</button>` : ''}
      <button class="btn ghost" style="margin-top:9px" ${a.r==='manager'&&!can('grantManager')?'disabled':''} onclick="toggleActive('${a.id}')">
        ${a.active===false?'AKTIVERA IGEN':'STÄNG AV KONTOT'}</button>

function pickRole(r){
  document.getElementById('acR').value = r;
  document.querySelectorAll('.chip.role').forEach(el=>el.classList.toggle('on', el.dataset.r===r));
  paintRoleNote();
}
function paintRoleNote(){
  const r = document.getElementById('acR').value;
  const txt = ROLE_HELP[r] || '';
  const el = document.getElementById('roleNote');
  if(el) el.innerHTML = esc(txt);
}
function saveAccount(id){
  const nn = document.getElementById('acN').value.trim().slice(0,40);
  const ne = document.getElementById('acE').value.trim();
  const np = document.getElementById('acP').value.trim();
  const nr = document.getElementById('acR').value;
  const nt_ = document.getElementById('acT').value.trim(), ni = document.getElementById('acI').value.trim().replace(/^@/,'');
  const nk = document.getElementById('acK').value;
  if(!nn) return toast('Fyll i namn');
  if(nr==='manager' && !can('grantManager')) return toast('Bara managern kan göra någon till manager');
  if(ne && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(ne)) return toast('E-postadressen ser fel ut');
  if(ne && accounts().some(c=>c.id!==id && (c.email||'').toLowerCase()===ne.toLowerCase()))
    return toast('E-posten används redan');
  if(accounts().some(c=>c.id!==id && c.n===nn)) return toast('Namnet är upptaget');

  if(id){
    const m = byId(id); if(!m) return;
    /* Sista managern får inte degraderas — då kommer ingen åt inställningarna. */
    if(m.r==='manager' && nr!=='manager' && accounts().filter(c=>c.r==='manager').length<2)
      return toast('Det måste finnas minst en manager');
    const leads = lcircle().filter(c=>c.leader===m.n);
    if(leads.length && !isCrewRole(nr) && nr!=='leader'
       && !confirm(`${m.n} leder ${leads.length} ${leads.length===1?'cirkel':'cirklar'}.\n\nByter du roll står de utan ledare tills du sätter en ny.`))
      return;
    if(nn !== m.n){
      S.bookings.forEach(b=>{ if(b.who===m.n){ b.who=nn; b.up=Date.now(); } });
      S.files.forEach(f=>{ if(f.who===m.n){ f.who=nn; f.up=Date.now(); } });
      S.circles.forEach(c=>{ if(c.leader===m.n){ c.leader=nn; c.up=Date.now(); } });
      if(S.session && S.session.member===m.n) S.session.member = nn;
      m.n = nn;
    }
    Object.assign(m, {email:ne, phone:np, r:nr, team:nt_, ig:ni, producer:nk, up:Date.now()});
  } else {
    S.accounts.push({id:uid(), n:nn, r:nr, email:ne, phone:np, team:nt_, ig:ni, producer:nk,
      c:'#6633b8', g:'#9d5cf5',
      active:true, del:false, up:Date.now()});
  }
  save(); closeSheet(); buildNav(); render(); toast('Sparat'); sync(true);
}
function toggleActive(id){
  const m = byId(id); if(!m) return;
  if(m.r==='manager' && m.active!==false && accounts().filter(c=>c.r==='manager' && c.active!==false).length<2)
    return toast('Det måste finnas minst en aktiv manager');
  m.active = m.active===false; m.up = Date.now();
  save(); closeSheet(); render(); toast(m.active===false?'Kontot avstängt':'Kontot aktiverat'); sync(true);
}

/* ---------- INBJUDNINGAR ----------
   En länk per roll (och cirkel). Den som öppnar den skriver in sina egna
   uppgifter — managern skriver aldrig in någons e-post. */
let invDraft = null;
function openInvites(role, circleId){
  if(!can('manageCrew')) return;
  role = role || (invDraft && invDraft.role) || 'producer';
  invDraft = {role, circle: circleId || (invDraft && invDraft.circle) || (lcircle()[0]||{}).id || '',
    days: 14, max: role==='participant' ? 0 : 1, made: ''};
  paintInvites();
}
function paintInvites(){
  const d = invDraft, needC = d.role==='leader' || d.role==='participant';
  const chip = (on, label, js) => `<button class="chip ${on?'on':''}" onclick="${js}">${label}</button>`;
  const set = (k, v) => `invDraft.${k}=${typeof v==='string'?`'${v}'`:v};invDraft.made='';paintInvites()`;
  openSheet(`${X}
    <h2>Bjud in</h2>
    <div class="sub">Skapa en länk och skicka den. Rollen följer med länken — den som öppnar den
      fyller själv i namn, e-post och lösenord.</div>
    <label class="lbl">SOM</label>
    <div class="chips wrap">${inviteRoles().map(([r,n])=>chip(d.role===r, n,
      `invDraft.role='${r}';invDraft.max=${r==='participant'?0:1};invDraft.made='';paintInvites()`)).join('')}</div>
    ${d.role==='camera' ? `<label class="lbl" for="invT">TEAM</label>
      <input id="invT" list="teamList" value="${esc(d.team||'')}" placeholder="t.ex. D2L" maxlength="30"
        oninput="invDraft.team=this.value.trim();invDraft.made=''">
      <datalist id="teamList">${[...new Set(cameras().map(a=>a.team).filter(Boolean))].map(t=>`<option value="${esc(t)}">`).join('')}</datalist>
      <div class="note">Alla som går med via länken hamnar i teamet och krediteras med teamets namn i galleriet.
        För D2L: en länk med <b>Hela gruppen</b>, eller en per person.</div>` : ''}
    ${needC ? (lcircle().length ? `<label class="lbl" for="invC">${d.role==='leader'?'LEDARE FÖR':'DELTAGARE I'}</label>
      <select id="invC" onchange="invDraft.circle=this.value;invDraft.made='';paintInvites()">${lcircle().map(c=>
        `<option value="${c.id}" ${d.circle===c.id?'selected':''}>${esc(c.n)}</option>`).join('')}</select>`
      : `<div class="warn" style="margin-top:12px">Skapa en cirkel först — länken kopplar personen till den.</div>`) : ''}
    <div class="two">
      <div><label class="lbl">GILTIG</label>
        <div class="chips wrap">${[[1,'1 dag'],[7,'7 dagar'],[14,'14 dagar'],[30,'30 dagar']].map(([v,n])=>chip(d.days===v, n, set('days', v))).join('')}</div></div>
      <div><label class="lbl">ANTAL</label>
        <div class="chips wrap">${chip(d.max===1,'En person',set('max',1))}${chip(d.max===0,'Hela gruppen',set('max',0))}</div></div>
    </div>
    ${d.made ? `<div class="invlink">
        <div class="tiny muted">LÄNKEN</div>
        <div class="mono" style="margin-top:6px">${esc(inviteUrl(d.made))}</div>
        <div class="row" style="gap:9px;margin-top:12px">
          <button class="btn slim" style="flex:1" onclick="shareInvite('${d.made}')">DELA</button>
          <button class="btn ghost slim" style="flex:1" onclick="copy(inviteUrl('${d.made}'),'Länken kopierad')">KOPIERA</button>
        </div></div>`
      : `<button class="btn" style="margin-top:20px" ${needC && !lcircle().length?'disabled':''} onclick="makeInvite()">SKAPA LÄNK</button>`}
    <div class="eyebrow">LÄNKAR<span class="ln"></span></div>
    <div id="invList"><div class="skel" style="height:58px"></div></div>`);
  paintInviteList();
}
async function makeInvite(){
  const d = invDraft;
  try{
    const c = (d.role==='leader'||d.role==='participant') ? d.circle : null;
    d.made = await createInvite(d.role, c, d.days, d.max || null, {team: d.role==='camera' ? (d.team||'') : ''});
    paintInvites();
  }catch(e){ toast(e.message); }
}
function inviteText(i){
  const c = i.circle_id ? circleById(i.circle_id) : null;
  return (INVITE_ROLES[i.role]||i.role) + (c ? ' · ' + c.n : '') + (i.team ? ' · ' + i.team : '') + (i.name ? ' · ' + i.name : '');
}
function shareInvite(tok){
  const i = (S.invites||[]).find(x=>x.token===tok) || {role:invDraft.role, circle_id:invDraft.circle};
  const txt = `Du är inbjuden till BANDOHQ som ${inviteText(i).replace(' · ',' i ')}. Skapa ditt konto här:\n` + inviteUrl(tok);
  if(navigator.share) navigator.share({title:'BANDOHQ', text:txt}).catch(()=>{});
  else copy(txt, 'Inbjudan kopierad — klistra in den i chatten');
}
async function paintInviteList(){
  const el = () => document.getElementById('invList');
  let list;
  try{ list = await listInvites(); }
  catch(e){ if(el()) el().innerHTML = `<div class="warn">${esc(e.message)}</div>`; return; }
  if(!el()) return;
  if(!PREVIEW_LOGIN) S.invites = list;
  el().innerHTML = list.length ? list.map(i=>{
    const st = inviteState(i), exp = new Date(i.expires_at);
    return `<div class="row inv ${st.ok?'':'dead'}">
      <div class="grow" style="min-width:0">
        <div class="fname">${esc(inviteText(i))}</div>
        <div class="fmeta"><span class="mono">${esc(i.token)}</span>
          <span>${i.uses}${i.max_uses?' / '+i.max_uses:''} har gått med</span>
          <span>${st.ok ? 'gäller t.o.m. '+exp.toLocaleDateString('sv-SE',{day:'numeric',month:'short'}) : esc(st.why)}</span></div>
      </div>
      ${st.ok?`<button class="flink" title="Dela" aria-label="Dela länken" onclick="shareInvite('${i.token}')">
          <svg viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 002 2h12a2 2 0 002-2v-7M16 6l-4-4-4 4M12 2v13"/></svg></button>
        <button class="flink" title="Stäng länken" aria-label="Stäng länken" onclick="endInvite('${i.token}')">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`:''}
    </div>`;
  }).join('') : `<div class="empty">Inga länkar än.</div>`;
}
async function endInvite(tok){
  if(!confirm('Stänga länken? Den som redan gått med påverkas inte.')) return;
  try{ await closeInvite(tok); paintInviteList(); toast('Länken är stängd'); }
  catch(e){ toast(e.message); }
}

/* ---------- BOKA / REDIGERA ---------- */
const PRESETS = [['10:00','14:00'],['14:00','18:00'],['18:00','22:00'],['22:00','02:00'],['12:00','20:00']];
function openForm(id, date, circleId, asCustomer){
  const m = me(); if(!m) return;
  editId = id || null;
  const b = id ? S.bookings.find(x=>x.id===id) : null;
  if(b && !can('editBooking',b)) return toast('Du kan bara ändra dina egna pass');
  const d = b ? b.date : (date || selDate || iso(new Date()));
  const v = Object.assign({studio:'A', date:d, start:'14:00', end:'18:00', who:m.n, title:'', note:'', paid:false, circleId:''}, b||{});
  /* En cirkelsession är en vanlig bokning med circleId satt. Därför hamnar
     den i samma kalender som crewets pass och krockkollen gäller över båda. */
  const cid = circleId || v.circleId || '';
  const circ = cid ? circleById(cid) : null;
  if(circ){ v.circleId = cid; v.who = circ.leader || m.n; if(!v.title) v.title = circ.n; }
  const pickable = can('dashboard') ? crew() : [m];
  const cust = asCustomer || m.r==='customer';
  if(cust){ v.who = m.n; v.paid = true; if(!v.title) v.title = 'Studiotid'; }
  openSheet(`${X}
    <h2>${b?'Ändra pass':circ?'Boka session':'Boka studio'}</h2>
    <div class="sub">${circ?esc(circ.n)+' · ledare '+esc(circ.leader||'–')
      :b?'Uppdatera bokningen':'Kolla att tiden är ledig innan du sparar'}</div>

    <label class="lbl">STUDIO</label>
    <div class="studiopick">
      ${['A','B'].map(s=>`<button class="spick ${v.studio===s?'on':''}" data-s="${s}" onclick="pickStudio('${s}')"
        style="${v.studio===s?`background:linear-gradient(150deg,${SC[s]},${s==='A'?'#5b21b6':'#075985'})`:''}">
        <b>${esc(S.studios[s])}</b><span id="st-${s}">–</span></button>`).join('')}
    </div>

    <label class="lbl">DATUM</label>
    <input type="date" id="fDate" value="${v.date}" onchange="checkForm()">
    <div class="chips" style="margin-top:8px">
      ${[0,1,2,3,4,5,6].map(n=>{const dd=iso(addDays(new Date(),n));
        return `<button class="chip" onclick="setDate('${dd}')">${n===0?'IDAG':n===1?'IMORGON':longDate(dd).toUpperCase()}</button>`;}).join('')}
    </div>

    <label class="lbl">TID</label>
    <div class="two"><input type="time" id="fStart" value="${v.start}" onchange="checkForm()">
      <input type="time" id="fEnd" value="${v.end}" onchange="checkForm()"></div>
    <div class="chips" style="margin-top:8px">
      ${PRESETS.map(p=>`<button class="chip" onclick="setTime('${p[0]}','${p[1]}')">${p[0]}–${p[1]}</button>`).join('')}
    </div>

    ${circ ? `<div class="note" style="margin-top:18px">Bokas som cirkelsession för
        <b>${esc(circ.n)}</b>. Passet syns i schemat som alla andra, så tiden kan inte
        dubbelbokas mot ett crewpass.</div>`
      : `<label class="lbl">VEM BOKAR</label>
    ${pickable.length>1 ? `<div class="chips">${pickable.map(c=>`<button class="chip who ${v.who===c.n?'on':''}"
      data-w="${c.n}" onclick="pickWho('${c.n}')"><i class="sw" style="background:${c.c}"></i>${esc(c.n)}</button>`).join('')}</div>`
      : `<div class="note" style="margin-top:0">Bokas som <b>${esc(m.n)}</b>. Managern kan boka åt andra.</div>`}`}

    ${circ || cust ? '' : `
    <label class="lbl">MED</label>
    <!-- Vilka fler producenter som är med. Det är det samarbetsstatistiken räknar på. -->
    <div class="chips" style="flex-wrap:wrap;overflow:visible">${crew().map(c=>`<button class="chip with ${
      (v.with||[]).includes(c.n)?'on':''}" data-w="${esc(c.n)}" onclick="this.classList.toggle('on')">
      <i class="sw" style="background:${c.c}"></i>${esc(c.n)}</button>`).join('')}</div>

    <select id="fArtist"><option value="">Ingen artist</option>
      ${[1,2,3].map(pr=>{ const g = artistsRanked().filter(a=>prioOf(a)===pr); return g.length ? `<optgroup label="${PRIO_NAME[pr]}">${

    <label class="lbl">VAD ÄR DET FÖR PASS</label>

    <label class="lbl">ANTECKNING</label>
    <textarea id="fNote" placeholder="Vem mer kommer? Utrustning? Nyckel?" maxlength="200">${esc(v.note)}</textarea>

    ${circ?'':`<button class="chip ${v.paid?'on':''}" id="fPaidBtn" onclick="togglePaid()"

  checkForm();

function togglePaid(){
  const h = document.getElementById('fPaid'), btn = document.getElementById('fPaidBtn');
  const on = !h.value; h.value = on?'1':'';
  btn.classList.toggle('on', on);
  btn.textContent = on ? 'JA — räknas som intäkt' : 'NEJ — internt pass';
}
function pickStudio(s){
  document.getElementById('fStudio').value=s;
  document.querySelectorAll('.spick').forEach(el=>{
    const on = el.dataset.s===s;
    el.classList.toggle('on',on);
    el.style.background = on ? `linear-gradient(150deg,${SC[el.dataset.s]},${el.dataset.s==='A'?'#5b21b6':'#075985'})` : '';
  });
  checkForm();
}
function pickWho(w){
  document.getElementById('fWho').value=w;
  document.querySelectorAll('.chip.who').forEach(el=>el.classList.toggle('on',el.dataset.w===w));
}
function setDate(d){ document.getElementById('fDate').value=d; checkForm(); }
function setTime(a,b){ document.getElementById('fStart').value=a; document.getElementById('fEnd').value=b; checkForm(); }
function readForm(){
  return {studio:document.getElementById('fStudio').value, date:document.getElementById('fDate').value,
    start:document.getElementById('fStart').value, end:document.getElementById('fEnd').value,
    who:document.getElementById('fWho').value, title:document.getElementById('fTitle').value.trim(),
    note:document.getElementById('fNote').value.trim(), paid:!!document.getElementById('fPaid').value,
    circleId:(document.getElementById('fCircle')||{value:''}).value,
    /* den som bokar räknas aldrig dubbelt som "med" */
    with:[...document.querySelectorAll('.chip.with.on')].map(el=>el.dataset.w)
      .filter(n=>n!==document.getElementById('fWho').value),
    artistId:(document.getElementById('fArtist')||{value:''}).value};
}
function checkForm(){
  const f = readForm(), box = document.getElementById('clash'), btn = document.getElementById('saveBtn');
  if(!box) return;
  ['A','B'].forEach(s=>{
    const el=document.getElementById('st-'+s); if(!el) return;
    if(!f.date||!f.start||!f.end){ el.textContent='–'; return; }
    const ok = freeAt(s,f.date,f.start,f.end,editId);
    el.textContent = ok ? 'Ledig' : 'Upptagen';
    el.style.color = ok ? 'rgba(255,255,255,.78)' : '#ffd9de';
  });
  if(!f.date||!f.start||!f.end){ box.innerHTML=''; btn.disabled=true; return; }
  /* samma start och slut skulle annars tolkas som nattpass och bli 24 h */
  if(f.start===f.end){
    box.innerHTML = `<div class="warn">Start och slut är samma tid. Sätt en sluttid.</div>`;
    btn.disabled = true; return;
  }
  const c = clash(f, editId);
  if(c.length){
    const o=c[0], other = f.studio==='A'?'B':'A';
    const alt = freeAt(other,f.date,f.start,f.end,editId);
    box.innerHTML = `<div class="warn"><b>Krock i ${esc(S.studios[f.studio])}</b><br>
      ${esc(o.who)} har ${o.start}–${o.end}${o.title?' · '+esc(o.title):''}.
      ${alt?`<br><b style="color:var(--pur3)" onclick="pickStudio('${other}')">→ ${esc(S.studios[other])} är ledig, byt dit</b>`:''}</div>`;
    btn.disabled = true;
  } else {
    const h = dur(f);
    box.innerHTML = `<div class="okbox">Ledigt ✓ ${esc(S.studios[f.studio])} · ${hh(h)} h${
      h>0&&endAt(f).getDate()!==startAt(f).getDate()?' (över midnatt)':''}</div>`;
    btn.disabled = false;
  }
}
function saveBooking(){
  const f = readForm();
  if(!f.date||!f.start||!f.end) return toast('Fyll i datum och tid');
  if(f.start===f.end) return toast('Start och slut är samma tid');
  if(clash(f, editId).length) return toast('Tiden krockar');
  if(!can('dashboard') && f.who!==me().n) return toast('Du kan bara boka åt dig själv');
  const rep = document.getElementById('fRep') ? +document.getElementById('fRep').value : 1;
  if(remoteRole() && !editId) return saveBookingRemote(f, rep);
  if(editId){
    const b = S.bookings.find(x=>x.id===editId);
    if(!can('editBooking',b)) return toast('Du kan bara ändra dina egna pass');
    Object.assign(b, f, {up:Date.now()});
    save(); closeSheet(); render(); toast('Passet uppdaterat'); sync(true);
    return;
  }
  let made=0, skipped=0;
  for(let i=0;i<rep;i++){
    const d = iso(addDays(fromIso(f.date), i*7));
    const nb = Object.assign({}, f, {id:uid(), date:d, up:Date.now(), del:false,
      status:'', hours:null, present:[]});
    if(clash(nb).length){ skipped++; continue; }
    S.bookings.push(nb); made++;
  }
  save(); closeSheet();
  selDate = f.date; weekStart = monday(fromIso(f.date));
  if(f.circleId && view==='circles') render();
  else if(view==='files'||view==='team'||view==='dash'||view==='circles') go('week');
  else render();
  toast(made>1 ? `${made} pass bokade${skipped?` · ${skipped} krockade`:''}` : 'Passet är bokat');
  sync(true);
}

/* Ledaren bokar sin cirkel, kunden bokar studiotid — servern krockkollar och
   sätter vem passet gäller, så ingen kan boka i någon annans namn. */
async function saveBookingRemote(f, rep){
  let made = 0, skipped = 0, err = '';
  for(let i=0; i<rep; i++){
    const d = iso(addDays(fromIso(f.date), i*7));
    try{
      if(f.circleId) await sbRpc('book_circle_session', {p_circle:f.circleId, p_date:d, p_start:f.start, p_end:f.end, p_studio:f.studio});
      else await sbRpc('book_customer_slot', {p_date:d, p_start:f.start, p_end:f.end, p_studio:f.studio});
      made++;
    }catch(e){ skipped++; err = e.message; }
  }
  if(!made) return toast(err || 'Gick inte att boka');
  await cloudView().catch(()=>{});
  closeSheet(); selDate = f.date; weekStart = monday(fromIso(f.date)); render();
  toast(made>1 ? `${made} pass bokade${skipped?` · ${skipped} krockade`:''}` : 'Passet är bokat');
}

/* ===================== DELNINGSKOD (reservväg) ===================== */
function payload(){
  const cut = iso(addDays(new Date(),-30));
  const p = fullPayload();
  p.b = p.b.filter(r=>r[2]>=cut);
  return b64(JSON.stringify(p));
}
function b64(str){
  const bytes = new TextEncoder().encode(str);
  let bin=''; bytes.forEach(x=>bin+=String.fromCharCode(x));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unb64(s){
  s = s.trim().replace(/-/g,'+').replace(/_/g,'/');
  const bin = atob(s + '==='.slice((s.length+3)%4));
  return new TextDecoder().decode(Uint8Array.from(bin, c=>c.charCodeAt(0)));
}
function shareLink(){
  const url = location.href.split('#')[0] + '#s=' + payload();
  const txt = 'BANDOHQ – schemat är uppdaterat:\n' + url;
  if(navigator.share) navigator.share({title:'BANDOHQ', text:txt}).catch(()=>{});
  else copy(url, 'Länk kopierad');
}
function copyCode(){ copy(payload(), 'Synkkod kopierad – klistra in i gruppchatten'); }
function copy(t, msg){
  if(navigator.clipboard && location.protocol!=='file:')
    navigator.clipboard.writeText(t).then(()=>toast(msg),()=>fallback(t));
  else fallback(t);
  function fallback(t){
    const a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity='0';
    document.body.appendChild(a); a.select();
    try{ document.execCommand('copy'); toast(msg); }catch(e){ toast('Kunde inte kopiera'); }
    a.remove();
  }
}
function doImport(){
  const el = document.getElementById('imp'); const v = el.value.trim();
  if(!v) return toast('Klistra in en kod först');
  const code = v.includes('#s=') ? v.split('#s=')[1] : v;
  try{
    /* Med servern: posterna flyttas in, men inte kontona — de kommer via
       inbjudningar, och managerns synk skulle annars skicka upp dem. */
    const keep = PREVIEW_LOGIN ? null : JSON.parse(JSON.stringify(S.accounts));   /* en kopia — mergeData ändrar listan på plats */
    const r = mergeData(JSON.parse(unb64(code)));
    if(keep){ S.accounts = keep; S.cloud.pushedAt = 0; save(); sync(false); }
    el.value=''; render(); toast(`${r.add} nya · ${r.upd} uppdaterade`);
  }catch(e){ toast('Koden gick inte att läsa'); }
}
