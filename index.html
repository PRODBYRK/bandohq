  S.circleCfg = Object.assign({}, v, {up:Date.now()});
  save(); closeSheet(); render(); toast('Reglerna sparade'); sync(true);
}

/* ---------- fördela: anmälningar och deltagare utan grupp ---------- */
function distributeCandidates(){
  const inAny = new Set(lcircle().flatMap(c=>c.members||[]));
  return newSignups().map(x=>({kind:'signup', id:x.id, n:x.name, subject:x.subject||''}))
    .concat(lpeople().filter(p=>!inAny.has(p.id))
      .sort((a,b)=>String(a.reg||'9').localeCompare(String(b.reg||'9')) || a.n.localeCompare(b.n,'sv'))   /* först registrerad först */
      .map(p=>({kind:'person', id:p.id, n:p.n, subjects:subjectsOf(p.interests), subject:subjectsOf(p.interests)[0]||'',
        interests:p.interests||[], access:p.source==='access'})));
}
/* samma ämne först, sedan gruppen med flest lediga platser */
/* (Access: personens inriktningar ger ämnena, i den ordning de valts) */
function suggestCircle(cand, load){
  const g = ccfg().groupSize, open = lcircle().filter(c=>(load[c.id]||0) < g);
  const by = list => list.slice().sort((a,b)=>(load[a.id]||0)-(load[b.id]||0) || a.n.localeCompare(b.n,'sv'))[0] || null;
  for(const sub of (cand.subjects && cand.subjects.length ? cand.subjects : [cand.subject]).filter(Boolean)){
    const same = open.filter(c=>String(c.subject||'').toLowerCase()===String(sub).toLowerCase());
    if(same.length) return by(same);
  }
  return by(open);
}
function openDistribute(){
  if(!can('manageCircles')) return;
  const load = {}; lcircle().forEach(c=>load[c.id] = membersOf(c.id).length);
  distPlan = distributeCandidates().map(x=>{ const c = suggestCircle(x, load); if(c) load[c.id]++; return Object.assign(x, {circle: c ? c.id : ''}); });
  const opts = sel => `<option value="">Ingen grupp än</option>${lcircle().map(c=>
    `<option value="${c.id}" ${sel===c.id?'selected':''}>${esc(c.n)} (${membersOf(c.id).length}/${ccfg().groupSize})</option>`).join('')}`;
  openSheet(`${X}<h2>Fördela deltagare</h2>
    <div class="sub">Förslag: samma ämne som personens inriktning först, sedan gruppen med flest lediga platser. Ändra där det behövs.</div>
    ${distPlan.length ? distPlan.map((x,i)=>`<div class="distrow">
      <div class="grow" style="min-width:0"><div class="mname" style="font-size:14px">${esc(x.n)}${x.kind==='signup'?' <span class="badge warn">ANMÄLAN</span>':x.access?' <span class="badge" style="background:rgba(255,62,191,.14);color:#ff8fd8">ACCESS</span>':''}</div>
        ${(x.interests||[]).length?`<div class="mrole">${esc(interestText(x.interests))}</div>`:x.subject?`<div class="mrole">${esc(x.subject)}</div>`:''}</div>
      <select onchange="distPlan[${i}].circle=this.value" aria-label="Grupp för ${esc(x.n)}">${opts(x.circle)}</select></div>`).join('')
      + `<button class="btn" style="margin-top:20px" onclick="doDistribute()">PLACERA</button>`
      : `<div class="empty">Ingen väntar på en plats.</div>`}`);
}
async function doDistribute(){
  const todo = (distPlan||[]).filter(x=>x.circle); if(!todo.length) return toast('Välj en grupp för någon först');
  let n = 0, err = '';
  for(const x of todo){
    try{ if(x.kind==='signup') await placeSignup(x.id, x.circle, null); else await addToCircle(x.circle, x.id); n++; }
    catch(e){ err = x.n + ': ' + e.message; }
  }
  distPlan = null; closeSheet(); render();
  toast(`${nt(n,'person placerad','personer placerade')}${err?' · '+err:''}`);
  if(!PREVIEW_LOGIN) sync(true);
}
async function addToCircle(cid, pid){
  const c = circleById(cid); if(!c) throw new Error('Gruppen finns inte');
  if((c.members||[]).includes(pid)) return;
  if(PREVIEW_LOGIN || can('manageCircles')){ c.members = (c.members||[]).concat(pid); touch(c); save(); if(!PREVIEW_LOGIN) await cloudPush(); return; }
  await sbRpc('add_circle_member', {p_circle:cid, p_member:pid}); await cloudPull();
}
/* En anmälan blir en deltagare (eller kopplas till en som redan finns) och, om vald, i en grupp. */
async function placeSignup(sid, cid, memberId){
  if(PREVIEW_LOGIN){
    const x = (S.signups||[]).find(y=>y.id===sid); if(!x || x.status!=='new') throw new Error('Anmälan finns inte längre');
    let pid = memberId;
    if(!pid){
      if(accounts().some(a=>a.n.toLowerCase()===x.name.toLowerCase())) throw new Error(`Det finns redan en person som heter ${x.name} — koppla anmälan till den i stället`);
      pid = 'm_' + uid();
      S.accounts.push(bump({id:pid, n:x.name, r:'participant', email:x.email||'', phone:x.phone||'', c:'#6633b8', g:'#9d5cf5', active:true, del:false}));
    }
    if(cid) await addToCircle(cid, pid);
    Object.assign(x, {status:'placed', member_id:pid, circle_id:cid||null}); save(); return pid;
  }
  const r = await sbRpc('place_signup', {p_signup:sid, p_circle:cid||null, p_member:memberId||null});
  signupList = (signupList||[]).filter(y=>y.id!==sid); signupAt = 0;
  await cloudPull(); return r && r.member;
}
/* Finns personen redan? Samma regler som find_duplicates på servern. */
async function findDuplicates(name, email, phone){
  if(!PREVIEW_LOGIN) return (await sbRpc('find_duplicates', {p_name:name||'', p_email:email||'', p_phone:phone||''})) || [];
  const nn = s => String(s||'').trim().replace(/\s+/g,' ').toLowerCase(), em = nn(email), ph = normPhone(phone);
  return accounts().filter(a=>a.active!==false && !a.del).map(a=>({id:a.id, name:a.n, role:a.r,
    why: em && nn(a.email)===em ? 'samma e-post' : ph && normPhone(a.phone)===ph ? 'samma telefonnummer'
       : nn(name).length>=2 && nn(a.n)===nn(name) ? 'samma namn' : ''})).filter(x=>x.why);
}
async function openPlace(sid){
  const x = newSignups().find(y=>y.id===sid); if(!x) return;
  const load = {}; lcircle().forEach(c=>load[c.id] = membersOf(c.id).length);
  const sug = suggestCircle({subject:x.subject}, load);
  let dups = []; try{ dups = await findDuplicates(x.name, x.email, x.phone); }catch(_){}
  openSheet(`${X}<h2>${esc(x.name)}</h2>
    <div class="sub">Anmälan${x.created_at?' '+esc(new Date(x.created_at).toLocaleDateString('sv-SE',{day:'numeric',month:'short'})):''}</div>
    <div style="margin-top:12px">
      ${x.subject?`<div class="kv"><span>ÄMNE</span><b>${esc(x.subject)}</b></div>`:''}
      ${x.phone?`<div class="kv"><span>TELEFON</span><b><a href="${telHref(x.phone)}" style="color:var(--txt)">${esc(x.phone)}</a></b></div>`:''}
      ${x.email?`<div class="kv"><span>E-POST</span><b><a href="mailto:${esc(x.email)}" style="color:var(--txt)">${esc(x.email)}</a></b></div>`:''}
      ${x.note?`<div class="kv" style="border:0"><span>MEDDELANDE</span><b style="font-weight:500">${esc(x.note)}</b></div>`:''}</div>
    ${dups.length?`<div class="warn"><b>Finns kanske redan:</b> ${dups.map(d=>`${esc(d.name)} (${esc(ROLE_NAME[d.role]||d.role)}, ${esc(d.why)})`).join(', ')}.</div>
      ${dups.filter(d=>d.role==='participant').map(d=>`<button class="btn ghost slim" style="margin-top:8px" onclick="placeFromSheet('${sid}','${d.id}')">KOPPLA TILL ${esc(d.name.toUpperCase())}</button>`).join('')}`:''}
    <label class="lbl" for="plC">GRUPP</label>
    <select id="plC"><option value="">Ingen grupp än</option>${lcircle().map(c=>
      `<option value="${c.id}" ${sug&&sug.id===c.id?'selected':''}>${esc(c.n)} (${membersOf(c.id).length}/${ccfg().groupSize})</option>`).join('')}</select>
    <button class="btn" style="margin-top:20px" onclick="placeFromSheet('${sid}','')">LÄGG IN SOM NY DELTAGARE</button>
    <button class="btn ghost" style="margin-top:9px" onclick="rejectSignup('${sid}')">AVVISA</button>`);
}
async function placeFromSheet(sid, memberId){
  try{ await placeSignup(sid, document.getElementById('plC').value, memberId || null); closeSheet(); render(); toast('Placerad'); if(!PREVIEW_LOGIN) sync(true); }
  catch(e){ toast(e.message); }
}
async function rejectSignup(sid){
  if(!confirm('Avvisa anmälan?')) return;
  try{
    if(PREVIEW_LOGIN){ const x = (S.signups||[]).find(y=>y.id===sid); if(x) x.status = 'rejected'; save(); }
    else { await sbRpc('reject_signup', {p_signup:sid}); signupList = (signupList||[]).filter(y=>y.id!==sid); }
    closeSheet(); render(); toast('Avvisad');
  }catch(e){ toast(e.message); }
}

function openCircleView(id){ openCircle = id; render(); window.scrollTo(0,0); }

function vCircle(){
  const c = circleById(openCircle);
  if(!c){ openCircle = null; return vCircles(); }
  const mgr = can('manageCircles'), leads = can('leadCircle', c);
  const mem = membersOf(c.id), cur = currFor(c), now = new Date();
  const ss = circleSessions(c.id).sort((a,b)=>startAt(b)-startAt(a));
  const pending  = ss.filter(b=>b.status==='request').reverse();
  const upcoming = ss.filter(b=>b.status==='' && endAt(b)>now).reverse();
  const past = ss.filter(b=>b.status==='done' || (b.status==='' && endAt(b)<=now));

  return `
    <button class="btn ghost slim" style="width:auto;padding:8px 14px" onclick="openCircle=null;render()">‹ TILLBAKA</button>
    <div class="h1" style="margin-top:14px;font-size:${c.n.length>22?'22px':'26px'};
      overflow-wrap:anywhere">${esc(c.n)}</div>
    <div class="sub">${c.leader?'Ledare: <b style="color:'+col(c.leader)+'">'+esc(c.leader)+'</b>':'Ingen ledare satt'}
      · ${mem.length} deltagare · ${past.filter(b=>b.status==='done').length} genomförda sessions</div>
    ${mgr?`<div class="chips">
      <button class="chip" onclick="openCircleEdit('${c.id}')">ÄNDRA CIRKELN</button>
      <button class="chip" onclick="openInvites('participant','${c.id}')">BJUD IN DELTAGARE</button>
      ${c.leader?'':`<button class="chip" onclick="openInvites('leader','${c.id}')">BJUD IN LEDARE</button>`}
      <button class="chip" onclick="openAddMember('${c.id}')">+ BEFINTLIG</button>
    </div>`:''}

    ${courseOf(c) ? `<div class="eyebrow">UTBILDNING<span class="ln"></span></div>${courseCard(c)}` : `
    <div class="eyebrow">AKTUELL LÄROPLAN<span class="ln"></span></div>
    ${cur?`<div class="card">
      <div class="studio-name">${esc(cur.subject)}</div>
      <div class="live-title" style="font-size:17px;margin-top:6px">${esc(cur.title)}</div>
      <div style="margin-top:12px;white-space:pre-wrap;line-height:1.75;color:var(--mut)">${esc(cur.body)}</div>
      ${cur.from?`<div class="tiny" style="color:var(--mut2);margin-top:12px">Gäller från ${esc(cur.from)}</div>`:''}
    </div>`:`<div class="empty">Ingen kurs kopplad.${mgr?'<br><b style="color:var(--pur3)" onclick="openCircleEdit(\''+c.id+'\')">Välj en</b>':''}</div>`}`}

    ${leads && pending.length?`
      <div class="eyebrow">FÖRFRÅGNINGAR ATT SVARA PÅ<span class="ln"></span>
        <span style="color:var(--warn)">${pending.length}</span></div>
      ${pending.map(b=>{
        const who = byId(b.reqBy);
        return `<div class="card" style="border-color:rgba(250,178,25,.3);margin-bottom:9px">
          <div class="live-title" style="font-size:16px">${esc(longDate(b.date))}${relDay(b.date)?' · '+relDay(b.date):''}</div>
          <div class="live-meta">${b.start}–${b.end} · föreslagen av
            <b style="color:var(--txt)">${esc(who?who.n:'okänd')}</b></div>
          <div class="row" style="margin-top:14px;gap:9px">
            <button class="btn" style="flex:1" onclick="openApprove('${b.id}')">GODKÄNN</button>
            <button class="btn ghost" style="flex:none;width:auto;padding:14px 18px"
              onclick="declineRequest('${b.id}')">AVBÖJ</button>
          </div></div>`;
      }).join('')}`:''}

    <div class="eyebrow">KOMMANDE SESSIONS<span class="ln"></span></div>
    ${leads?`<button class="btn" onclick="openForm(null,null,'${c.id}')">+ BOKA SESSION</button>`:''}
    <div class="stagger" style="margin-top:${leads?'12px':'0'}">
      ${upcoming.length ? upcoming.map((b,i)=>circleSessionRow(b,c,leads,i)).join('')
        : `<div class="empty">Inga bokade sessions.</div>`}</div>

    <div class="eyebrow">DELTAGARE<span class="ln"></span></div>
    ${mem.length ? mem.map(p=>{
      const hrs = hoursFor(p.id), full = hrs >= MAX_HOURS;
      return `<div class="member" style="cursor:default;flex-wrap:wrap;row-gap:10px">
        ${pav(p, 38)}
        <div class="grow" style="min-width:0">
          <div class="mname" style="letter-spacing:.02em">${esc(p.n)}</div>
          <div class="mrole">${p.phone?esc(p.phone):(p.email?esc(p.email):'—')}</div></div>
        ${mgr?`<button class="btn ghost slim" style="width:auto;padding:6px 10px;flex:none"
          onclick="removeMember('${c.id}','${p.id}')">TA BORT</button>`:''}
        <div style="flex:1 1 100%;display:flex;align-items:center;gap:11px">
          <div class="bar" style="flex:1;margin:0;height:4px">
            <i style="width:${Math.min(100,hrs/MAX_HOURS*100)}%;background:${full?'var(--warn)':'linear-gradient(90deg,var(--pur2),var(--pur))'};
              box-shadow:0 0 10px ${full?'var(--warn)':'rgba(168,85,247,.8)'}"></i></div>
          <span style="flex:none;font-family:var(--disp);font-size:13px;font-weight:600;color:${full?'var(--warn)':'var(--mut)'}">
            ${hh(hrs)}<span style="color:var(--mut2)"> / ${MAX_HOURS} h</span></span>
          ${full?'<span class="pill" style="background:rgba(250,178,25,.14);color:var(--warn)">MAX</span>':''}
        </div>
      </div>`;
    }).join('') : `<div class="empty">Inga deltagare i cirkeln än.</div>`}

    ${past.length?`<div class="eyebrow">TIDIGARE<span class="ln"></span></div>
      ${past.slice(0,14).map((b,i)=>circleSessionRow(b,c,leads,i)).join('')}`:''}
  `;
}

function circleSessionRow(b, c, leads, i){
  const done = b.status==='done';
  const st = S.studios[b.studio];
  return `<div class="bk" style="--k:${col(c.leader)||'#7c3aed'};--kg:${glow(c.leader)||'#a855f7'};
      animation-delay:${(i||0)*40}ms;cursor:default">
    <div class="bk-time"><b>${b.start}</b><span>${b.end}</span></div>
    <div class="grow">
      <div class="bk-title">${esc(longDate(b.date))}${relDay(b.date)?' · '+relDay(b.date):''}</div>
      <div class="bk-sub">
        ${b.studio?`<span class="pill" style="background:${SC[b.studio]}26;color:${SC[b.studio]}">${esc(st)}</span>`:
          `<span class="pill" style="background:rgba(255,255,255,.06);color:var(--mut2)">UTAN STUDIO</span>`}
        ${statePill(b)}${done?` <span style="color:var(--mut2)">${hh(b.hours)} h · ${(b.present||[]).length} av ${membersOf(c.id).length} deltog</span>`:''}
      </div>
    </div>
    ${leads && !isLocked(b)?`<button class="btn ${done?'ghost':''} slim" style="width:auto;padding:8px 12px;flex:none"
      onclick="openComplete('${b.id}')">${done?'ÄNDRA':'GENOMFÖRD'}</button>`:''}
  </div>`;
}


/* =====================================================================
   DE ENKLA VYERNA
   Deltagare, cirkelledare utan producentroll, och kund. Ingen flikrad —
   var och en ser bara det som hör till sin roll.
   ===================================================================== */
let simpleCircle = null;                 /* vald cirkel i deltagar-/ledarvyn */

function statusPill(b){
  return b.status==='request'  ? '<span class="pill" style="background:rgba(250,178,25,.15);color:var(--warn)">VÄNTAR PÅ SVAR</span>'
       : b.status==='declined' ? '<span class="pill" style="background:rgba(255,255,255,.06);color:var(--mut2)">AVBÖJD</span>'
       : b.status==='done'     ? `<span class="pill" style="background:rgba(52,211,153,.14);color:var(--ok2)">GENOMFÖRD · ${hh(b.hours)} H</span>`
       : '<span class="pill" style="background:rgba(52,211,153,.14);color:var(--ok2)">BEKRÄFTAD</span>';
}
function sessionLine(b, extra){
  return `<div class="bk" style="--k:${col(b.who)||'#7c3aed'};--kg:${glow(b.who)||'#a855f7'};cursor:default">
    <div class="bk-time"><b>${b.start}</b><span>${b.end}</span></div>
    <div class="grow">
      <div class="bk-title">${esc(longDate(b.date))}${relDay(b.date)?' · '+relDay(b.date):''}</div>
      <div class="bk-sub">
        ${b.studio?`<span class="pill" style="background:${SC[b.studio]}26;color:${SC[b.studio]}">${esc(S.studios[b.studio])}</span>`
                  :'<span class="pill" style="background:rgba(255,255,255,.06);color:var(--mut2)">STUDIO EJ SATT</span>'}
        ${statusPill(b)}
      </div>
    </div>
    ${extra||''}
  </div>`;
}

/* ---------- DELTAGARE ----------
   Bara bokning: välj en tid, skicka förslaget till cirkelledaren, se och avboka sina pass. */
function vParticipant(){
  const m = me();
  const cs = myCirclesAsMember();
  if(!cs.length) return `${profileBanner()}
    <div class="h1">Hej ${esc(m.n.split(' ')[0])}</div>
    <div class="sub">Du är inte inlagd i någon cirkel än.</div>
    <div class="empty">Så fort du kopplas till en grupp kan du boka pass här.</div>`;

  if(!simpleCircle || !cs.some(c=>c.id===simpleCircle)) simpleCircle = cs[0].id;
  const c = circleById(simpleCircle), now = new Date(), list = booked();
  const mine = circleSessions(c.id)
    .filter(b => b.status!=='request' || b.reqBy===m.id)
    .sort((a,b)=>startAt(a)-startAt(b));
  const waiting = mine.filter(b=>b.status==='request' && endAt(b)>now);
  const upcoming = mine.filter(b=>b.status!=='request' && b.status!=='done' && endAt(b)>now);
  const past = mine.filter(b=>b.status==='done' || (b.status!=='request' && endAt(b)<=now)).reverse();
  const days = bookDays(14), day = pickBookDay(list, days), p = myContact({circleId:c.id});
  const sub = b => b.status==='request' ? `Väntar på svar från ${esc(c.leader||'ledaren')}`
    : b.status==='done' ? 'Genomfört'
    : (b.studio ? esc(S.studios[b.studio]||'') : 'Studio ej satt') + (b.reqBy===m.id ? ' · ditt förslag' : '');

  return `${profileBanner()}
    <div class="h1" style="font-size:${c.n.length>22?'22px':'26px'};overflow-wrap:anywhere">${esc(c.n)}</div>
    <div class="sub">Din cirkelledare är
      <b style="color:${glow(c.leader)}">${esc(c.leader||'inte satt än')}</b> · ett pass är 3 timmar</div>
    ${cs.length>1?`<div class="chips">${cs.map(x=>`<button class="chip ${x.id===c.id?'on':''}"
      onclick="simpleCircle='${x.id}';render()">${esc(x.n)}</button>`).join('')}</div>`:''}

    <div class="eyebrow" style="margin-top:0">BOKA ETT PASS<span class="ln"></span></div>
    ${c.leader ? slotPicker({list, days, day, dayJs:d=>`bookDay='${d}';render()`, startJs:(d,hm)=>`openSlot('${d}','${hm}')`,
        mine:b=>cs.some(x=>x.id===b.circleId), mineLabel:'Er cirkel'})
      + `<div class="note">Välj en starttid och skicka ett förslag. ${esc(c.leader)} väljer studio när förslaget godkänns
          — då är passet bokat.</div>`
      : `<div class="empty">Cirkeln saknar ledare — be AZ koppla en.</div>`}

    ${waiting.length?`<div class="eyebrow">VÄNTAR PÅ SVAR<span class="ln"></span><span style="color:var(--warn)">${waiting.length}</span></div>
      ${waiting.map(b=>myRow(b, sub(b), mineBtn(b))).join('')}`:''}
    <div class="eyebrow">KOMMANDE PASS<span class="ln"></span></div>
    ${upcoming.length ? upcoming.map(b=>myRow(b, sub(b), b.reqBy===m.id ? mineBtn(b) : '')).join('')
      : `<div class="empty">Inga bokade pass än.</div>`}
    <div class="tiny muted" style="margin-top:4px;line-height:1.55">Pass du själv föreslagit kan du avboka fram till en timme innan.
      Efter det, eller för pass som ${esc(c.leader||'ledaren')} bokat: hör av dig till ${esc(c.leader||'din cirkelledare')}.</div>
    ${past.length?`<div class="eyebrow">TIDIGARE<span class="ln"></span></div>
      ${past.slice(0,6).map(b=>myRow(b, sub(b))).join('')}`:''}
    ${contactCard(p, 'DIN CIRKELLEDARE')}`;
}

/* ---------- CIRKELLEDARE (utan producentroll) ----------
   Två saker och inget mer: boka pass, och nå sina medlemmar. Förfrågningar
   och "genomförd" ligger direkt på passen i stället för i egna sektioner. */
let leaderTab = 'pass';
const telHref = t => 'tel:' + String(t||'').replace(/[^\d+]/g,'');
function vLeader(){
  const m = me();
  const cs = myCirclesAsLeader();
  if(!cs.length) return `
    <div class="h1">Hej ${esc(m.n.split(' ')[0])}</div>
    <div class="sub">Du leder ingen cirkel än.</div>
    <div class="empty">När AZ kopplar dig till en grupp dyker den upp här — med pass att boka
      och medlemmarnas kontaktuppgifter.</div>`;

  if(!simpleCircle || !cs.some(c=>c.id===simpleCircle)) simpleCircle = cs[0].id;
  const c = circleById(simpleCircle), mem = membersOf(c.id), now = new Date();
  const ss = circleSessions(c.id).sort((a,b)=>startAt(a)-startAt(b));
  const pend = ss.filter(b=>b.status==='request' && endAt(b)>now);
  const coming = ss.filter(b=>b.status==='' && startAt(b)>now);
  const toMark = ss.filter(b=>b.status==='' && startAt(b)<=now).reverse();
  const done = ss.filter(b=>b.status==='done').reverse();

  const head = `
    <div class="eyebrow" style="margin-top:0">CIRKELLEDARE<span class="ln"></span></div>
    <div class="h1" style="font-size:${c.n.length>22?'22px':'26px'};overflow-wrap:anywhere">${esc(c.n)}</div>
    <div class="sub">${nt(mem.length,'medlem','medlemmar')} · ${nt(done.length,'genomfört pass','genomförda pass')}</div>
    ${cs.length>1?`<div class="chips">${cs.map(x=>`<button class="chip ${x.id===c.id?'on':''}"
      onclick="simpleCircle='${x.id}';render()">${esc(x.n)}</button>`).join('')}</div>`:''}
    <div class="seg" role="tablist">
      <button role="tab" aria-selected="${leaderTab==='pass'}" class="${leaderTab==='pass'?'on':''}"
        onclick="leaderTab='pass';render()">Pass${pend.length?` <span class="dot-n">${pend.length}</span>`:''}</button>
      <button role="tab" aria-selected="${leaderTab==='members'}" class="${leaderTab==='members'?'on':''}"
        onclick="leaderTab='members';render()">Medlemmar <span class="muted">${mem.length}</span></button>
    </div>`;

  if(leaderTab==='members'){
    const mails = mem.map(p=>p.email).filter(Boolean);
    return head + `
      ${mails.length>1?`<a class="btn ghost slim" style="display:block;text-align:center;text-decoration:none;margin-bottom:12px"
        href="mailto:?bcc=${encodeURIComponent(mails.join(','))}">MEJLA ALLA (${mails.length})</a>`:''}
      ${mem.length ? mem.map(p=>{
        const hrs = hoursFor(p.id), full = hrs>=MAX_HOURS;
        return `<div class="card person">
          <div class="row" style="gap:12px">
            ${pav(p,40)}
            <div class="grow" style="min-width:0">
              <div class="mname">${esc(p.n)}</div>
              <div class="mrole">${hh(hrs)} av ${MAX_HOURS} h${full?' · ramen nådd':''}</div>
            </div>
          </div>
          <div class="bar thin"><i style="width:${Math.min(100,hrs/MAX_HOURS*100)}%;${full?'background:var(--warn)':''}"></i></div>
          <div class="contact">
            ${p.phone?`<a href="${telHref(p.phone)}"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2"/></svg>${esc(p.phone)}</a>
              <a href="sms:${String(p.phone).replace(/[^\d+]/g,'')}" aria-label="SMS till ${esc(p.n)}"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1.1-4.6A8 8 0 1121 12z"/></svg>SMS</a>`:''}
            ${p.email?`<a href="mailto:${esc(p.email)}"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg>${esc(p.email)}</a>`:''}
            ${!p.phone&&!p.email?'<span class="muted tiny">Inga kontaktuppgifter</span>':''}
          </div>
        </div>`;
      }).join('') : `<div class="empty">Inga medlemmar än. AZ skickar en inbjudningslänk till gruppen.</div>`}`;
  }

  const row = (b, actions, cls) => `<div class="srow ${cls||''}">
      <div class="srow-d"><b>${fromIso(b.date).getDate()}</b><span>${MON[fromIso(b.date).getMonth()]}</span></div>
      <div class="grow" style="min-width:0">
        <div class="srow-t">${relDay(b.date)?relDay(b.date).toLowerCase().replace(/^./,x=>x.toUpperCase())+' · ':DAY2[fromIso(b.date).getDay()]+' · '}${b.start}–${b.end}</div>
        <div class="srow-m">${b.status==='request'
          ? `Förslag från <b>${esc((byId(b.reqBy)||{}).n||'en medlem')}</b>`
          : b.status==='done' ? `${hh(b.hours)} h · ${nt((b.present||[]).length,'närvarande','närvarande')}${isLocked(b)?' · '+SST[sessState(b)].toLowerCase():''}`
          : esc(S.studios[b.studio]||'')}</div>
      </div>
      ${actions?`<div class="srow-a">${actions}</div>`:''}
    </div>`;
  const sm = (label, js, ghost) => `<button class="btn slim ${ghost?'ghost':''}" style="width:auto;flex:none;padding:9px 13px" onclick="${js}">${label}</button>`;

  return head + `
    ${(()=>{ const fl = ss.filter(b=>b.status!=='request' && startAt(b) >= addDays(now,-56)).flatMap(b=>sessionFlags(b).filter(f=>f.fix==='complete').map(f=>Object.assign(f,{b})));
      return fl.length ? `<div class="eyebrow" style="margin-top:0">ATT ÅTGÄRDA<span class="ln"></span><span style="color:var(--warn)">${fl.length}</span></div>
        <ul class="flags card" style="margin-bottom:12px">${fl.map(f=>`<li class="${f.level==='fel'?'f-err':'f-warn'}"><b>${fromIso(f.b.date).getDate()} ${MON[fromIso(f.b.date).getMonth()]}</b>: ${esc(f.text)}
          ${isLocked(f.b)?'':`<button class="linkbtn inline" onclick="openComplete('${f.b.id}')">Registrera</button>`}</li>`).join('')}</ul>` : ''; })()}
    <div class="card" style="margin-bottom:12px"><div class="studio-name">DIN TIMBANK</div>${leaderBank(m.id)}</div>
    ${courseOf(c) ? `<div style="margin-bottom:12px">${courseCard(c)}</div>` : ''}
    <button class="btn" onclick="openForm(null,null,'${c.id}')">+ BOKA PASS</button>
    ${pend.length?`<div class="eyebrow">VÄNTAR PÅ DIG<span class="ln"></span><span style="color:var(--warn)">${pend.length}</span></div>
      ${pend.map(b=>row(b, sm('Godkänn',`openApprove('${b.id}')`) + sm('Avböj',`declineRequest('${b.id}')`,1), 'req')).join('')}`:''}
    ${toMark.length?`<div class="eyebrow">ATT MARKERA<span class="ln"></span></div>
      ${toMark.map(b=>row(b, sm('Genomförd',`openComplete('${b.id}')`))).join('')}`:''}
    <div class="eyebrow">KOMMANDE<span class="ln"></span></div>
    ${coming.length ? coming.map(b=>row(b, '')).join('') : `<div class="empty">Inga bokade pass. Tryck på <b>Boka pass</b> ovan.</div>`}
    ${done.length?`<div class="eyebrow">GENOMFÖRDA<span class="ln"></span></div>
      ${done.slice(0,12).map(b=>row(b, isLocked(b) ? '' : sm('Ändra',`openComplete('${b.id}')`,1), 'done')).join('')}`:''}`;
}

/* ---------- BOKA: KUND, DELTAGARE OCH BOKNINGSSIDAN ----------
   Ett pass är tre timmar och får börja när som helst inom öppettiden. Den som bokar
   ser vilka tider som är upptagna — aldrig vem eller vad (my_view och free_slots
   skickar bara studio och tid) — och skickar en förfrågan. Crewet väljer studio när
   den godkänns, så kunden väljer aldrig studio själv. */
/* Öppettiderna ställs in under Crew → Studios (sparas med studionamnen). */
const openFrom = () => /^\d\d:\d\d$/.test(S.studios.openFrom||'') ? S.studios.openFrom : '10:00';
const openTo   = () => /^\d\d:\d\d$/.test(S.studios.openTo||'') ? S.studios.openTo : '23:00';
const toMin = t => { const [h,m] = String(t).split(':').map(Number); return h*60 + (m||0); };
const toHm  = n => String(Math.floor(n/60)).padStart(2,'0') + ':' + String(n%60).padStart(2,'0');
const SLOT = 180;                                        /* ett pass, i minuter */
const plusSlot = t => toHm((toMin(t) + SLOT) % 1440);
const dayEnd = () => toMin(openTo()) || 1440;            /* 00:00 = midnatt */
/* Upptaget i en studio en dag, i minuter från midnatt: [start, slut, passet].
   Ett nattpass från dagen innan räknas från 00:00. */
function busySpans(date, studio, list){
  const prev = iso(addDays(fromIso(date), -1)), out = [];
  for(const b of list){
    if(b.studio !== studio || (b.date !== date && b.date !== prev)) continue;
    const s = toMin(b.start), e = toMin(b.end), night = e <= s;
    if(b.date === date) out.push([s, night ? e + 1440 : e, b]);
    else if(night && e > 0) out.push([0, e, b]);
  }
  return out.sort((x,y)=>x[0]-y[0]);
}
/* Kundens valda producenter: {names, busy:[{name,date,start,end}]} — sätts av kundvyn, annars null.
   Deras upptagna tid stänger starttider på samma sätt som fullbokade studior. */
let slotProd = null, slotBusyName = '';
function prodSpans(date){
  if(!slotProd || !slotProd.names.length) return [];
  const prev = iso(addDays(fromIso(date), -1)), out = [];
  for(const b of slotProd.busy){
    if(!slotProd.names.includes(b.name) || (b.date !== date && b.date !== prev)) continue;
    const s = toMin(b.start), e = toMin(b.end), night = e <= s;
    if(b.date === date) out.push([s, night ? e + 1440 : e, b.name]);
    else if(night && e > 0) out.push([0, e, b.name]);
  }
  return out.sort((x,y)=>x[0]-y[0]);
}
/* En starttid är 'ok' när minst en studio är ledig hela passet, annars 'taken'.
   'producer' = en vald producent är upptagen. 'past' = redan passerad (eller mindre än
   en halvtimme bort), 'closed' = utanför öppettiden. */
function slotState(date, list, hm, spans, pspans){
  if(!/^\d\d:\d\d$/.test(hm||'')) return 'closed';
  const t = toMin(hm), now = new Date();
  if(t < toMin(openFrom()) || t + SLOT > dayEnd()) return 'closed';
  if(date < iso(now) || (date === iso(now) && t < now.getHours()*60 + now.getMinutes() + 30)) return 'past';
  spans = spans || ['A','B'].map(st=>busySpans(date, st, list));
  if(!spans.some(sp => !sp.some(([s,e]) => s < t + SLOT && t < e))) return 'taken';
  const hit = (pspans || prodSpans(date)).find(([s,e]) => s < t + SLOT && t < e);
  if(hit){ slotBusyName = hit[2]; return 'producer'; }
  return 'ok';
}
function slotStarts(date, list){
  const spans = ['A','B'].map(st=>busySpans(date, st, list)), ps = prodSpans(date), out = [];
  for(let t = toMin(openFrom()); t + SLOT <= dayEnd(); t += 30) out.push({t, hm:toHm(t), st:slotState(date, list, toHm(t), spans, ps)});
  return out;
}
/* Det som visas som knappar: hela timmar, och en halvtimme bara när den är enda vägen in. */
const shownStarts = ss => ss.filter((s,i) => s.st!=='past' && (s.t % 60 === 0
  || (s.st==='ok' && (ss[i-1]||{}).st!=='ok' && (ss[i+1]||{}).st!=='ok')));
function dayState(date, list){
  const ss = slotStarts(date, list);
  return ss.some(s=>s.st==='ok') ? 'free' : ss.some(s=>s.st==='taken' || s.st==='producer') ? 'full' : 'past';
}
const slotWhy = st => st==='taken' ? 'Båda studiorna är bokade då. Välj en annan starttid.'
  : st==='producer' ? `${slotBusyName || 'Producenten'} är upptagen då. Välj en annan tid${slotProd && slotProd.names.length > 1 ? '' : ' eller en annan producent'}.`
  : st==='past' ? 'Den tiden har redan varit eller är för nära — välj en senare.'
  : `Studion har öppet ${openFrom()}–${openTo()}. Ett pass är tre timmar, så sista starttid är ${toHm(dayEnd()-SLOT)}.`;
/* Starttidsfältet: visar sluttiden och varför tiden inte går. p = prefix för fältens id. */
function paintSlot(date, list, p){
  const v = (document.getElementById(p+'S')||{}).value || '', st = slotState(date, list, v);
  const e = document.getElementById(p+'E'), w = document.getElementById(p+'W'), btn = document.getElementById(p+'Btn');
  if(e) e.innerHTML = /^\d\d:\d\d$/.test(v) ? `till <b>${plusSlot(v)}</b> · 3 timmar` : '';
  if(w) w.innerHTML = st==='ok' ? '' : `<div class="warn">${esc(slotWhy(st))}</div>`;
  if(btn) btn.disabled = st!=='ok';
  return st;
}

/* Dagremsa, tidslinje per studio och starttider. Andras pass syns bara som "Bokat".
   c: list (bokat), days, day (vald dag), dayJs(d) och startJs(d, hm) (onclick),
   sel (vald starttid), mine(b) och mineLabel för egna pass. */
function slotPicker(c){
  const ds = c.day, ss = slotStarts(ds, c.list), shown = shownStarts(ss), st = dayState(ds, c.list);
  const from = toMin(openFrom()), to = dayEnd(), span = Math.max(1, to - from), today = iso(new Date());
  const pct = m => (Math.min(Math.max(m, from), to) - from) / span * 100;
  const n = new Date(), nowMin = ds === today ? n.getHours()*60 + n.getMinutes() : ds < today ? to : from;
  const ticks = []; for(let t = Math.ceil(from/60)*60; t <= to; t += 180) ticks.push(t);
  const sel = c.sel && slotState(ds, c.list, c.sel)==='ok' ? toMin(c.sel) : null;
  const bar = stu => `<div class="tl-n">${esc(S.studios[stu]||stu)}</div>
    <div class="tl-bar">
      ${nowMin > from ? `<i class="tl-past" style="width:${pct(nowMin).toFixed(2)}%"></i>` : ''}
      ${busySpans(ds, stu, c.list).filter(([s,e])=>e > from && s < to).map(([s,e,b])=>{
        const own = !!(c.mine && c.mine(b)), lab = own ? c.mineLabel : 'Bokat';
        return `<i class="tl-b${own?' own':''}" style="left:${pct(s).toFixed(2)}%;width:${(pct(e)-pct(s)).toFixed(2)}%"
          title="${esc(lab)} ${toHm(s%1440)}–${toHm(e%1440)}"><span>${esc(lab)}</span></i>`; }).join('')}
      ${sel!==null ? `<i class="tl-sel" style="left:${pct(sel).toFixed(2)}%;width:${(pct(sel+SLOT)-pct(sel)).toFixed(2)}%"></i>` : ''}
    </div>`;
  return `
    <div class="days" role="tablist" aria-label="Välj dag">${c.days.map(d=>{ const s = dayState(d, c.list), x = fromIso(d);
      return `<button class="dchip ${s} ${d===ds?'on':''}" role="tab" aria-selected="${d===ds}" onclick="${c.dayJs(d)}">
        <span>${d===today ? 'IDAG' : DAY[x.getDay()]}</span><b>${x.getDate()}</b>
        <i>${s==='free' ? MON[x.getMonth()] : s==='full' ? 'fullbokat' : 'stängt'}</i></button>`; }).join('')}</div>
    <div class="tl" aria-label="Bokat ${esc(longDate(ds).toLowerCase())}">
      ${bar('A')}${bar('B')}${slotProd && slotProd.names.length ? slotProd.names.map(nm=>`<div class="tl-n">${esc(nm)}</div>
        <div class="tl-bar">${nowMin > from ? `<i class="tl-past" style="width:${pct(nowMin).toFixed(2)}%"></i>` : ''}
          ${prodSpans(ds).filter(([s,e,n])=>n===nm && e > from && s < to).map(([s,e])=>`<i class="tl-b" style="left:${pct(s).toFixed(2)}%;width:${(pct(e)-pct(s)).toFixed(2)}%"
            title="${esc(nm)} upptagen ${toHm(s%1440)}–${toHm(e%1440)}"><span>Upptagen</span></i>`).join('')}</div>`).join('') : ''}
      <div class="tl-ax">${ticks.map(t=>`<span style="left:${pct(t).toFixed(2)}%;${t===from?'transform:none':t>=to?'transform:translateX(-100%)':''}">${toHm(t%1440)}</span>`).join('')}</div>
      <div class="tl-key"><span><i class="k-free"></i>Ledigt</span><span><i class="k-b"></i>Bokat</span>${
        c.mine ? `<span><i class="k-own"></i>${esc(c.mineLabel)}</span>` : ''}</div>
    </div>
    <div class="lbl" style="margin-top:16px">STARTTID <span class="muted" style="letter-spacing:0;text-transform:none;font-weight:500">— passet är 3 timmar</span></div>
    ${shown.length ? `<div class="chips wrap slots">${shown.map(s => s.st==='ok'
        ? `<button class="chip slot ${c.sel===s.hm?'on':''}" onclick="${c.startJs(ds, s.hm)}">${s.hm}–${plusSlot(s.hm)}</button>`
        : `<button class="chip slot taken" disabled title="${s.st==='producer' ? 'Producenten är upptagen' : 'Bokat'}">${s.hm}–${plusSlot(s.hm)}</button>`).join('')}</div>` : ''}
    ${st==='full' ? `<div class="note" style="margin-top:6px"><b>Fullbokat</b> ${ds===today?'resten av dagen':'den här dagen'}. Välj en annan dag.</div>`
      : st==='past' ? `<div class="note" style="margin-top:6px">Inga fler tider ${ds===today?'idag':'den här dagen'}. Välj en annan dag.</div>` : ''}`;
}

let bookDay = null;                      /* vald dag i bokningen (kund och deltagare) */
const bookDays = n => [...Array(n)].map((_,i)=>iso(addDays(new Date(), i)));
function pickBookDay(list, days){
  if(!bookDay || !days.includes(bookDay)) bookDay = days.find(d=>dayState(d, list)==='free') || days[0];
  return bookDay;
}
const dayName = d => relDay(d) ? relDay(d).toLowerCase().replace(/^./,x=>x.toUpperCase()) : DAY2[fromIso(d).getDay()].replace(/^./,x=>x.toUpperCase());
function myRow(b, sub, act){
  const d = fromIso(b.date);
  return `<div class="srow ${b.status==='request'?'req':b.status==='done'?'done':''}">
    <div class="srow-d"><b>${d.getDate()}</b><span>${MON[d.getMonth()]}</span></div>
    <div class="grow" style="min-width:0"><div class="srow-t">${dayName(b.date)} · ${b.start}–${b.end}</div>
      <div class="srow-m">${sub}</div></div>
    ${act||''}</div>`;
}

/* Avboka: förfrågningar när som helst, bokade pass senast en timme innan (samma
   regel som cancel_my_booking). Sedan hör man av sig till producenten eller ledaren. */
const tooLate = b => b.status!=='request' && startAt(b) - Date.now() < 36e5;
function mineBtn(b){
  const [label, js] = b.status==='request' ? ['Ta tillbaka', `cancelMine('${b.id}')`]
    : tooLate(b) ? ['Hör av dig', `openLate('${b.id}')`] : ['Avboka', `cancelMine('${b.id}')`];
  return `<button class="btn ghost slim" style="width:auto;flex:none;padding:9px 13px" onclick="${js}">${label}</button>`;
}
async function cancelMine(id){
  const b = S.bookings.find(x=>x.id===id); if(!b) return;
  if(tooLate(b)) return openLate(id);
  const req = b.status==='request';
  if(!confirm(req ? 'Ta tillbaka förfrågan?' : `Avboka ${longDate(b.date).toLowerCase()} ${b.start}–${b.end}?`)) return;
  if(!await act('cancel_my_booking', {p_booking:id}, ()=>{ b.del = true; b.up = Date.now(); save(); })) return;
  render(); toast(req ? 'Förfrågan borttagen' : 'Avbokad · crewet får veta'); sync(true);
}
/* Den kunden hör av sig till är sin producent; deltagaren sin cirkelledare. */
function myContact(b){
  const m = me(); if(!m) return null;
  if(m.r==='customer'){
    /* passets producent i första hand, sedan huvudproducenten */
    const w = b && (b.with||[])[0], wp = w && (myProducers().find(x=>x.name===w) || (byName(w) ? {name:w, email:byName(w).email, phone:byName(w).phone} : null));
    if(wp) return {name:wp.name, email:wp.email||'', phone:wp.phone||''};
    const p = S.contact || byId(m.producer);
    return p ? {name:p.name||p.n, email:p.email||'', phone:p.phone||''} : null;
  }
  const c = circleById((b && b.circleId) || simpleCircle), l = c && c.leader ? byName(c.leader) : null;
  return l ? {name:l.n, email:l.email||'', phone:l.phone||''} : null;
}
const ICO = {
  tel:'<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2"/></svg>',
  sms:'<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1.1-4.6A8 8 0 1121 12z"/></svg>',
  mail:'<svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg>'};
const contactLinks = (p, subject) => `<div class="contact">
    ${p.phone?`<a href="${telHref(p.phone)}">${ICO.tel}${esc(p.phone)}</a>
      <a href="sms:${String(p.phone).replace(/[^\d+]/g,'')}" aria-label="SMS till ${esc(p.name)}">${ICO.sms}SMS</a>`:''}
    ${p.email?`<a href="mailto:${esc(p.email)}${subject?'?subject='+encodeURIComponent(subject):''}">${ICO.mail}${esc(p.email)}</a>`:''}
    ${!p.phone&&!p.email?'<span class="muted tiny">Inga kontaktuppgifter</span>':''}
  </div>`;
const contactCard = (p, label) => p ? `<div class="eyebrow">${label}<span class="ln"></span></div>
  <div class="card person"><div class="mname">${esc(p.name)}</div>${contactLinks(p)}</div>` : '';
function openLate(id){
  const b = S.bookings.find(x=>x.id===id); if(!b) return;
  const p = myContact(b), who = p ? p.name : me().r==='customer' ? 'din producent' : 'din cirkelledare';

    <div class="sub">${esc(longDate(b.date))} · ${b.start}–${b.end}</div>
    <div class="note" style="margin-top:14px">Det går inte att avboka i appen när det är mindre än en timme kvar.
      Hör av dig till <b>${esc(who)}</b> direkt.</div>
    ${p && (p.phone||p.email) ? `<div class="card person" style="margin-top:12px"><div class="mname">${esc(p.name)}</div>
        ${contactLinks(p, 'Avbokning ' + longDate(b.date).toLowerCase() + ' ' + b.start)}</div>`
      : `<div class="tiny muted" style="margin-top:10px">Svara på bokningsbekräftelsen i din mejl, så når du studion.</div>`}`);
}

/* ---------- KUND ---------- */
/* Producenterna kunden kan boka med (admin väljer dem per artist) och när de är upptagna. */
function myProducers(){
  const m = me(); if(!m || m.r!=='customer') return [];
  if(remoteRole()) return (S.myProducers||[]).map(p=>({id:p.id, name:p.name, c:p.color||'#7c3aed', g:p.glow||'#a855f7', email:p.email||'', phone:p.phone||''}));
  return (m.producers||[]).map(byId).filter(isProducer).map(a=>({id:a.id, name:a.n, c:a.c, g:a.g, email:a.email||'', phone:a.phone||''}));
}
function producerBusyList(){
  if(remoteRole()) return S.producerBusy || [];
  const names = myProducers().map(p=>p.name);
  return live().filter(b=>!['request','declined'].includes(b.status||'') && !b.busy)
    .flatMap(b=>names.filter(n=>b.who===n || (b.with||[]).includes(n)).map(n=>({name:n, date:b.date, start:b.start, end:b.end})));
}
let bookWith = null;                              /* namnen kunden valt att boka med */
function toggleBookWith(nm){
  bookWith = bookWith || new Set();
  bookWith.has(nm) ? bookWith.delete(nm) : bookWith.add(nm);
  render();
}
function vCustomer(){
  const m = me(), now = new Date(), list = booked();
  const prods = myProducers(), names = prods.map(p=>p.name);
  /* en producent: förvald. Flera: kunden väljer. Inga: crewet väljer när förfrågan godkänns. */
  if(!bookWith || [...bookWith].some(n=>!names.includes(n))) bookWith = new Set(prods.length===1 ? names : [...(bookWith||[])].filter(n=>names.includes(n)));
  slotProd = prods.length ? {names:[...bookWith], busy:producerBusyList()} : null;
  const mine = live().filter(b=>b.who===m.n && !b.busy).sort((a,b)=>startAt(a)-startAt(b));
  const waiting = mine.filter(b=>b.status==='request' && endAt(b)>now);
  const upcoming = mine.filter(b=>b.status!=='request' && b.status!=='declined' && endAt(b)>now);
  const past = mine.filter(b=>b.status!=='request' && b.status!=='declined' && endAt(b)<=now).reverse();
  const rate = rateFor(m.n), days = bookDays(14), day = pickBookDay(list, days), p = myContact();
  const withTxt = b => (b.with||[]).length ? ' · med ' + b.with.map(esc).join(', ') : '';
  const sub = b => b.status==='request' ? 'Väntar på svar' + withTxt(b) + ' · studion väljs när den godkänns'
    : esc(S.studios[b.studio]||'') + withTxt(b) + (rate ? ' · ' + Math.round(dur(b)*rate) + ' kr' : '');
  const ci = myCircleInfo(), leadIsContact = p && ci && ci.circle && p.name===ci.circle.leader;
  return `
    ${profileBanner()}
    <div class="h1">Boka studiotid</div>
    <div class="sub">Ett pass är 3 timmar · ${rate?hh(rate)+' kr per timme':pkgs().length?'från '+kr(pkgs()[0].price)+' per session':'pris enligt överenskommelse'}</div>

    ${prods.length ? `<div class="eyebrow" style="margin-top:0">BOKA MED<span class="ln"></span></div>
      <div class="chips" id="bookWith" style="flex-wrap:wrap;overflow:visible">${prods.map(p=>`<button class="chip ${bookWith.has(p.name)?'on':''}"
        aria-pressed="${bookWith.has(p.name)}" onclick="toggleBookWith('${esc(p.name)}')"><i class="sw" style="background:${p.c}"></i>${esc(p.name)}</button>`).join('')}</div>
      <div class="tiny muted" style="margin:6px 0 4px">${bookWith.size ? 'Tiderna nedan visar när ' + (bookWith.size > 1 ? 'alla du valt är lediga' : [...bookWith][0] + ' är ledig') + '.'
        : 'Välj vem du vill boka med — sedan visar tiderna när de är lediga.'}</div>` : ''}

    ${slotPicker({list, days, day, dayJs:d=>`bookDay='${d}';render()`, startJs:(d,hm)=>`openSlot('${d}','${hm}')`,
      mine:b=>b.who===m.n && !b.busy, mineLabel:'Din tid'})}
    <div class="note">Välj en starttid och skicka en förfrågan. Crewet väljer studio och bekräftar på mejlen —
      tiden är din först när den är bekräftad.</div>

    ${waiting.length?`<div class="eyebrow">VÄNTAR PÅ SVAR<span class="ln"></span><span style="color:var(--warn)">${waiting.length}</span></div>
      ${waiting.map(b=>myRow(b, sub(b), mineBtn(b))).join('')}`:''}
    <div class="eyebrow">DINA BOKNINGAR<span class="ln"></span></div>
    ${upcoming.length ? upcoming.map(b=>myRow(b, sub(b), mineBtn(b))).join('') : `<div class="empty">Inga bekräftade bokningar än.</div>`}
    <div class="tiny muted" style="margin-top:4px;line-height:1.55">Avboka senast en timme innan. Efter det: hör av dig till
      ${esc(p ? p.name : 'din producent')}.</div>
    ${past.length?`<div class="eyebrow">TIDIGARE<span class="ln"></span></div>${past.slice(0,6).map(b=>myRow(b, sub(b))).join('')}`:''}
    ${circleCardFor()}
    ${accessCard()}
    ${interestsCard()}
    ${rewardsCard()}
    ${leadIsContact ? '' : contactCard(p, 'DIN PRODUCENT')}`;
}

/* Förfrågan från kund (request_customer_slot) eller deltagare (request_session).
   Bara starttiden väljs — slutet är alltid tre timmar senare. */
function openSlot(date, hm){
  const m = me(), cust = m.r==='customer', c = cust ? null : circleById(simpleCircle);
  if(cust && profileGaps(m)) return openProfileSheet(true);
  if(cust && myProducers().length && !(bookWith && bookWith.size)) return toast('Välj vem du vill boka med först');
  if(!cust && (!c || !can('requestSession', c))) return toast('Du är inte med i den cirkeln');
  openSheet(`${X}<h2>${cust ? 'Skicka förfrågan' : 'Föreslå en tid'}</h2>
    <div class="sub">${esc(longDate(date))}${cust ? (bookWith && bookWith.size ? ' · med <b>' + [...bookWith].map(esc).join(', ') + '</b>' : '')
      : ' · ' + esc(c.n) + ' · går till <b>' + esc(c.leader) + '</b>'}</div>
    <label class="lbl" for="slS">STARTTID</label>
    <div class="two"><input type="time" id="slS" value="${hm}" step="1800" oninput="paintSlot('${date}', booked(), 'sl')">
      <div class="slot-end" id="slE"></div></div>
    <div id="slW"></div>
    ${cust ? `<label class="lbl" for="slN">MEDDELANDE <span class="muted">(valfritt)</span></label>
      <textarea id="slN" maxlength="200" placeholder="Vad ska ni göra? Behövs en tekniker?"></textarea>` : ''}
    <button class="btn" id="slBtn" style="margin-top:20px" onclick="sendSlot('${date}')">SKICKA FÖRFRÅGAN</button>
    <div class="note">${cust ? 'Crewet väljer studio och bekräftar på mejlen.'
      : esc(c.leader) + ' väljer studio när förslaget godkänns — då är passet bokat.'} Avboka senast en timme innan.</div>`);
  paintSlot(date, booked(), 'sl');
}
async function sendSlot(date){
  const m = me(), a = document.getElementById('slS').value;
  if(paintSlot(date, booked(), 'sl')!=='ok') return;
  const b = plusSlot(a);
  if(m.r==='customer'){
    const note = document.getElementById('slN').value.trim(), withNames = [...(bookWith||[])].sort((x,y)=>x.localeCompare(y,'sv'));

let leadText = '';
async function approveLead(id, studio){
  const l = (S.leads||[]).find(x=>x.id===id); if(!l) return;
  let tok = null;
  try{
    if(PREVIEW_LOGIN){
      if(!freeAt(studio, l.date, l.start_t, l.end_t, null)) throw new Error('Studion hann bli upptagen');
      S.bookings.push(bump({id:uid(), studio, date:l.date, start:l.start_t, end:l.end_t, who:l.name, title:'Studiotid',
        note:l.message||'', circleId:'', status:'', hours:null, present:[], with:[], artistId:'', paid:true, leadId:l.id, del:false}));
      tok = localToken();
      S.invites.push({token:tok, role:'customer', circle_id:null, expires_at:Date.now()+30*864e5, max_uses:1, uses:0,
        closed:false, created:Date.now(), name:l.name, email:l.email||null, lead_id:l.id});
      Object.assign(l, {status:'approved', invite:tok}); save();
      if(l.email) toast('Bokad · i drift får kunden ett mejl med länken');
    } else {
      const r = await sbRpc('approve_lead', {p_lead:id, p_studio:studio, p_url:appUrl()});
      tok = r && r.invite; l.status = 'approved'; await sync(true);
      if(l.email) toast('Bokad · kunden får en bekräftelse med länken på mejlen');
    }
    render();
    if(l.email || !tok) return closeSheet();
    /* ingen e-post: crewet skickar bekräftelsen och länken själva */
    leadText = `Hej ${l.name.split(' ')[0]}! Din tid ${longDate(l.date).toLowerCase()} ${l.start_t}–${l.end_t} är bokad i ${S.studios[studio]}. `

async function declineLead(id){

async function doApprove(id, studio){
  const b = S.bookings.find(x=>x.id===id); if(!b) return;
  if(!mayAnswer(b)) return toast('Bara cirkelns ledare kan svara');
  /* Kollas igen vid godkännandet — någon kan ha bokat tiden under tiden. */
  if(!freeAt(studio, b.date, b.start, b.end, b.id))
    return toast(S.studios[studio] + ' hann bli upptagen');
  const doit = b.circleId ? circleAct : act;
  if(!await doit('answer_request', {p_booking:id, p_approve:true, p_studio:studio}, ()=>{
    if(b.circleId){ const err = circleSessionError(Object.assign({}, b, {studio}), b.id); if(err) return err; }
    const w = !b.circleId && can('manageCrew') && pickProd.appr ? [...pickProd.appr].map(id=>(byId(id)||{}).n).filter(Boolean) : null;
    Object.assign(b, {studio, status:'', up:Date.now()}, w ? {with:w} : {}); save(); })) return;
  closeSheet(); render();
  toast('Godkänd · ' + S.studios[studio] + ' bokad'); sync(true);
}
async function declineRequest(id){
  const b = S.bookings.find(x=>x.id===id); if(!b) return;
  if(!mayAnswer(b)) return toast('Bara cirkelns ledare kan svara');
  if(!confirm('Avböj förfrågan?')) return;
  if(!await (b.circleId ? circleAct : act)('answer_request', {p_booking:id, p_approve:false, p_studio:null}, ()=>{
    Object.assign(b, {status:'declined', up:Date.now()}); save(); })) return;
  closeSheet(); render(); toast('Avböjd'); sync(true);
}

/* ---------- IPHONE-APPEN OCH DEMOLÄGET ---------- */
async function nativeInit(){
  if(!isNative()) return;
  document.body.classList.add('native');
  const App = plug('App'), Push = plug('PushNotifications');
  /* inbjudningar, #boka och lösenordslänkar från mejl öppnar appen (Universal Links) */
  if(App) App.addListener('appUrlOpen', e => openLanding(e && e.url));
  if(Push){
    try{ const p = (await Push.checkPermissions()).receive; nativePerm = p==='granted' ? 'granted' : p==='denied' ? 'denied' : 'default'; }catch(_){}
    /* tryck på en notis: färsk data och appens första vy */
    Push.addListener('pushNotificationActionPerformed', () => {
      if(!S.session) return;
      if(roleView()==='full') go(tabs()[0]); else render();
      sync(true);
    });
  }
}
async function openLanding(url){
  let u; try{ u = new URL(url); }catch(_){ return; }
  if(!/(^|\.)bandohq\.se$/.test(u.hostname)) return;
  history.replaceState(null, '', location.pathname + u.search + u.hash);
  gateErr = '';
  await readLanding();
  if(joinToken || recoverToken) showGate();
  else if(S.session) render();
}

  if(!DEMO) return '';
  return `<div class="pushban" role="status"><div class="grow"><b>Demoläge</b> — påhittade personer och pass. Inget sparas på servern.</div>
    <button class="btn slim ghost" style="width:auto;flex:none;padding:10px 14px" onclick="leaveDemo()">AVSLUTA</button></div>`;
}
function enterDemo(){
  const go2 = () => {
    try{
      localStorage.setItem(KEY, JSON.stringify(window.bandohqDemo({who:'AZ'})));
      /* en ev. egen serverinställning (tester, utveckling) läggs undan och kommer tillbaka efteråt */
      const prev = localStorage.getItem('bandosesh_cloud');
      if(prev !== null) localStorage.setItem(DEMO_LS + '_cloud', prev);
      localStorage.setItem('bandosesh_cloud', JSON.stringify({url:'', key:''}));
      localStorage.setItem(DEMO_LS, '1');
    }catch(_){}
    saveAuth(null); location.hash = ''; location.reload();
  };
  if(window.bandohqDemo) return go2();
  const sc = document.createElement('script'); sc.src = 'demo.js?v=' + Date.now();
  sc.onload = go2;
  sc.onerror = () => { gateErr = 'Demoläget gick inte att ladda — försök igen'; renderGate(); };
  document.head.appendChild(sc);
}
function leaveDemo(){
  try{
    const prev = localStorage.getItem(DEMO_LS + '_cloud');
    [KEY, 'bandosesh_cloud', DEMO_LS, DEMO_LS + '_cloud'].forEach(k=>localStorage.removeItem(k));
    if(prev !== null) localStorage.setItem('bandosesh_cloud', prev);
  }catch(_){}
  location.reload();
}

  const shared = crew().filter(m=>m.email && m.id!==me().id), noMail = crew().filter(m=>!m.email && m.id!==me().id);
  openSheet(`${X}<h2>Dropbox</h2>
    <div class="sub">Beatkanalen och crewets filer bor i en delad mapp: <b>BANDOHQ</b>.</div>
    <label class="lbl">APP KEY</label>
    <input id="dbxKey" value="${esc(S.dropbox.appKey||'')}" placeholder="t.ex. a1b2c3d4e5f6g7h" autocomplete="off" spellcheck="false">
    <div class="note" style="margin-top:10px">Skapas i <b>Dropbox App Console</b> (Scoped access → Full Dropbox).
      Lägg in den här adressen som <b>Redirect URI</b>:<br><span class="mono">${esc(dbxRedirect())}</span><br>
      Steg för steg finns i <b>SETUP.md</b>. App key är inte hemlig — det finns ingen hemlighet i appen.</div>
    ${dbxConnected()
      ? `<button class="btn" style="margin-top:16px" onclick="runDbxSetup()">${S.dropbox.setupAt?'KÖR SETUPEN IGEN':'SÄTT UPP MAPPARNA'}</button>`
      : `<button class="btn" style="margin-top:16px" onclick="saveDbxKey(true)">SPARA OCH KOPPLA</button>`}
    <div id="setupLog"></div>
    <div style="margin-top:18px">
      <div class="kv"><span>MAPPAR</span><b>${S.dropbox.setupAt?crew().length+' beatmappar':'inte skapade'}</b></div>
      <div class="kv"><span>DELAD MED</span><b>${shared.length} i crewet</b></div>
      <div class="kv" style="border:0"><span>UPPSATT</span><b>${
        S.dropbox.setupAt?new Date(S.dropbox.setupAt).toLocaleString('sv-SE'):'aldrig'}</b></div></div>
    ${noMail.length?`<div class="warn" style="margin-top:12px"><b>Saknar e-post:</b> ${noMail.map(m=>esc(m.n)).join(', ')}.
      De får ingen delning förrän adressen finns under Crew. Kör sedan setupen igen.</div>`:''}
    <div class="note">Delningen går till e-posten på kontot. Använder någon en annan adress i Dropbox,
      ändra den under Crew — eller bjud in personen till mappen direkt i Dropbox.</div>`);
}
function saveDbxKey(connect){
  const k = document.getElementById('dbxKey').value.trim();
  if(!/^[a-z0-9]{8,}$/i.test(k)) return toast('Det ser inte ut som en app key');
  S.dropbox = Object.assign({}, S.dropbox, {appKey:k, up:Date.now()}); save(); sync(true);
  if(connect) dbxConnect();
}
async function runDbxSetup(){
  const k = document.getElementById('dbxKey').value.trim();
  if(k && k!==S.dropbox.appKey){ S.dropbox = Object.assign({}, S.dropbox, {appKey:k, up:Date.now()}); save(); }
  const log = document.getElementById('setupLog');
  const say = t => log.innerHTML = `<div class="okbox">${esc(t)}</div>`;
  say('Startar…');
  try{
    const r = await dbxSetup(say);
    log.innerHTML = `<div class="okbox"><b>Klart.</b><br>${r.folders} beatmappar i <b>${ROOT_NAME}/Beats</b>.<br>
      Delad med ${r.shared} personer i crewet. De får ett mejl från Dropbox.</div>`;
    render(); toast('Dropbox är uppsatt');
  }catch(e){
    log.innerHTML = `<div class="warn"><b>Gick inte.</b><br>${esc(e.message)}</div>`;
  }
}

function pickRole(r){
  document.getElementById('acR').value = r;
  document.querySelectorAll('.chip.role').forEach(el=>el.classList.toggle('on', el.dataset.r===r));
  paintRoleNote();
}
function paintRoleNote(){
  const r = document.getElementById('acR').value;
  const txt = ROLE_HELP[r] || '';
  const el = document.getElementById('roleNote');
  if(el) el.innerHTML = esc(txt);
}
function saveAccount(id){
  const nn = document.getElementById('acN').value.trim().slice(0,40);
  const ne = document.getElementById('acE').value.trim();
  const np = document.getElementById('acP').value.trim();
  const nr = document.getElementById('acR').value;
  const nt_ = document.getElementById('acT').value.trim(), ni = document.getElementById('acI').value.trim().replace(/^@/,'');
  const nps = [...(pickProd.ac||[])], nk = nps[0] || '';
  if(!nn) return toast('Fyll i namn');
  if(nr==='manager' && !can('grantManager')) return toast('Bara managern kan göra någon till manager');
  if(ne && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(ne)) return toast('E-postadressen ser fel ut');
  if(ne && accounts().some(c=>c.id!==id && (c.email||'').toLowerCase()===ne.toLowerCase()))
    return toast('E-posten används redan');
  if(accounts().some(c=>c.id!==id && c.n===nn)) return toast('Namnet är upptaget');

  if(id){
    const m = byId(id); if(!m) return;
    /* Sista managern får inte degraderas — då kommer ingen åt inställningarna. */
    if(m.r==='manager' && nr!=='manager' && accounts().filter(c=>c.r==='manager').length<2)
      return toast('Det måste finnas minst en manager');
    const leads = lcircle().filter(c=>c.leader===m.n);
    if(leads.length && !isCrewRole(nr) && nr!=='leader'
       && !confirm(`${m.n} leder ${leads.length} ${leads.length===1?'cirkel':'cirklar'}.\n\nByter du roll står de utan ledare tills du sätter en ny.`))
      return;
    if(nn !== m.n){
      S.bookings.forEach(b=>{ if(b.who===m.n){ b.who=nn; b.up=Date.now(); } });
      S.files.forEach(f=>{ if(f.who===m.n){ f.who=nn; f.up=Date.now(); } });
      S.circles.forEach(c=>{ if(c.leader===m.n){ c.leader=nn; c.up=Date.now(); } });
      if(S.session && S.session.member===m.n) S.session.member = nn;
      m.n = nn;
    }
    Object.assign(m, {email:ne, phone:np, r:nr, team:nt_, ig:ni, producer:nk, producers:nps, part:document.getElementById('acPart').checked, up:Date.now()});
    /* behörigheterna: Artist Intelligence (producenter) och Producent också (admin, manager) */
    let perms = (m.perms||[]).slice();
    const flag = (id, p) => { const x = document.getElementById(id); if(x) perms = x.checked ? [...new Set(perms.concat(p))] : perms.filter(y=>y!==p); };
    flag('acX', 'artist_intel'); flag('acPr', 'producer');
    if(JSON.stringify([...perms].sort()) !== JSON.stringify([...(m.perms||[])].sort()))
      rw('set_member_perms', {p_member:m.id, p_perms:perms}).then(()=>{ m.perms = perms; save(); render(); }).catch(e=>toast(e.message));
  } else {
    S.accounts.push({id:uid(), n:nn, r:nr, email:ne, phone:np, team:nt_, ig:ni, producer:nk, producers:nps,
      part:document.getElementById('acPart').checked, interests:[], c:'#6633b8', g:'#9d5cf5',
      active:true, del:false, up:Date.now()});
  }
  save(); closeSheet(); buildNav(); render(); toast('Sparat'); sync(true);
}
function toggleActive(id){
  const m = byId(id); if(!m) return;
  if(m.r==='manager' && m.active!==false && accounts().filter(c=>c.r==='manager' && c.active!==false).length<2)
    return toast('Det måste finnas minst en aktiv manager');
  m.active = m.active===false; m.up = Date.now();
  save(); closeSheet(); render(); toast(m.active===false?'Kontot avstängt':'Kontot aktiverat'); sync(true);
}

/* ---------- INBJUDNINGAR ----------
   En länk per roll (och cirkel). Den som öppnar den skriver in sina egna
   uppgifter — managern skriver aldrig in någons e-post. */
let invDraft = null;
function openInvites(role, circleId){
  if(!can('manageCrew')) return;
  role = role || (invDraft && invDraft.role) || 'producer';
  invDraft = {role, circle: circleId || (invDraft && invDraft.circle) || (lcircle()[0]||{}).id || '',
    days: 14, max: role==='participant' ? 0 : 1, made: ''};
  paintInvites();
}
function paintInvites(){
  const d = invDraft, needC = d.role==='leader' || d.role==='participant';
  const chip = (on, label, js) => `<button class="chip ${on?'on':''}" onclick="${js}">${label}</button>`;
  const set = (k, v) => `invDraft.${k}=${typeof v==='string'?`'${v}'`:v};invDraft.made='';paintInvites()`;
  openSheet(`${X}
    <h2>Bjud in</h2>
    <div class="sub">Skapa en länk och skicka den. Rollen följer med länken — den som öppnar den
      fyller själv i namn, e-post och lösenord.</div>
    <label class="lbl">SOM</label>
    <div class="chips wrap">${inviteRoles().map(([r,n])=>chip(d.role===r, n,
      `invDraft.role='${r}';invDraft.max=${r==='participant'?0:1};invDraft.made='';paintInvites()`)).join('')}</div>
    ${d.role==='camera' ? `<label class="lbl" for="invT">TEAM</label>
      <input id="invT" list="teamList" value="${esc(d.team||'')}" placeholder="t.ex. D2L" maxlength="30"
        oninput="invDraft.team=this.value.trim();invDraft.made=''">
      <datalist id="teamList">${[...new Set(cameras().map(a=>a.team).filter(Boolean))].map(t=>`<option value="${esc(t)}">`).join('')}</datalist>
      <div class="note">Alla som går med via länken hamnar i teamet och krediteras med teamets namn i galleriet.
        För D2L: en länk med <b>Hela gruppen</b>, eller en per person.</div>` : ''}
    ${needC ? (lcircle().length ? `<label class="lbl" for="invC">${d.role==='leader'?'LEDARE FÖR':'DELTAGARE I'}</label>
      <select id="invC" onchange="invDraft.circle=this.value;invDraft.made='';paintInvites()">${lcircle().map(c=>
        `<option value="${c.id}" ${d.circle===c.id?'selected':''}>${esc(c.n)}</option>`).join('')}</select>`
      : `<div class="warn" style="margin-top:12px">Skapa en cirkel först — länken kopplar personen till den.</div>`) : ''}
    <div class="two">
      <div><label class="lbl">GILTIG</label>
        <div class="chips wrap">${[[1,'1 dag'],[7,'7 dagar'],[14,'14 dagar'],[30,'30 dagar']].map(([v,n])=>chip(d.days===v, n, set('days', v))).join('')}</div></div>
      <div><label class="lbl">ANTAL</label>
        <div class="chips wrap">${chip(d.max===1,'En person',set('max',1))}${chip(d.max===0,'Hela gruppen',set('max',0))}</div></div>
    </div>
    ${d.made ? `<div class="invlink">
        <div class="tiny muted">LÄNKEN</div>
        <div class="mono" style="margin-top:6px">${esc(inviteUrl(d.made))}</div>
        <div class="row" style="gap:9px;margin-top:12px">
          <button class="btn slim" style="flex:1" onclick="shareInvite('${d.made}')">DELA</button>
          <button class="btn ghost slim" style="flex:1" onclick="copy(inviteUrl('${d.made}'),'Länken kopierad')">KOPIERA</button>
        </div></div>`
      : `<button class="btn" style="margin-top:20px" ${needC && !lcircle().length?'disabled':''} onclick="makeInvite()">SKAPA LÄNK</button>`}
    <div class="eyebrow">LÄNKAR<span class="ln"></span></div>
    <div id="invList"><div class="skel" style="height:58px"></div></div>`);
  paintInviteList();
}
async function makeInvite(){
  const d = invDraft;
  try{
    const c = (d.role==='leader'||d.role==='participant') ? d.circle : null;
    d.made = await createInvite(d.role, c, d.days, d.max || null, {team: d.role==='camera' ? (d.team||'') : ''});
    paintInvites();
  }catch(e){ toast(e.message); }
}
function inviteText(i){
  const c = i.circle_id ? circleById(i.circle_id) : null;
  return (INVITE_ROLES[i.role]||i.role) + (c ? ' · ' + c.n : '') + (i.team ? ' · ' + i.team : '') + (i.name ? ' · ' + i.name : '');
}
function shareInvite(tok){
  const i = (S.invites||[]).find(x=>x.token===tok) || {role:invDraft.role, circle_id:invDraft.circle};
  const txt = `Du är inbjuden till BANDOHQ som ${inviteText(i).replace(' · ',' i ')}. Skapa ditt konto här:\n` + inviteUrl(tok);
  if(navigator.share) navigator.share({title:'BANDOHQ', text:txt}).catch(()=>{});
  else copy(txt, 'Inbjudan kopierad — klistra in den i chatten');
}
async function paintInviteList(){
  const el = () => document.getElementById('invList');
  let list;
  try{ list = await listInvites(); }
  catch(e){ if(el()) el().innerHTML = `<div class="warn">${esc(e.message)}</div>`; return; }
  if(!el()) return;
  if(!PREVIEW_LOGIN) S.invites = list;

function presets(){
  const out = []; let t = toMin(openFrom());
  for(; t + SLOT <= dayEnd(); t += SLOT) out.push([toHm(t), toHm(t + SLOT)]);
  if(t < 1440) out.push([toHm(t), toHm((t + SLOT) % 1440)]);
  return out;
}

function shiftEnd(){
  const s = document.getElementById('fStart'), e = document.getElementById('fEnd'), ok = t => /^\d\d:\d\d$/.test(t||'');
  /* cirkelpass har fast längd (Cirklar → Regler) */
  if((document.getElementById('fCircle')||{}).value && ok(s.value)){ e.value = plusH(s.value, ccfg().sessionHours); s.dataset.prev = s.value; return checkForm(); }
  if(ok(s.value) && ok(s.dataset.prev) && ok(e.value)){
    const len = (toMin(e.value) - toMin(s.dataset.prev) + 1440) % 1440 || SLOT;
    e.value = toHm((toMin(s.value) + len) % 1440);
  }
  if(ok(s.value)) s.dataset.prev = s.value;
  checkForm();

    el.textContent = ok ? 'Ledig' : 'Upptagen';

  });
  if(!f.date||!f.start||!f.end){ box.innerHTML=''; btn.disabled=true; return; }
  /* samma start och slut skulle annars tolkas som nattpass och bli 24 h */
  if(f.start===f.end){
    box.innerHTML = `<div class="warn">Start och slut är samma tid. Sätt en sluttid.</div>`;
    btn.disabled = true; return;
  }
  const c = clash(f, editId);
  if(c.length){
    const o=c[0], other = f.studio==='A'?'B':'A';
    const alt = freeAt(other,f.date,f.start,f.end,editId);
    box.innerHTML = `<div class="warn"><b>Krock i ${esc(S.studios[f.studio])}</b><br>
      ${esc(o.who)} har ${o.start}–${o.end}${o.title?' · '+esc(o.title):''}.
      ${alt?`<br><b style="color:var(--pur3)" onclick="pickStudio('${other}')">→ ${esc(S.studios[other])} är ledig, byt dit</b>`:''}</div>`;
    btn.disabled = true;
  } else {
    const h = dur(f);
    /* cirkelpass: tre timmar, krockar för ledare och deltagare, timbanken */
    const ce = f.circleId ? circleSessionError(Object.assign({}, f, {leaderId:editId ? leaderIdOf(S.bookings.find(x=>x.id===editId)||f) : ''}), editId) : '';
    box.innerHTML = ce ? `<div class="warn">${esc(ce)}</div>` : `<div class="okbox">Ledigt ✓ ${esc(S.studios[f.studio])} · ${hh(h)} h${
      h>0&&endAt(f).getDate()!==startAt(f).getDate()?' (över midnatt)':''}</div>`;
    btn.disabled = !!ce;
  }
  if(f.circleId){ btn.onclick = saveBooking; btn.textContent = editId ? 'FLYTTA PASSET' : 'BOKA PASSET'; }
}
function saveBooking(){
  const f = readForm();
  if(!f.date||!f.start||!f.end) return toast('Fyll i datum och tid');
  if(f.start===f.end) return toast('Start och slut är samma tid');
  if(clash(f, editId).length) return toast('Tiden krockar');
  const rep = document.getElementById('fRep') ? +document.getElementById('fRep').value : 1;
  if(f.circleId) return saveCircleBooking(f, rep);
  if(!can('dashboard') && f.who!==me().n) return toast('Du kan bara boka åt dig själv');
  if(remoteRole() && !editId) return saveBookingRemote(f, rep);
  if(editId){
    const b = S.bookings.find(x=>x.id===editId);
    if(!can('editBooking',b)) return toast('Du kan bara ändra dina egna pass');
    Object.assign(b, f, {up:Date.now()});
    save(); closeSheet(); render(); toast('Passet uppdaterat'); sync(true);
    return;
  }
  let made=0, skipped=0;
  for(let i=0;i<rep;i++){
    const d = iso(addDays(fromIso(f.date), i*7));
    const nb = Object.assign({}, f, {id:uid(), date:d, up:Date.now(), del:false,
      status:'', hours:null, present:[]});
    if(clash(nb).length){ skipped++; continue; }
    S.bookings.push(nb); made++;
  }
  save(); closeSheet();
  selDate = f.date; weekStart = monday(fromIso(f.date));
  if(f.circleId && view==='circles') render();
  else if(view==='files'||view==='team'||view==='dash'||view==='circles') go('week');
  else render();
  toast(made>1 ? `${made} pass bokade${skipped?` · ${skipped} krockade`:''}` : 'Passet är bokat');
  sync(true);
}

/* Ledaren bokar sin cirkel, kunden bokar studiotid — servern krockkollar och
   sätter vem passet gäller, så ingen kan boka i någon annans namn. */
/* Cirkelpass: en omgång (upprepa varje vecka) kontrolleras först — tre timmar, studio,
   krockar för ledare och deltagare, timbanken — och visas datum för datum. Bara de
   som går bokas. Ett flyttat pass (editId) går via update_circle_session. */
let circlePlan = null;
async function saveCircleBooking(f, rep, go){
  const box = document.getElementById('clash'), btn = document.getElementById('saveBtn');
  if(editId){
    const b = S.bookings.find(x=>x.id===editId); if(!b) return;
    if(isLocked(b)) return toast(LOCKED_MSG);
    const ok = await circleAct('update_circle_session', {p_booking:editId, p_date:f.date, p_start:f.start, p_studio:f.studio}, ()=>{
      const n = Object.assign({}, b, {date:f.date, start:f.start, end:plusH(f.start, ccfg().sessionHours), studio:f.studio});
      if(!freeAt(n.studio, n.date, n.start, n.end, b.id)) return 'Studion är upptagen den tiden';
      const err = circleSessionError(n, b.id); if(err) return err;
      Object.assign(b, n, {up:Date.now()}); save(); });
    if(!ok) return;
    closeSheet(); render(); toast('Passet är flyttat'); if(PREVIEW_LOGIN) sync(true); return;
  }
  const dates = [...Array(Math.max(1, rep))].map((_,i)=>iso(addDays(fromIso(f.date), i*7)));
  if(!go){
    let res;
    try{ res = await circlePlanCheck(f.circleId, dates, f.start, f.studio); }catch(e){ return toast(e.message); }
    const okN = res.filter(r=>r.ok).length;
    circlePlan = {f, dates: res.filter(r=>r.ok).map(r=>r.date)};
    if(rep===1 && okN===1) return saveCircleBooking(f, rep, true);
    if(box) box.innerHTML = `<div class="${okN===res.length?'okbox':'warn'}" style="line-height:1.6">${res.map(r=>
      `<div>${r.ok?'✓':'✗'} <b>${esc(longDate(r.date))}</b>${r.ok?'':' — '+esc(r.reason)}</div>`).join('')}</div>`;
    if(btn){ btn.disabled = !okN; btn.textContent = okN ? `BOKA ${nt(okN,'PASS','PASS')}` : 'INGET GÅR ATT BOKA';
      btn.onclick = () => saveCircleBooking(circlePlan.f, rep, true); }
    return;
  }
  const todo = (circlePlan && circlePlan.f === f ? circlePlan.dates : dates);
  let made = 0, err = '';
  const c = circleById(f.circleId), lid = c && c.leader ? (byName(c.leader)||{}).id || '' : '';
  const end = plusH(f.start, ccfg().sessionHours);
  for(const d of todo){
    if(PREVIEW_LOGIN){
      const nb = Object.assign({}, f, {id:uid(), date:d, end, leaderId:lid, who:c ? c.leader : f.who, up:Date.now(), del:false,
        status:'', hours:null, present:[], with:[], artistId:'', paid:false});
      const e2 = !freeAt(nb.studio, d, nb.start, nb.end, null) ? 'Studion är upptagen' : circleSessionError(nb, null);
      if(e2){ err = e2; continue; }
      S.bookings.push(nb); made++;
    } else {
      try{ await sbRpc('book_circle_session', {p_circle:f.circleId, p_date:d, p_start:f.start, p_end:end, p_studio:f.studio}); made++; }
      catch(e){ err = e.message; }
    }
  }
  circlePlan = null;
  if(!made) return toast(err || 'Gick inte att boka');
  if(PREVIEW_LOGIN){ save(); sync(true); }
  else { try{ if(remoteRole()) await cloudView(); else await cloudPull(); }catch(_){} }
  closeSheet(); selDate = f.date; weekStart = monday(fromIso(f.date)); render();
  toast(made>1 ? `${made} pass bokade${todo.length>made?` · ${todo.length-made} gick inte`:''}` : 'Passet är bokat');
}
async function saveBookingRemote(f, rep){
  let made = 0, skipped = 0, err = '';
  for(let i=0; i<rep; i++){
    const d = iso(addDays(fromIso(f.date), i*7));
    try{
      if(f.circleId) await sbRpc('book_circle_session', {p_circle:f.circleId, p_date:d, p_start:f.start, p_end:f.end, p_studio:f.studio});
      else await sbRpc('book_customer_slot', {p_date:d, p_start:f.start, p_end:f.end, p_studio:f.studio});
      made++;
    }catch(e){ skipped++; err = e.message; }
  }
  if(!made) return toast(err || 'Gick inte att boka');
  await cloudView().catch(()=>{});
  closeSheet(); selDate = f.date; weekStart = monday(fromIso(f.date)); render();
  toast(made>1 ? `${made} pass bokade${skipped?` · ${skipped} krockade`:''}` : 'Passet är bokat');
}

async function del(id){
  const b = S.bookings.find(x=>x.id===id); if(!b) return;
  if(!can('delBooking',b)) return toast('Du kan bara ta bort dina egna pass');
  if(!confirm(b.circleId ? 'Ställa in cirkelpasset?' : 'Ta bort passet?')) return;
  if(b.circleId){
    if(isLocked(b)) return toast(LOCKED_MSG);
    if(b.status==='done') return toast('Passet är genomfört — ångra det först om det inte blev av');
    if(!await circleAct('cancel_circle_session', {p_booking:id}, ()=>{ b.del = true; b.up = Date.now(); save(); })) return;
    closeSheet(); render(); toast('Passet är inställt'); if(PREVIEW_LOGIN) sync(true); return;
  }
  if(!await act('cancel_my_booking', {p_booking:id}, ()=>{ b.del = true; b.up = Date.now(); save(); })) return;
  closeSheet(); render(); toast('Passet borttaget'); sync(true);
}

/* ===================== DELNINGSKOD (reservväg) ===================== */
function payload(){
  const cut = iso(addDays(new Date(),-30));
  const p = fullPayload();
  p.b = p.b.filter(r=>r[2]>=cut);
  return b64(JSON.stringify(p));
}
function b64(str){
  const bytes = new TextEncoder().encode(str);
  let bin=''; bytes.forEach(x=>bin+=String.fromCharCode(x));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unb64(s){
  s = s.trim().replace(/-/g,'+').replace(/_/g,'/');
  const bin = atob(s + '==='.slice((s.length+3)%4));
  return new TextDecoder().decode(Uint8Array.from(bin, c=>c.charCodeAt(0)));
}
function shareLink(){
  const url = location.href.split('#')[0] + '#s=' + payload();
  const txt = 'BANDOHQ – schemat är uppdaterat:\n' + url;
  if(navigator.share) navigator.share({title:'BANDOHQ', text:txt}).catch(()=>{});
  else copy(url, 'Länk kopierad');
}
function copyCode(){ copy(payload(), 'Synkkod kopierad – klistra in i gruppchatten'); }
function copy(t, msg){
  if(navigator.clipboard && location.protocol!=='file:')
    navigator.clipboard.writeText(t).then(()=>toast(msg),()=>fallback(t));
  else fallback(t);
  function fallback(t){
    const a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity='0';
    document.body.appendChild(a); a.select();
    try{ document.execCommand('copy'); toast(msg); }catch(e){ toast('Kunde inte kopiera'); }
    a.remove();
  }
}
function doImport(){
  const el = document.getElementById('imp'); const v = el.value.trim();
  if(!v) return toast('Klistra in en kod först');
  const code = v.includes('#s=') ? v.split('#s=')[1] : v;
  try{
    /* Med servern: posterna flyttas in, men inte kontona — de kommer via
       inbjudningar, och managerns synk skulle annars skicka upp dem. */
    const keep = PREVIEW_LOGIN ? null : JSON.parse(JSON.stringify(S.accounts));   /* en kopia — mergeData ändrar listan på plats */
    const r = mergeData(JSON.parse(unb64(code)));
    if(keep){ S.accounts = keep; S.cloud.pushedAt = 0; save(); sync(false); }
    el.value=''; render(); toast(`${r.add} nya · ${r.upd} uppdaterade`);
  }catch(e){ toast('Koden gick inte att läsa'); }
}
/* Allt, inte bara de senaste 30 dagarna — för flytten till servern. */
function copyAll(){ copy(b64(JSON.stringify(fullPayload())), 'Allt kopierat — klistra in efter inloggningen'); }
