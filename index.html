  if(!force && Date.now() - rwMineAt < 30000) return;
  rwMineAt = Date.now();
  Promise.all([rw('points_summary', {}), rw('rewards_catalog', {})])
    .then(([s1, c1])=>{ rwMine = s1; rwCat = c1; render(); }).catch(()=>{});

      <div class="tiny muted" style="margin-top:10px">Du får ${cat.tiers.map(t=>`${fmtP(t.points)} poäng för ${fmtH(t.hours)} h`).join(' och ')} när passet är betalt.</div>

      : `<div class="empty">Belöningarna kommer snart.</div>`}

async function redeemMine(id){
  const w = (rwCat.rewards||[]).find(x=>x.id===id); if(!w || !confirm(`Lösa in ${w.title} för ${fmtP(w.cost)} poäng?`)) return;
  try{ await rw('redeem_reward', {p_reward:id}); loadMyRewards(true); toast('Inlöst — vi hör av oss när den kan hämtas'); }catch(e){ toast(e.message); }
}
const PKIND = {earn:'Pass', reversal:'Tillbakadraget', redeem:'Inlöst', refund:'Tillbaka', adjust:'Justering'};
function pointsRows(h){
  return (h||[]).map(p=>`<div class="kv"><span>${esc(new Date(p.at).toLocaleDateString('sv-SE',{day:'numeric',month:'short'}))} · ${PKIND[p.kind]||p.kind}</span>

}
function openPointsHistory(){ openSheet(`${X}<h2>Poänghistorik</h2><div style="margin-top:12px">${pointsRows((rwMine||{}).history)}</div>`); }

/* ---------- artistprofilen (crewet) ---------- */
let apId = null, apTab = 'profile', apData = {};
function artistTabs(){
  return canIntel() ? [['profile','Profil'],['bookings','Bokningar'],['rewards','Rewards'],['level','Nivå'],['notes','Anteckningar'],['intel','Intelligence']]
                    : [['profile','Profil'],['bookings','Bokningar'],['notes','Anteckningar']];
}
async function openArtistProfile(id, tab){
  apId = id; apTab = tab || 'profile'; apData = {};
  paintArtist();
  try{
    const jobs = [rw('artist_notes_for', {p_member:id}).then(x=>apData.notes = x), loadPnr()];
    if(canIntel()) jobs.push(rw('points_summary', {p_member:id}).then(x=>apData.sum = x), rw('artist_intel', {}).then(x=>apData.intel = (x||[]).find(r=>r.id===id)||null),
      rw('rewards_catalog', {}).then(x=>apData.cat = x));
    await Promise.all(jobs);
  }catch(e){ apData.err = e.message; }
  if(apId===id) paintArtist();
}
function paintArtist(){
  const a = byId(apId); if(!a) return;
  const tabs = artistTabs(), t = apTab, d = apData, today = new Date();
  const bs = live().filter(b=>!b.circleId && b.who===a.n && !['declined'].includes(b.status)).sort((x,y)=>startAt(y)-startAt(x));
  const body = t==='profile' ? profilePanel(a, bs)
    : t==='bookings' ? (bs.length ? bs.map(b=>`<div class="srow ${b.status==='request'?'req':''}">
        <div class="srow-d"><b>${fromIso(b.date).getDate()}</b><span>${MON[fromIso(b.date).getMonth()]}</span></div>
        <div class="grow" style="min-width:0"><div class="srow-t">${b.start}–${b.end}${b.studio?' · '+esc(S.studios[b.studio]):''}</div>
          <div class="srow-m">${b.status==='request' ? 'förfrågan' : b.closed ? (b.paid ? `avslutat och betalt · ${fmtP(pointsFor(dur(b)))} poäng` : 'avslutat, ej betalt') : startAt(b) < today ? 'inte avslutat' : 'kommande'}</div></div>
        ${!b.status && startAt(b) < today && mayClose(b) ? `<button class="btn slim ${b.closed?'ghost':''}" style="width:auto;flex:none;padding:8px 12px" onclick="openClose('${b.id}')">${b.closed?'ÄNDRA':'AVSLUTA'}</button>` : ''}</div>`).join('')
      : '<div class="empty">Inga bokningar än.</div>')
    : t==='rewards' ? (d.sum ? `<div class="card"><div class="rwpts">${fmtP(d.sum.available)}</div><div class="tiny muted">tillgängliga · ${fmtP(d.sum.earned)} intjänade · ${fmtP(d.sum.spent)} förbrukade</div></div>
        ${can('manageCrew') ? `<div class="row" style="gap:8px;margin-top:10px"><button class="btn ghost slim" style="flex:1" onclick="openRedeemFor()">LÖS IN ÅT KUNDEN</button>
          <button class="btn ghost slim" style="flex:1" onclick="openAdjust()">JUSTERA SALDO</button></div>` : ''}
        ${(d.sum.redemptions||[]).length ? `<div class="eyebrow">INLÖSTA<span class="ln"></span></div>${d.sum.redemptions.map(r=>`<div class="kv"><span>${esc(new Date(r.at).toLocaleDateString('sv-SE'))}</span><b>${esc(r.title)} · ${fmtP(r.cost)} · ${{waiting:'väntar',delivered:'utlämnad',cancelled:'makulerad'}[r.status]}</b></div>`).join('')}` : ''}
        <div class="eyebrow">HISTORIK<span class="ln"></span></div>${pointsRows(d.sum.history)}` : '<div class="skel" style="height:120px"></div>')
    : t==='level' ? (d.sum ? `<div class="card"><div class="studio-name">NIVÅ</div><div class="live-title" style="font-size:22px;margin-top:6px">${esc(d.sum.level ? d.sum.level.name : '—')}</div>
        ${d.sum.level && d.sum.level.perks ? `<div class="tiny muted" style="margin-top:6px">${esc(d.sum.level.perks)}</div>` : ''}
        <div class="kv" style="margin-top:12px"><span>INTJÄNADE POÄNG</span><b>${fmtP(d.sum.stats.earned)}</b></div>
        <div class="kv"><span>BETALDA PASS, 12 MÅN</span><b>${d.sum.stats.sessions12}</b></div>
        <div class="kv" style="border:0"><span>TIMMAR, 12 MÅN</span><b>${fmtH(+d.sum.stats.hours12)}</b></div></div>
        ${d.sum.next ? `<div class="note">Nästa nivå: <b>${esc(d.sum.next.name)}</b> — ${critText(d.sum.next.criteria)}.</div>` : ''}` : '<div class="skel" style="height:120px"></div>')
    : t==='notes' ? `${bs.some(b=>!b.status && startAt(b) < today && mayClose(b)) ? `<button class="btn ghost" onclick="openNoteFor()">+ OMDÖME</button>` : ''}
        ${d.notes ? (d.notes.length ? d.notes.map(n=>`<div class="card notecard">
          <div class="tiny muted">${n.date ? esc(longDate(n.date))+' '+n.start+'–'+n.end+' · ' : ''}${esc(n.author||'')} · ${esc(new Date(n.at).toLocaleDateString('sv-SE'))}</div>
          ${NOTE_FIELDS.filter(([k])=>n[k]).map(([k,l])=>`<div class="lsub">${l}</div><p>${esc(n[k])}</p>`).join('')}</div>`).join('')
          : '<div class="empty">Inga omdömen än.</div>') : '<div class="skel" style="height:120px"></div>'}`
    : (d.intel ? intelPanel(d.intel) : d.intel===null ? '<div class="empty">Ingen data.</div>' : '<div class="skel" style="height:120px"></div>');
  openSheet(`${X}<h2>${esc(a.n)}</h2><div class="sub">Kund${isPart(a)?' och cirkeldeltagare':''}${a.producer && byId(a.producer) ? ' · producent ' + esc(byId(a.producer).n) : ''}</div>
    <div class="seg ${tabs.length>4?'many':''}" role="tablist" style="margin:14px 0">${tabs.map(([k,n])=>`<button role="tab" aria-selected="${t===k}" class="${t===k?'on':''}" onclick="apTab='${k}';paintArtist()">${n}</button>`).join('')}</div>
    ${d.err ? `<div class="warn">${esc(d.err)}</div>` : ''}${body}`);
}
function critText(c){
  c = c||{}; const p = [];
  if(+c.minEarned) p.push(`${fmtP(c.minEarned)} intjänade poäng`);
  if(+c.minSessions12) p.push(`${c.minSessions12} betalda pass senaste året`);
  if(+c.minHours12) p.push(`${fmtH(+c.minHours12)} timmar senaste året`);
  return p.join(', ') || 'inga krav';
}
const STAT_SV = {'ny':'Ny', 'aktiv':'Aktiv', 'återkommande':'Återkommande', 'inaktiv':'Inaktiv'};
function intelPanel(x){
  const mx = Math.max(1, ...x.months), cr = x.crm || {};
  return `<div class="card">
      <div class="row" style="justify-content:space-between"><span class="pill rwlevel">${esc(STAT_SV[x.status]||x.status)}</span><span class="tiny muted">${x.level?esc(x.level)+' · ':''}${fmtP(x.available)} poäng</span></div>
      <div class="kv" style="margin-top:10px"><span>BOKNINGAR</span><b>${x.bookings} · ${fmtH(+x.hours)} h</b></div>
      <div class="kv"><span>SENASTE / NÄSTA</span><b>${x.last?esc(longDate(x.last)):'—'} / ${x.next?esc(longDate(x.next)):'—'}</b></div>
      <div class="kv"><span>PRODUCENTER</span><b>${(x.producers||[]).map(esc).join(', ')||'—'}</b></div>

/* ===================== BANDO HQ ACCESS =====================
   Registreringen (access.html, bakom QR-koden i studion) gör personen till kund OCH
   cirkeldeltagare. Inriktningar, förmåner och tjänstepriser ligger i setting/access — admin

   bs_access_default i databasen). Personnumret finns bara på servern, krypterat. Appen ser
   det maskerat och bara för admin; i förhandsläget sparas bara det maskerade. */
const ACFG = {
  interests:[['songwriting','Låtskrivning & textförfattande','Musikproduktion'], ['rap','Rap, flow & delivery','Artistutveckling'],
    ['vocals','Sång & vokalteknik','Artistutveckling'], ['production','Musikproduktion & beatmaking','Musikproduktion'],

    ['content','Content & sociala medier','Marknadsföring'], ['film','Foto, film & musikvideo','Foto och film'],
    ['marketing','Marknadsföring & release','Marknadsföring'], ['industry','A&R, management & musikbranschen','Management']]
    .map(([id, label, subject])=>({id, label, subject})),
  perks:[['Studiobokningar','Boka sessions smidigt och till förmånliga priser.'],
    ['Rabatter på tjänster','Ta del av bättre priser på mix & master, foto, musikvideo, content och marknadsföring.'],
    ['Kreativa samarbeten','Få tillgång till erbjudanden från producenter, filmare och andra kreatörer inom Bandos nätverk.'],
    ['Strategi & artistutveckling','Få vägledning kring din musik, dina projekt och kommande releaser.'],
    ['A&R-feedback','Möjlighet att skicka in musik för professionell feedback, även från A&R-kontakter på stora skivbolag.'],
    ['Merch & egna projekt','Få hjälp med att utveckla och producera egna kläder, merchandise och kreativa produkter.']]
    .map(([title, text])=>({title, text})),
  services:[['mix','Mix & master','per låt',1500], ['photo','Foto',''], ['video','Musikvideo',''], ['content','Content',''], ['marketing','Marknadsföring','']]
    .map(([id, name, unit, price])=>({id, name, price:price||null, access:null, unit})),
  /* studiopaketen — Bandos prislista (2026-10): 1 session = 3 timmar */
  packages:[1500,2200,2900,3800,4500,5200,5800,6500].map((price, i)=>({sessions:i+1, hours:(i+1)*3, price})),
  notes:['1 session är 3 timmar.', '2 st mix & mastering ingår vid paketköp över 8 sessions (ordinarie pris 1 500 kr/låt).']};
const acfg = () => { const c = S.accessCfg || {}, pick = k => Array.isArray(c[k]) && (['services','packages','notes'].includes(k) || c[k].length) ? c[k] : ACFG[k];
  return {interests:pick('interests'), perks:pick('perks'), services:pick('services'), packages:pick('packages'), notes:pick('notes')}; };
/* prislistan: "1 SESSION (3 H) … 1 500 KR", som Bandos prislista */
const pkgs = () => acfg().packages.filter(p=>+p.sessions > 0 && hasNum(p.price)).sort((a,b)=>a.sessions-b.sessions);

  const pk = pkgs(), notes = acfg().notes.filter(n=>String(n||'').trim());

    ${notes.map(n=>`<div class="plnote">${esc(n)}</div>`).join('')}`;

/* Personnummer: samma kontroll som på registreringssidan och i databasen (bs_pnr). */
function pnr12(p){
  const raw = String(p||'').replace(/\s/g, '');
  if(!/^(\d{6}|\d{8})[-+]?\d{4}$/.test(raw)) return null;
  let d = raw.replace(/[-+]/g, ''); const now = new Date();
  if(d.length===10) d = ((+d.slice(0,2) > now.getFullYear() % 100 ? 19 : 20) - (raw.includes('+') ? 1 : 0)) + d;
  const y = +d.slice(0,4), m = +d.slice(4,6); let dd = +d.slice(6,8); if(dd > 60) dd -= 60;
  const dt = new Date(y, m-1, dd);
  if(m<1 || m>12 || dd<1 || dt.getMonth()!==m-1 || dt.getDate()!==dd || dt > now || y < now.getFullYear()-120) return null;
  let s = 0; [...d.slice(2)].forEach((c,i)=>{ const x = +c * (i%2===0 ? 2 : 1); s += Math.floor(x/10) + x%10; });
  return s % 10 === 0 ? d : null;
}
const pnrMask = p => { const d = pnr12(p); return d ? d.slice(2,8) + '-••••' : ''; };
let PNR = {}, pnrAt = 0;
function loadPnr(force){
  if(PREVIEW_LOGIN || !can('manageCrew') || (!force && Date.now() - pnrAt < 120000)) return Promise.resolve(PNR);
  pnrAt = Date.now();
  return sbRpc('pnr_masks', {}).then(x=>{ PNR = x || {}; return PNR; }).catch(()=>PNR);
}
const pnrOf = a => !a ? '' : PREVIEW_LOGIN ? a.pnr || '' : PNR[a.id] || '';

  const g = {pnr:!pnr, interests:!(a.interests||[]).length, consent:!a.consent, phone:!normPhone(a.phone)};

}

async function saveProfile(){
  const a = me(), g = profileGaps(a) || {}, v = id => ((document.getElementById(id)||{}).value || '').trim();
  const ints = [...(pickInt.pf||[])], needPnr = g.pnr || g.consent, phone = g.phone ? v('pfP') : '';
  const msg = t => { document.getElementById('pfMsg').innerHTML = `<div class="warn" role="alert">${esc(t)}</div>`; };
  if(g.phone && !normPhone(phone)) return msg('Fyll i ett giltigt mobilnummer');
  if(needPnr && !pnr12(v('pfN'))) return msg('Personnumret stämmer inte — skriv ÅÅÅÅMMDD-XXXX');
  if(!ints.length) return msg('Välj minst en inriktning');
  if(needPnr && !(document.getElementById('pfC')||{}).checked) return msg('Godkänn hur vi hanterar dina uppgifter');
  try{
    if(PREVIEW_LOGIN){
      Object.assign(a, {interests:ints, phone:phone || a.phone, consent:true, part:true, reg:a.reg || new Date().toISOString(),
        source:a.source || 'app'}, needPnr ? {pnr:pnrMask(v('pfN'))} : {});
      bump(a); save();
    } else {
      if(needPnr) await sbRpc('register_access', {p_name:a.n, p_phone:phone, p_pnr:v('pfN'), p_interests:ints, p_consent:true, p_url:appUrl()});
      else await sbRpc('set_my_interests', {p_interests:ints});
      if(remoteRole()) await cloudView(); else await cloudPull();
    }
    closeSheet(); render(); toast('Profilen är klar');
  }catch(e){ msg(e.message); }
}

async function saveInterests(id){

function saveAccessCfg(){
  if(!can('manageCrew')) return;
  const d = JSON.parse(JSON.stringify(accDraft || acfg())), msg = t => { document.getElementById('accMsg').innerHTML = `<div class="warn" role="alert">${esc(t)}</div>`; };
  d.interests = d.interests.filter(x=>String(x.label||'').trim()).map(x=>Object.assign(x, {label:x.label.trim(), subject:String(x.subject||'').trim()}));
  d.perks = d.perks.filter(x=>String(x.title||'').trim() || String(x.text||'').trim()).map(x=>({title:String(x.title||'').trim(), text:String(x.text||'').trim()}));
  d.services = d.services.filter(x=>String(x.name||'').trim()).map(x=>Object.assign(x, {name:x.name.trim(), unit:String(x.unit||'').trim(),
    price:hasNum(x.price) ? +x.price : null, access:hasNum(x.access) ? +x.access : null}));
  if(!d.interests.some(x=>!x.off)) return msg('Minst en inriktning måste visas');
  if(new Set(d.interests.map(x=>x.id)).size !== d.interests.length) return msg('Två inriktningar har samma id');
  if(d.perks.some(x=>!x.title || !x.text)) return msg('Varje förmån behöver rubrik och text');
  if(!d.perks.length) return msg('Minst en förmån');
  if(d.services.some(x=>(x.price!=null && x.price<0) || (x.access!=null && x.access<0))) return msg('Priserna kan inte vara negativa');
  d.packages = (d.packages||[]).filter(x=>hasNum(x.sessions) || hasNum(x.price)).map(x=>({sessions:+x.sessions, hours:+x.hours, price:hasNum(x.price) ? +x.price : null}));
  if(d.packages.some(x=>!(x.sessions >= 1) || x.sessions % 1 || !(x.hours > 0) || x.price == null || x.price < 0)) return msg('Varje paket behöver antal sessions, timmar och pris');
  if(new Set(d.packages.map(x=>x.sessions)).size !== d.packages.length) return msg('Två paket har samma antal sessions');
  d.packages.sort((a,b)=>a.sessions-b.sessions);
  d.notes = (d.notes||[]).map(x=>String(x).trim()).filter(Boolean);
  S.accessCfg = Object.assign(d, {up:Date.now()}); accDraft = null;
  save(); sync(true); render(); toast('Sparat — gäller direkt på registreringssidan och i kundvyn');
}

function takeAccessPreview(){
  let p = null; try{ p = JSON.parse(localStorage.getItem('bandohq_access_preview')||'null'); }catch(_){}
  localStorage.removeItem('bandohq_access_preview');
  if(!p || !p.name) return;
  const em = String(p.email||'').toLowerCase();
  /* inbjudan (krävs för nya konton): förbrukas; gällde den en person som redan finns kopplas kontot dit */
  const inv = p.invite && (S.invites||[]).find(i=>String(i.token).toUpperCase()===String(p.invite).toUpperCase() && i.role==='customer');
  if(!inv) return;
  inv.uses = (inv.uses||0) + 1;
  let a = (inv.member_id && byId(inv.member_id)) || (em && accounts().find(x=>(x.email||'').toLowerCase()===em && ['customer','participant'].includes(x.r)));
  if(!a){
    let n = p.name, i = 1; while(accounts().some(x=>x.n.toLowerCase()===n.toLowerCase())) n = p.name + ' ' + (++i);
    a = {id:'m_' + uid(), n, r:'customer', email:em, phone:'', c:'#6633b8', g:'#9d5cf5', active:true, del:false};
    S.accounts.push(a);
  }
  Object.assign(a, {r:'customer', part:true, interests:p.interests||[], pnr:p.pnr||'', consent:true, phone:p.phone || a.phone || '',
    reg:a.reg || new Date(p.at || Date.now()).toISOString(), source:a.source || 'access', login:true});
  /* en producent som bjöd in blir artistens producent */
  const by = byId(inv.created_by);
  if(isProducer(by) && !(a.producers||[]).length){ a.producers = [by.id]; a.producer = a.producer || by.id; }
  bump(a);
  S.session = {email:a.email||'', name:a.n, picture:'', member:a.n, ts:Date.now(), via:'preview'};
  save();
}

/* ===================== v5: ARBETSYTAN ===================== */
const lartists  = () => S.artists.filter(a => !a.del && a.active !== false);
const lreleases = () => S.releases.filter(r => !r.del);
const lbeats    = () => S.beats.filter(b => !b.del);
const lmedia    = () => (S.media||[]).filter(x => !x.del);
const lagenda   = () => S.agenda.filter(a => !a.del);
const lgoals    = () => S.goals.filter(g => !g.del);
const artistById = id => S.artists.find(a => a.id === id) || null;
/* Artister rankas #1, #2, #3… Ranken är ett tal på posten; de som saknar ett
   (äldre data med Hög/Mellan/Låg) hamnar efter, i sin gamla prioritetsordning.
   Första flytten numrerar om hela listan, så ordningen blir sedan entydig. */
/* Prio 1 = högst, 3 = inte prio. Inom graden styr rank ordningen (dras om). */
const PRIO_NAME = {1:'Prio 1', 2:'Prio 2', 3:'Prio 3'};
const PRIO_SUB  = {1:'Det vi satsar på nu', 2:'Pågående', 3:'Inte prio just nu'};
const prioOf = a => [1,2,3].includes(+a.priority) ? +a.priority : 3;
const rankKey = a => a.rank != null ? +a.rank : 1e9;
const artistsRanked = () => lartists().slice().sort((a,b)=>prioOf(a)-prioOf(b) || rankKey(a)-rankKey(b) || a.n.localeCompare(b.n,'sv'));
/* placering inom sin grad: 1, 2, 3 … */
const rankOf = id => { const a = artistById(id); if(!a) return 0;
  return artistsRanked().filter(x=>prioOf(x)===prioOf(a)).findIndex(x=>x.id===id) + 1; };
function bump(o){ o.up = Date.now(); return o; }

/* "1 aktivt mål", "2 aktiva mål" — mål är ett ett-ord, så singularen slutar på -t. */
const nt = (n, sing, plur) => n + ' ' + (n===1 ? sing : plur);

/* Alla producenter som var med på ett pass: den som bokade + de i with. */
const crewOn = b => [b.who].concat(b.with||[]).filter(Boolean);
/* Alla pass en person var med på, oavsett om hen bokade eller var med. */
const sessionsWith = n => booked().filter(b => crewOn(b).includes(n));

/* Måndagen i en vecka som ISO-datum — nyckeln för veckans agenda. */
const weekKey = d => iso(monday(d || new Date()));

/* ===================== IDENTITET & ROLLER ===================== */
const ROLES = ['manager','admin','producer','camera','leader','participant','customer'];
const ROLE_NAME = {manager:'Manager', admin:'Admin', producer:'Producent', camera:'Kamerateam',
  leader:'Cirkelledare', participant:'Deltagare', customer:'Kund'};
/* Crewet: de som bokar studion och sköter arbetet. Admin räknas dit (Costa,
   Nabbe) — men allas mål och individuell statistik är managerns (Rasmus). */
const isCrewRole = r => r==='producer' || r==='manager' || r==='admin';
const isAdminRole = r => r==='manager' || r==='admin';
/* Teamet = crewet + kamerateamet. De får den riktiga appen (med olika flikar). */
const isTeamRole = r => isCrewRole(r) || r==='camera';

const accounts = () => S.accounts.filter(a => !a.del);
const activeAcc = () => accounts().filter(a => a.active !== false);
/* "Crewet" är numera ett filter på rollen, inte en egen lista. */
const crew      = () => activeAcc().filter(a => isCrewRole(a.r));
/* Producent är en egenskap: rollen producent, eller admin/manager med behörigheten 'producer'
   (t.ex. RKAY). Bara de kan bokas av artister. Samma regel som bs_is_producer i databasen. */
const isProducer = a => !!a && a.active!==false && !a.del && (a.r==='producer' || (['manager','admin'].includes(a.r) && (a.perms||[]).includes('producer')));
const producers = () => activeAcc().filter(isProducer);
const lpeople   = () => activeAcc().filter(isPart);     /* deltagare + kunder (Access: alla kunder är cirkeldeltagare) */
const customers = () => activeAcc().filter(a => a.r === 'customer');
const cameras   = () => activeAcc().filter(a => a.r === 'camera');
const teamAcc   = () => activeAcc().filter(a => isTeamRole(a.r));
/* "D2L" för båda i D2L, annars personens namn — så krediteras galleriet. */
const creditOf  = a => (a && (a.team || a.n)) || '';
/* Alla som kan tilldelas en cirkel: crewet plus de som bara är ledare. */
const leaderPool = () => activeAcc().filter(a => isCrewRole(a.r) || a.r === 'leader');

function me(){ return S.session ? byName(S.session.member) : null; }
function byName(n){ return accounts().find(m=>m.n===n) || null; }
function byId(id){ return accounts().find(m=>m.id===id) || null; }
function isManager(){ const m=me(); return !!m && m.r==='manager'; }
/* Leder kontot någon cirkel? Avgör vilken vy en 'leader' får. */
function leadsAny(n){ return lcircle().some(c=>c.leader===n); }
const col  = n => (byName(n)||{c:'#665e80'}).c;
const glow = n => (byName(n)||{g:'#665e80'}).g;

/* Enda stället som avgör vad appen visar för vem. Med servern inkopplad är
   det databasen som håller gränsen (db/02-rls.sql) — det här är bara vad som
   ritas. I förhandsvisningen finns ingen gräns utöver den här. */
function can(action, t){
  const m = me(); if(!m) return false;
  const crewRole = isCrewRole(m.r), mgr = m.r==='manager', adm = isAdminRole(m.r), team = isTeamRole(m.r);
  switch(action){
    /* --- crewets sida --- */
    case 'book':        return crewRole || m.r==='customer';
    case 'editBooking':
    case 'delBooking':  return adm || (t && t.who===m.n && crewRole)
                            || (t && t.reqBy===m.id && t.status==='request')
                            /* kunden avbokar sin egen tid, men ändrar den inte */
                            || (action==='delBooking' && t && t.who===m.n && m.r==='customer');
    case 'upload':
    case 'viewFile':    if(!crewRole) return false;
                        return mgr || (t && t.who===m.n);
    case 'viewStats':   return mgr || (t && t===m.n);
    case 'dashboard':   return mgr;              /* individuell statistik: bara managern */
    case 'manageCrew':
    case 'manageStudios':
    case 'manageDropbox':
    case 'setRates':    return adm;
    /* kunder och cirkeldeltagare: hela crewet, inte kamerateamet (members_crew_clients) */
    case 'addClients':  return crewRole;
    case 'grantManager': return mgr;             /* bara managern rör managerrollen */
    /* --- cirkelsidan --- */
    case 'manageCircles':
    case 'managePeople':
    case 'manageCurricula': return adm;
    case 'leadCircle':      return adm || (t && t.leader===m.n);
    /* --- de enkla rollerna --- */
    case 'requestSession':  return m.r==='participant' && !!t && (t.members||[]).includes(m.id);
    case 'answerRequest':   return adm || (t && t.leader===m.n);
    /* kundförfrågan: admins och kundens egen producent. t är bokningen. */
    /* kundförfrågan: admins och de producenter artisten valt — eller, om hen inte valt någon,
       artistens producenter. t är bokningen. */
    case 'answerCustomer':  { const c = t && byId(t.reqBy), w = (t && t.with) || [];
                              return adm || (w.length ? w.includes(m.n) : (!!c && (c.producer===m.id || (c.producers||[]).includes(m.id)))); }
    case 'answerLeads':     return adm;
    /* förfrågningar om Access och direktinbjudan: admin och producenter */
    case 'answerAccess':    return crewRole;
    case 'uploadMedia':     return team;
    case 'editMedia':       return crewRole || (!!t && t.by===m.id);
    /* --- v5: arbetsytan --- */
    /* Målsättningen (mål, ambitioner, utvecklingsområden och planen) är personlig: ägaren och
       managern, ingen annan. t är ägarens konto-id. */
    case 'viewGoals':
    case 'editGoals':       return mgr || (!!t && t===m.id);
    case 'manageArtists':   return adm;
    case 'logRelease':      return crewRole;

    case 'parseAgenda':     return crewRole;

    case 'editAgenda':      return adm || (!!t && (t.who===m.n || (!t.who && team)));

    case 'addGeneral':      return team;

const DAY = ['SÖN','MÅN','TIS','ONS','TOR','FRE','LÖR'];
const DAY2 = ['sön','mån','tis','ons','tor','fre','lör'];
const MON = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fromIso(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function monday(d){ const x=new Date(d); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); x.setHours(0,0,0,0); return x; }
function weekNo(d){ const t=new Date(d); t.setHours(0,0,0,0); t.setDate(t.getDate()+3-((t.getDay()+6)%7));
  const f=new Date(t.getFullYear(),0,4); return 1+Math.round(((t-f)/864e5-3+((f.getDay()+6)%7))/7); }
function startAt(b){ return new Date(b.date+'T'+b.start+':00'); }
/* slut <= start betyder nattpass: lägg på ett dygn så krockar mot nästa dag hittas */
function endAt(b){ let e=new Date(b.date+'T'+b.end+':00'); if(e<=startAt(b)) e=new Date(+e+864e5); return e; }
function dur(b){ return (endAt(b)-startAt(b))/36e5; }
function longDate(s){ const d=fromIso(s); return DAY[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; }
function relDay(s){
  const t=iso(new Date());
  if(s===t) return 'IDAG';
  if(s===iso(addDays(new Date(),1))) return 'IMORGON';
  if(s===iso(addDays(new Date(),-1))) return 'IGÅR';
  return null;
}
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hh  = h => (Math.round(h*10)/10) % 1 ? (Math.round(h*10)/10).toFixed(1) : String(Math.round(h));
const kb  = n => n<1024 ? n+' B' : n<1048576 ? (n/1024).toFixed(0)+' kB'
              : n<1073741824 ? (n/1048576).toFixed(1)+' MB' : (n/1073741824).toFixed(2)+' GB';

/* ===================== KROCKAR ===================== */
function clash(b, ignoreId){
  const s=startAt(b), e=endAt(b);
  return booked().filter(x => x.id!==ignoreId && x.studio===b.studio && startAt(x)<e && endAt(x)>s);
}
function freeAt(studio, date, start, end, ignoreId){
  return clash({studio,date,start,end}, ignoreId).length===0;
}
function nowIn(studio){
  const t=new Date();
  return booked().find(b => b.studio===studio && startAt(b)<=t && endAt(b)>t);
}
function nextIn(studio){
  const t=new Date();
  return booked().filter(b=>b.studio===studio && startAt(b)>t).sort((a,b)=>startAt(a)-startAt(b))[0];
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

async function gateRun(fn){
  if(gateBusy) return;
  gateBusy = true; gateErr = ''; renderGate();
  try{ await fn(); }
  catch(e){ gateErr = e.message || String(e); }
  gateBusy = false;
  if(!S.session || document.getElementById('gate').classList.contains('on')) renderGate();
}
function doLogin(){

  gateEmail = em;
  return gateRun(async ()=>{
    try{ await cloudLogin(em, pw); }
    catch(e){
      /* Inloggad hos Supabase men inbjudan gick inte att lösa in (t.ex. namnet
         var upptaget) — be om ett annat namn i stället för att låsa ute. */
      if(AUTH && !S.session && pendingInvite()){ gateMode = 'finish'; throw e; }
      if(!S.session) saveAuth(null);

      if(/Bekräfta din e-post/.test(e.message) && em.includes('@')){

    <button class="linkbtn" onclick="leaveJoin()">Har du redan ett konto? Logga in</button>`;

const USERNAME_RE = /^[a-z0-9._-]{2,24}$/, EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
/* "Sofia Marks" → sofia.marks, "RKAY" → rkay */
const suggestUsername = n => String(n||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/[^a-z0-9._-]+/g,'.').replace(/^[._-]+|[._-]+$/g,'').slice(0,24);
async function usernameFree(u){
  if(PREVIEW_LOGIN) return !S.accounts.some(a=>(a.username||'')===u);
  const r = await fetch(CLOUD.url + '/rest/v1/rpc/username_free', {method:'POST',
    headers:{apikey:CLOUD.key, 'Content-Type':'application/json'}, body:JSON.stringify({p_username:u})});
  if(!r.ok) throw new Error(await sbErr(r));

}
let userChk = 0;
async function checkUser(v){
  const el = document.getElementById('jUok'); if(!el) return;
  const u = String(v||'').trim().toLowerCase(), my = ++userChk;
  if(!u){ el.className = 'hint'; el.textContent = ''; return; }
  if(!USERNAME_RE.test(u)){ el.className = 'hint bad'; el.textContent = '2–24 tecken: a–z, 0–9, punkt, bindestreck eller understreck'; return; }
  let free = null; try{ free = await usernameFree(u); }catch(e){}

/* =====================================================================
   SUPABASE — konton, inloggning, inbjudningar och synk
   Behörigheterna ligger i databasen (db/02-rls.sql, db/03-funktioner.sql).
   Crewet läser och skriver posterna direkt; ledare, deltagare och kunder
   går via funktioner som bara lämnar ut det deras roll får.
   Utan CLOUD-uppgifter körs förhandsvisningen: allt bara på den här enheten.
   ===================================================================== */
let AUTH = (()=>{ try{ return JSON.parse(localStorage.getItem('bandosesh_auth')||'null'); }catch(e){ return null; } })();
function saveAuth(a){ AUTH = a; try{ a ? localStorage.setItem('bandosesh_auth', JSON.stringify(a)) : localStorage.removeItem('bandosesh_auth'); }catch(e){} }
const jwtSub = t => { try{ return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub; }catch(e){ return ''; } };
const cloudOn = () => !PREVIEW_LOGIN && !!AUTH && !!S.session;

const AUTH_SV = [
  [/invalid login credentials/i, 'Fel användarnamn, e-post eller lösenord'],
  [/token has expired or is invalid|otp_expired/i, 'Koden stämmer inte eller har gått ut — be om en ny'],
  [/for security purposes|only request this after/i, 'Vänta en minut innan du ber om en ny kod'],
  [/already registered|already been registered/i, 'Det finns redan ett konto med den e-posten — logga in i stället'],
  [/at least (\d+) characters/i, 'Lösenordet måste vara minst 6 tecken'],
  [/email not confirmed/i, 'Bekräfta din e-post först — skriv in koden från mejlet'],
  [/rate limit|too many/i, 'För många försök — vänta en stund'],
  [/invalid email|unable to validate email/i, 'E-postadressen ser fel ut']];
async function sbErr(r){
  let m = 'Servern svarade ' + r.status;
  try{ const j = await r.json(); m = j.msg || j.message || j.error_description || j.error || m; }catch(e){}
  const hit = AUTH_SV.find(([re])=>re.test(m));
  return hit ? hit[1] : m;
}
async function sbAuth(path, body, method, token){
  const r = await fetch(CLOUD.url + '/auth/v1' + path, {method: method||'POST',
    headers:{apikey:CLOUD.key, 'Content-Type':'application/json',
      ...(token ? {Authorization:'Bearer '+token} : {})},
    body: method==='GET' ? null : JSON.stringify(body||{})});
  if(!r.ok) throw new Error(await sbErr(r));
  const t = await r.text(); return t ? JSON.parse(t) : {};
}
function takeSession(j){
  if(!j || !j.access_token) return null;
  saveAuth({access_token:j.access_token, refresh_token:j.refresh_token,
    expires_at: Date.now() + (j.expires_in||3600)*1000, uid: jwtSub(j.access_token),
    email: (j.user && j.user.email) || '', meta: (j.user && j.user.user_metadata) || {}});
  return AUTH;
}
async function sbToken(){
  if(!AUTH) return CLOUD.key;
  if(AUTH.expires_at - Date.now() > 60000) return AUTH.access_token;
  try{ takeSession(await sbAuth('/token?grant_type=refresh_token', {refresh_token:AUTH.refresh_token})); }
  catch(e){ saveAuth(null); throw new Error('Inloggningen har gått ut — logga in igen'); }
  return AUTH.access_token;
}
async function sb(path, opts){
  const o = Object.assign({}, opts||{});
  /* Bearer bara med en riktig inloggning. Supabases nya publika nycklar (sb_publishable_…)
     är inga JWT och får bara skickas som apikey — utan inloggning räcker den. */
  const tok = AUTH ? await sbToken() : '';
  o.headers = Object.assign({apikey:CLOUD.key}, tok && tok !== CLOUD.key ? {Authorization:'Bearer ' + tok} : {}, {
    'Content-Type':'application/json'}, o.headers||{});
  const r = await fetch(CLOUD.url + '/rest/v1' + path, o);
  if(!r.ok) throw new Error(await sbErr(r));
  const t = r.status===204 ? '' : await r.text();
  return t ? JSON.parse(t) : null;
}
const sbRpc = (fn, args) => sb('/rpc/' + fn, {method:'POST', body: JSON.stringify(args||{})});
/* Edge-funktion utan inloggning (inloggning med användarnamn) */
async function sbFn(name, body){
  const r = await fetch(CLOUD.url + '/functions/v1/' + name, {method:'POST',
    headers:{apikey:CLOUD.key, 'Content-Type':'application/json'}, body: JSON.stringify(body||{})});
  if(!r.ok) throw new Error(await sbErr(r));
  return r.json();
}

/* Kontot i databasen → kontot i appen. Crewets färger följer med; nya får en ur paletten. */
const PALETTE = [['#7c3aed','#a855f7'],['#0284c7','#38bdf8'],['#d97706','#fbbf24'],['#db2777','#f472b6'],['#047857','#34d399']];
function memberToAcc(m){
  const def = DEFAULT_CREW.find(c=>c.id===m.id);
  const pal = PALETTE[[...String(m.id)].reduce((a,c)=>a+c.charCodeAt(0),0) % PALETTE.length];
  const crewish = isTeamRole(m.role);
  return {id:m.id, n:m.name, r:m.role, email:m.email||'', phone:m.phone||'',
    team:m.team||'', ig:m.ig||'', producer:m.producer||'',
    login: !!m.user_id, username: m.username||'',          /* har personen loggat in? (inbjudningarna) */
    perms: Array.isArray(m.perms) ? m.perms : [],           /* t.ex. artist_intel (Rewards, omdömen, CRM) */
    /* Access: kunden är också cirkeldeltagare, med inriktningar; registreringen sätts bara av servern */
    part: m.participant!==false, interests: Array.isArray(m.interests) ? m.interests : [],
    /* artistens producenter (admin väljer); producer är den första */
    producers: Array.isArray(m.producers) && m.producers.length ? m.producers : (m.producer ? [m.producer] : []),
    reg: m.registered_at||'', consent: !!m.consent_at, source: m.source||'',
    c: m.color || (def&&def.c) || (crewish ? pal[0] : '#6633b8'),
    g: m.glow  || (def&&def.g) || (crewish ? pal[1] : '#9d5cf5'),
    active: m.active!==false, del:false, up:+m.up||0};
}
function upsertAcc(a){
  const ex = S.accounts.find(x=>x.id===a.id);
  if(!ex) S.accounts.push(a); else if((a.up||0) >= (ex.up||0)) Object.assign(ex, a);
}

/* Tom start i molnläget. Mallens standardcrew får INTE följa med — kontona
   kommer från servern, och managerns synk skulle annars skicka upp dem. */
function cloudBlank(){ const s = blank(); s.accounts = []; return s; }
/* En inbjudan som ännu inte lösts in. Ligger i localStorage på enheten där
   kontot skapades, och i kontots metadata om e-posten bekräftas någon annanstans. */
function pendingInvite(){
  try{ const l = JSON.parse(localStorage.getItem('bandosesh_invite')||'null'); if(l && l.token) return l; }catch(e){}
  const m = (AUTH && AUTH.meta) || {};
  return m.invite ? {token:m.invite, name:m.name||'', username:m.username||''} : null;
}
/* Inloggad hos Supabase → hitta (eller skapa via väntande inbjudan) sitt konto. */
async function cloudEnter(){
  let rows = await sb('/members?select=*&user_id=eq.' + AUTH.uid);
  const pend = pendingInvite();
  if(!rows.length && pend){
    await sbRpc('redeem_invite', {p_token:pend.token, p_name:pend.name||null, p_username:pend.username||''});
    localStorage.removeItem('bandosesh_invite');
    if(AUTH.meta) AUTH.meta.invite = '';
    rows = await sb('/members?select=*&user_id=eq.' + AUTH.uid);
  }
  /* Access: bekräftad e-post men ingen profil än (fliken stängdes) — slutför på registreringssidan */
  if(!rows.length){ goAccess(); throw new Error('Inloggningen fungerade, men registreringen är inte klar — slutför den på registreringssidan.'); }
  const m = rows[0];
  if(m.active===false) throw new Error('Kontot är avstängt. Prata med AZ.');
  S = cloudBlank();                    /* börja tomt — inget från en tidigare användare på enheten */
  upsertAcc(memberToAcc(m));
  S.session = {email:m.email||AUTH.email, name:m.name, member:m.name, id:m.id, ts:Date.now(), via:'cloud'};
  save();
  await sync(true);
  return m;
}
/* Användarnamn eller e-post. Användarnamnet slås upp på servern (edge-funktionen
   auth-login), så att ingen mejladress lämnas ut till webbläsaren. */
async function cloudLogin(login, password){
  const l = String(login||'').trim().toLowerCase();
  takeSession(l.includes('@') ? await sbAuth('/token?grant_type=password', {email:l, password})
                              : await sbFn('auth-login', {username:l, password}));
  return cloudEnter();
}

/* ---------- synk för crewet: poster upp, ändringar ner ---------- */
const KINDS = {booking:'bookings', circle:'circles', curriculum:'curricula', artist:'artists',
  release:'releases', beat:'beats', agenda:'agenda', goal:'goals', plan:'plans', file:'files', media:'media', course:'courses'};
async function cloudPush(){
  const since = S.cloud.pushedAt || 0, now = Date.now(), rows = [];
  Object.entries(KINDS).forEach(([kind, coll])=>(S[coll]||[]).forEach(x=>{
    if((x.up||0) > since) rows.push({kind, id:String(x.id), data:x, up:x.up||0, del:!!x.del});
  }));
  const setting = (id, data, up) => { if((up||0) > since) rows.push({kind:'setting', id, data, up, del:false}); };
  setting('studios', S.studios, S.studiosUp);
  setting('rates', S.rates, S.rates.up);
  if(can('manageCircles')){ const {up:cu, ...cfg} = S.circleCfg; setting('circles', cfg, cu); }
  if(can('manageCrew')){ const {up:ru, ...rc} = S.rewardsCfg; setting('rewards', rc, ru); }
  if(can('manageCrew')){ const {up:au, ...ac} = S.accessCfg; setting('access', ac, au); }
  setting('dropbox', {appKey:S.dropbox.appKey||'', sharedId:S.dropbox.sharedId||'', setupAt:S.dropbox.setupAt||0}, S.dropbox.up);
  setting('push', {publicKey:S.pushCfg.publicKey||''}, S.pushCfg.up);
  setting('backup', {at:S.backupCfg.at||0, by:S.backupCfg.by||''}, S.backupCfg.up);
  for(let i=0; i<rows.length; i+=200) await sbRpc('push_records', {rows: rows.slice(i, i+200)});
  if(can('manageCrew')){
    const acc = S.accounts.filter(a=>(a.up||0) > since).map(memberRow)
      /* admin rör aldrig managerns rad — databasen skulle neka hela omgången */
      .filter(a=>can('grantManager') || (byId(a.id)||{}).r!=='manager');
    if(acc.length) await sb('/members?on_conflict=id', {method:'POST',
      headers:{Prefer:'resolution=merge-duplicates,return=minimal'}, body: JSON.stringify(acc)});
  }
  S.cloud.pushedAt = now; save();
}
/* Kontot i appen → raden i databasen. user_id och användarnamnet skickas aldrig härifrån. */
const memberRow = a => ({id:a.id, role:a.r, name:a.n, email:a.email||null, phone:a.phone||null, color:a.c||null,
  glow:a.g||null, team:a.team||null, ig:a.ig||null, producer:a.producer||null, active:a.active!==false && !a.del, up:a.up||0,
  participant:a.part!==false, interests:a.interests||[], producers:a.producers||[]});
/* En person sparas direkt — en inbjudan kopplas till raden och den måste finnas först. */
async function pushMember(a){
  await sb('/members?on_conflict=id', {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
    body: JSON.stringify([memberRow(a)])});
}
/* Producenternas väg: bara en ny rad (members_crew_clients), aldrig en ändring. */
async function insertMember(a){
  await sb('/members', {method:'POST', headers:{Prefer:'return=minimal'}, body: JSON.stringify([memberRow(a)])});
}
function applyRecord(r){
  const up = +r.up || 0;
  if(r.kind==='setting'){
    if(r.id==='studios' && up > (S.studiosUp||0)){ S.studios = Object.assign({}, S.studios, r.data); S.studiosUp = up; }
    if(r.id==='rates'   && up > (S.rates.up||0))   S.rates = Object.assign({}, r.data, {up});
    if(r.id==='dropbox' && up > (S.dropbox.up||0)) S.dropbox = Object.assign({}, S.dropbox, r.data, {up});
    if(r.id==='push'    && up > (S.pushCfg.up||0)) S.pushCfg = Object.assign({}, S.pushCfg, r.data, {up});
    if(r.id==='backup'  && up > (S.backupCfg.up||0)) S.backupCfg = Object.assign({}, S.backupCfg, r.data, {up});
    if(r.id==='circles' && up > (S.circleCfg.up||0)) S.circleCfg = Object.assign({}, r.data, {up});
    if(r.id==='rewards' && up > (S.rewardsCfg.up||0)) S.rewardsCfg = Object.assign({}, r.data, {up});
    if(r.id==='access'  && up > (S.accessCfg.up||0))  S.accessCfg = Object.assign({}, r.data, {up});
    return;
  }
  const coll = KINDS[r.kind]; if(!coll) return;
  const d = Object.assign({}, r.data, {id: (r.data && r.data.id) || r.id, up, del: !!r.del});
  const ex = S[coll].find(x=>String(x.id)===String(d.id));
  if(!ex) S[coll].push(d); else if(up > (ex.up||0)) Object.assign(ex, d);
}
/* Hämtar på serverns stämpel (ts), inte på up — se db/01-schema.sql. Fem
   sekunders överlapp tar hand om skrivningar som landade samtidigt; att läsa
   samma post två gånger gör inget, nyaste up vinner ändå. */
async function cloudPull(){
  const since = S.cloud.pulledTs || 0, LIM = 1000;
  let max = since, from = Math.max(0, since - 5000);
  for(let page=0; page<50; page++){
    const rows = (await sb('/records?select=kind,id,data,up,del,ts&ts=gt.' + from + '&order=ts.asc&limit=' + LIM)) || [];
    rows.forEach(r=>{ max = Math.max(max, +r.ts||0); applyRecord(r); });
    if(rows.length < LIM) break;
    from = +rows[rows.length-1].ts;
  }
  const mem = (await sb('/members?select=*')) || [];
  const ids = new Set(mem.map(m=>m.id));
  S.accounts = S.accounts.filter(a=>ids.has(a.id));       /* raderade konton försvinner här också */
  mem.forEach(m=>upsertAcc(memberToAcc(m)));
  S.cloud.pulledTs = max; save();
}

/* ---------- ledare, deltagare, kund: en vy från servern ---------- */
async function cloudView(){
  const v = await sbRpc('my_view', {});
  const me = memberToAcc(v.me);
  S.accounts = [me].concat((v.people||[]).map(p=>memberToAcc(Object.assign({active:true}, p)))
    .filter(p=>p.id!==me.id));
  S.circles = v.circles || []; S.curricula = v.curricula || []; S.courses = v.courses || [];
  /* kunden ser andras pass bara som upptagen tid — utan namn och titel */
  S.bookings = (v.bookings||[]).concat((v.busy||[]).map(b=>Object.assign(
    {who:'', title:'Upptaget', circleId:'', status:'', present:[], with:[], busy:true, up:0, del:false}, b)));
  ['artists','releases','beats','agenda','goals','plans','files','media'].forEach(k=>S[k] = []);
  if(v.studios) S.studios = Object.assign({}, S.studios, v.studios);
  if(v.rates) S.rates = Object.assign({}, S.rates, v.rates);
  S.hoursOverride = v.hours || {};
  S.myProducer = v.producer || '';
  S.myProducers = v.producers || [];           /* kunden: producenterna hen kan boka med */
  S.producerBusy = v.producerBusy || [];       /* … och när de är upptagna (utan namn eller titel) */
  if(v.circleCfg) S.circleCfg = Object.assign({up:0}, v.circleCfg);
  S.leaderHours = v.leaderHours || null;    /* ledarens timbank (i år och nästa år), räknad på servern */
  S.reports = Object.fromEntries(Object.entries(v.reports || {}).map(([k,st])=>[k, {status:st}]));
  S.contact = v.contact || null;          /* kundens producent — för avbokning med kort varsel */
  /* Access (kunden): profilen, gruppen och priserna */
  S.profile = v.profile || null;
  S.myCircle = 'circle' in v ? {circle:v.circle||null, leader:v.leaderContact||null, group:v.group||[], hours:+v.circleHours||0} : null;
  if(v.access) S.accessCfg = Object.assign({up:0}, v.access);
  save();
}

/* Ändringar från ledare, deltagare och kunder går via serverns funktioner —
   de har ingen egen skrivrätt. I förhandsvisningen och för crewet sker
   ändringen lokalt och synkas som vanligt. */
/* Ledare, deltagare och kund mot servern — de har ingen egen skrivrätt. */
const remoteRole = () => !PREVIEW_LOGIN && roleView()!=='full';
async function act(fn, args, local){
  if(!remoteRole()){ local(); return true; }
  try{ await sbRpc(fn, args); await cloudView(); render(); return true; }
  catch(e){ toast(e.message); return false; }
}

/* Cirkelpass och deras närvaro går alltid via serverns funktioner när den är inkopplad
   — även för admin och producenter — så att tre timmar, krockar, timbanken och vem som
   leder vad kontrolleras på ett ställe. I förhandsläget sker ändringen lokalt; local()
   kan svara med ett felmeddelande. */
async function circleAct(fn, args, local){
  if(PREVIEW_LOGIN){ const err = local(); if(err){ toast(err); return false; } return true; }
  try{
    await sbRpc(fn, args);
    if(remoteRole()) await cloudView(); else await cloudPull();
    render(); return true;
  }catch(e){ toast(e.message); return false; }
}

/* ---------- synken ---------- */
let syncing = false, syncState = 'off', syncMsg = '', lastBeatScan = 0;
async function sync(silent){
  if(syncing) return;
  const c = cloudOn(), d = dbxReady() && roleView()==='full';
  if(!c && !d){ syncState = 'off'; paintSync(); if(!silent) toast('Servern är inte kopplad än — allt sparas på den här enheten'); return; }
  syncing = true; syncState = 'busy'; paintSync();
  try{
    if(c){ if(roleView()==='full'){ await cloudPush();
             /* v11: producenter ser bara cirklar de själva leder — hämta om allt en gång,
                så att cirklar som inte längre syns försvinner från enheten */
             if((S.cloud.v||0) < 11){ S.circles = []; S.cloud.pulledTs = 0; S.cloud.v = 11; }
             await cloudPull();
             if(can('manageCircles') || lcircle().some(c=>c.leader===(me()||{}).n)) await refreshReports().catch(()=>{});
             if(can('answerLeads')) S.leads = (await sb('/leads?select=*&status=eq.new&order=created_at.asc')) || [];
             if(can('answerAccess')) S.accessReqs = (await sb('/access_requests?select=*&status=eq.new&order=created_at.asc')) || []; }
           else await cloudView(); }
    if(d && Date.now() - lastBeatScan > 120000){ await scanBeats(); await scanMedia(); }
    syncState = 'ok';
    syncMsg = 'Synkad ' + new Date().toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});
    if(!silent) toast('Synkad');
    if(S.session) render();
  }catch(e){
    syncState = 'err'; syncMsg = e.message;

/* =====================================================================
   INBJUDNINGAR
   Managern skapar en länk per roll. Den som öppnar den skapar sitt konto
   och får rollen från länken. I förhandsvisningen sparas länkarna lokalt
   så att flödet går att prova i samma webbläsare.
   ===================================================================== */
const INVITE_ROLES = {producer:'Producent', admin:'Admin', camera:'Kamerateam', manager:'Manager',
  leader:'Cirkelledare', participant:'Deltagare', customer:'Kund'};
/* Rollerna den inloggade får bjuda in — admin kan inte skapa en manager. */
const inviteRoles = () => Object.entries(INVITE_ROLES).filter(([r])=>r!=='manager' || can('grantManager'));
const appUrl = () => location.origin + location.pathname;
const inviteUrl = tok => location.origin + location.pathname + '#join=' + tok;
function localToken(){
  const h = [...crypto.getRandomValues(new Uint8Array(5))].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();
  return h.slice(0,4) + '-' + h.slice(4,10);
}
/* x = {team, name, email, member}: med e-post skickas länken som mejl (det gör
   databasen, se create_invite). Med member gäller den en person som redan finns i
   appen — inloggningen kopplas då till den raden. */
async function createInvite(role, circleId, days, max, x){
  x = x || {};
  if(role==='manager' && !can('grantManager')) throw new Error('Bara managern kan bjuda in en manager');
  const em = String(x.email||'').trim().toLowerCase();
  if(em && !EMAIL_RE.test(em)) throw new Error('E-postadressen ser fel ut');
  if(PREVIEW_LOGIN){
    if((role==='leader'||role==='participant') && !circleId) throw new Error('Välj vilken cirkel inbjudan gäller');
    const m = x.member ? byId(x.member) : null, tok = localToken();
    if(m) S.invites.forEach(i=>{ if(i.member_id===m.id) i.closed = true; });       /* "skicka igen" */
    S.invites.push({token:tok, role, circle_id:circleId||null, expires_at:Date.now()+days*864e5,
      max_uses:(x.name||m) ? 1 : (max||null), uses:0, closed:false, created:Date.now(), created_at:new Date().toISOString(),
      team:x.team||(m&&m.team)||null, name:(m&&m.n)||x.name||null, email:em||null, member_id:m?m.id:null});
    if(m && em) bump(Object.assign(m, {email:em}));
    save(); return tok;
  }
  return sbRpc('create_invite', {p_role:role, p_circle:circleId||null, p_days:days, p_max:max||null,
    p_team:x.team||null, p_name:x.name||null, p_email:em||null, p_url: em ? appUrl() : null, p_member:x.member||null});
}
/* Samma regel som bs_phone i databasen: svenskt nummer → +46… */
function normPhone(p){
  const n = String(p||'').replace(/[\s\-().]/g,'');
  if(/^\+[1-9]\d{7,14}$/.test(n)) return n;
  if(/^00[1-9]\d{7,14}$/.test(n)) return '+' + n.slice(2);
  if(/^0[1-9]\d{6,11}$/.test(n)) return '+46' + n.slice(1);
  if(/^46[1-9]\d{6,11}$/.test(n)) return '+' + n;
  return '';
}
async function listInvites(){
  if(PREVIEW_LOGIN) return S.invites.slice().reverse();
  return (await sb('/invites?select=*&order=created_at.desc')) || [];
}
async function closeInvite(tok){
  if(PREVIEW_LOGIN){ const i = S.invites.find(x=>x.token===tok); if(i){ i.closed = true; save(); } return; }
  await sb('/invites?token=eq.' + encodeURIComponent(tok), {method:'PATCH', body: JSON.stringify({closed:true})});
}
function inviteState(i){
  if(!i) return {ok:false, why:'Länken finns inte'};
  if(i.closed) return {ok:false, why:'Länken är stängd'};
  if(+new Date(i.expires_at) <= Date.now()) return {ok:false, why:'Länken har gått ut'};
  if(i.max_uses && i.uses >= i.max_uses) return {ok:false, why:'Länken är redan använd'};
  return {ok:true, why:''};
}
async function inviteInfo(tok){
  if(PREVIEW_LOGIN){
    const i = S.invites.find(x=>x.token===String(tok).toUpperCase());
    const c = i && i.circle_id ? circleById(i.circle_id) : null;
    return Object.assign(inviteState(i), {role:i&&i.role, circle:c?c.n:null, team:i&&i.team, name:i&&i.name,
      email:i&&i.email, member:!!(i&&i.member_id),
      leads: i && i.member_id ? lcircle().filter(x=>x.leader===i.name).map(x=>x.n) : []});
  }
  return sbRpc('invite_info', {p_token:tok});
}
/* Skapa konto från en länk. Returnerar 'ok', eller 'code' om Supabase mejlat en
   kod som ska skrivas in (då löses länken in när koden är verifierad). */
async function joinWithInvite(f){
  const name = String(f.name||'').trim(), username = String(f.username||'').trim().toLowerCase();
  if(name.length < 2) throw new Error('Fyll i ditt namn');
  if(!USERNAME_RE.test(username)) throw new Error('Välj ett användarnamn: 2–24 tecken, a–z, 0–9, punkt, bindestreck eller understreck');
  if(PREVIEW_LOGIN){
    const i = S.invites.find(x=>x.token===String(f.token).toUpperCase());
    const st = inviteState(i); if(!st.ok) throw new Error(st.why);
    if(S.accounts.some(a=>(a.username||'')===username)) throw new Error('Användarnamnet är upptaget');
    let acc = i.member_id ? byId(i.member_id) : null;
    if(acc){
      /* personen fanns redan i appen: samma konto, nu med inloggning och rollen från länken */
      bump(Object.assign(acc, {r:i.role, username, email:f.email.trim() || acc.email, team:i.team || acc.team, login:true}));
    } else {
      if(accounts().some(a=>a.n.toLowerCase()===name.toLowerCase())) throw new Error('Namnet finns redan — lägg till efternamnet');
      const crewish = isTeamRole(i.role), pal = PALETTE[S.accounts.length % PALETTE.length];
      acc = bump({id:uid(), n:name, r:i.role, email:f.email.trim(), phone:'', username, team:i.team||'', login:true,
        c: crewish ? pal[0] : '#6633b8', g: crewish ? pal[1] : '#9d5cf5', active:true, del:false});
      S.accounts.push(acc);
    }
    const c = i.circle_id ? circleById(i.circle_id) : null;
    if(c && i.role==='participant' && !(c.members||[]).includes(acc.id)){ c.members = (c.members||[]).concat(acc.id); bump(c); }
    if(c && i.role==='leader'){ c.leader = acc.n; bump(c); }
    if(i.lead_id) S.bookings.filter(b=>b.leadId===i.lead_id).forEach(b=>bump(Object.assign(b, {who:acc.n, reqBy:acc.id})));
    i.uses++; save(); signIn(acc); return 'ok';
  }
  const email = f.email.trim().toLowerCase();
  if(!EMAIL_RE.test(email)) throw new Error('E-postadressen ser fel ut');
  if((f.password||'').length < 8) throw new Error('Lösenordet måste vara minst 8 tecken');
  if(await usernameFree(username).catch(()=>null) === false) throw new Error('Användarnamnet är upptaget — välj ett annat');
  localStorage.setItem('bandosesh_invite', JSON.stringify({token:f.token, name, username, email}));
  const j = await sbAuth('/signup', {email, password:f.password,
    data:{name, username, invite:String(f.token).toUpperCase()}});
  /* Supabase svarar utan fel men utan identities när adressen redan har ett bekräftat konto */
  if(j && Array.isArray(j.identities) && !j.identities.length) throw new Error('Det finns redan ett konto med den e-posten — logga in i stället');
  if(!takeSession(j)) return 'code';
  await cloudEnter(); showApp(); return 'ok';
}

/* =====================================================================
   DROPBOX — beatkanalen
   OAuth med PKCE: ingen hemlig nyckel i webbläsaren. Varje producent kopplar
   sitt eget Dropbox; /BANDOHQ är en delad mapp som monteras automatiskt.
   ===================================================================== */
const DBX_API = 'https://api.dropboxapi.com/2', DBX_CONTENT = 'https://content.dropboxapi.com/2';
const DBX_ROOT = '/BANDOHQ';
let DBX = (()=>{ try{ return JSON.parse(localStorage.getItem('bandosesh_dbx')||'null'); }catch(e){ return null; } })();
function saveDbx(t){ DBX = t; try{ t ? localStorage.setItem('bandosesh_dbx', JSON.stringify(t)) : localStorage.removeItem('bandosesh_dbx'); }catch(e){} }
const dbxConfigured = () => !!(S.dropbox.appKey||'').trim();
const dbxConnected  = () => dbxConfigured() && !!DBX;
const dbxReady      = () => dbxConnected() && !!S.dropbox.setupAt;
const dbxRedirect   = () => location.origin + location.pathname;
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
/* Dropbox-API-Arg är en HTTP-header — svenska tecken måste skrivas som \uXXXX. */
const dbxArg = o => JSON.stringify(o).replace(/[\u007f-￿]/g, c=>'\\u'+('000'+c.charCodeAt(0).toString(16)).slice(-4));

async function dbxConnect(){
  if(!dbxConfigured()) return toast('Dropbox-nyckeln saknas — AZ lägger in den');
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  sessionStorage.setItem('bandosesh_pkce', verifier);
  const p = new URLSearchParams({client_id:S.dropbox.appKey.trim(), response_type:'code',
    code_challenge:challenge, code_challenge_method:'S256', token_access_type:'offline',
    redirect_uri:dbxRedirect(), state:'dbx'});
  location.href = 'https://www.dropbox.com/oauth2/authorize?' + p;
}
async function dbxFinish(code){
  const verifier = sessionStorage.getItem('bandosesh_pkce'); sessionStorage.removeItem('bandosesh_pkce');
  const r = await fetch('https://api.dropboxapi.com/oauth2/token', {method:'POST', body:new URLSearchParams({
    code, grant_type:'authorization_code', client_id:S.dropbox.appKey.trim(), code_verifier:verifier||'',
    redirect_uri:dbxRedirect()})});
  if(!r.ok) throw new Error('Dropbox godkände inte kopplingen — försök igen');
  const j = await r.json();
  saveDbx({access:j.access_token, refresh:j.refresh_token, exp:Date.now()+(j.expires_in||14400)*1000});
  await dbxMount();
}
async function dbxTok(){
  if(!DBX) throw new Error('Dropbox är inte kopplat');
  if(DBX.exp - Date.now() > 60000) return DBX.access;
  const r = await fetch('https://api.dropboxapi.com/oauth2/token', {method:'POST', body:new URLSearchParams({
    grant_type:'refresh_token', refresh_token:DBX.refresh, client_id:S.dropbox.appKey.trim()})});
  if(!r.ok){ saveDbx(null); throw new Error('Dropbox-kopplingen har gått ut — koppla igen under Profil'); }
  const j = await r.json();
  saveDbx(Object.assign({}, DBX, {access:j.access_token, exp:Date.now()+(j.expires_in||14400)*1000}));
  return DBX.access;
}
async function dbx(ep, args){
  const r = await fetch(DBX_API + '/' + ep, {method:'POST',
    headers:{Authorization:'Bearer ' + await dbxTok(), 'Content-Type':'application/json'},
    body: JSON.stringify(args===undefined ? null : args)});
  if(!r.ok){
    let s = ''; try{ s = (await r.json()).error_summary || ''; }catch(e){}
    const err = new Error(s ? 'Dropbox: ' + s : 'Dropbox svarade ' + r.status); err.summary = s; throw err;
  }
  return r.json();
}
async function dbxMkdir(path){
  try{ await dbx('files/create_folder_v2', {path, autorename:false}); }
  catch(e){ if(!/conflict/.test(e.summary||'')) throw e; }     /* finns redan — bra */
}
/* Managern: skapa mapparna och dela /BANDOHQ med crewets e-post. Går att köra om. */
async function dbxSetup(step){
  step = step || (()=>{});
  step('Skapar mapparna…');
  const credits = [...new Set(teamAcc().map(creditOf))];
  for(const p of [DBX_ROOT, DBX_ROOT+'/Beats', DBX_ROOT+'/Media'].concat(crew().map(m=>DBX_ROOT+'/Beats/'+m.n),
    credits.map(c=>DBX_ROOT+'/Media/'+c))) await dbxMkdir(p);
  step('Delar mappen med crewet…');
  let sid = S.dropbox.sharedId || '';
  if(!sid){
    try{
      let r = await dbx('sharing/share_folder', {path:DBX_ROOT, force_async:false});
      for(let n=0; r['.tag']==='async_job_id' && n<20; n++){
        await new Promise(res=>setTimeout(res, 800));
        r = await dbx('sharing/check_share_job_status', {async_job_id:r.async_job_id});
      }
      sid = r.shared_folder_id || '';
    }catch(e){
      if(!/already_shared|bad_path\/already_shared/.test(e.summary||'')) throw e;
      const md = await dbx('files/get_metadata', {path:DBX_ROOT});
      sid = md.shared_folder_id || (md.sharing_info && md.sharing_info.shared_folder_id) || '';
    }
  }
  /* hela teamet — kamerateamet laddar upp i Media */
  const mails = teamAcc().filter(m=>m.email && m.id!==(me()||{}).id).map(m=>m.email);
  if(sid && mails.length) await dbx('sharing/add_folder_member', {shared_folder_id:sid, quiet:true,
    members: mails.map(email=>({member:{'.tag':'email', email}, access_level:{'.tag':'editor'}}))});
  S.dropbox = Object.assign({}, S.dropbox, {sharedId:sid, setupAt:Date.now(), up:Date.now()});
  saveDbx(Object.assign({}, DBX, {root:DBX_ROOT}));
  save(); sync(true);
  return {folders: crew().length, shared: mails.length};
}
/* Producent: den delade mappen dyker upp i ens eget Dropbox automatiskt. */
/* Var mappen hamnar beror på personen: heter något redan BANDOHQ i ens
   Dropbox blir den "BANDOHQ (1)". Därför sparas den faktiska vägen. */
async function dbxMount(){
  if(!S.dropbox.sharedId || !DBX) return;
  let p = '';
  try{ p = (await dbx('sharing/mount_folder', {shared_folder_id:S.dropbox.sharedId})).path_lower || ''; }
  catch(e){   /* redan monterad, eller ägaren själv */
    try{ p = (await dbx('sharing/get_folder_metadata', {shared_folder_id:S.dropbox.sharedId})).path_lower || ''; }catch(e2){}
  }
  if(p) saveDbx(Object.assign({}, DBX, {root:p}));
}
const dbxRoot = () => (DBX && DBX.root) || DBX_ROOT;
async function dbxUpload(file, path, onProg){
  const tok = await dbxTok(), commit = {path, mode:'add', autorename:true, mute:true};
  const H = arg => ({Authorization:'Bearer '+tok, 'Content-Type':'application/octet-stream', 'Dropbox-API-Arg':dbxArg(arg)});
  if(file.size <= 150*1024*1024){
    const r = await xhrUpload(DBX_CONTENT+'/files/upload', 'POST', H(commit), file, onProg);
    return JSON.parse(r.body);
  }
  /* stora filer (över 150 MB): i bitar om 8 MB — starta, lägg till, avsluta */
  const CH = 8*1024*1024, parts = [];
  for(let o=0; o<file.size; o+=CH) parts.push([o, Math.min(o+CH, file.size)]);
  const send = (ep, arg, [o,e]) => xhrUpload(DBX_CONTENT+'/files/'+ep, 'POST', H(arg), file.slice(o,e),
    p => onProg((o + p*(e-o)) / file.size));
  const sid = JSON.parse((await send('upload_session/start', {close:false}, parts[0])).body).session_id;
  for(let i=1; i<parts.length-1; i++)
    await send('upload_session/append_v2', {cursor:{session_id:sid, offset:parts[i][0]}, close:false}, parts[i]);
  const last = parts[parts.length-1];
  return JSON.parse((await send('upload_session/finish', {cursor:{session_id:sid, offset:last[0]}, commit}, last)).body);
}

/* ---------- uppladdning ---------- */
function xhrUpload(url, method, headers, body, onProg){
  return new Promise((res, rej)=>{
    const x = new XMLHttpRequest();
    x.open(method, url, true);
    Object.keys(headers).forEach(k=>x.setRequestHeader(k, headers[k]));
    if(x.upload && onProg) x.upload.onprogress = e => { if(e.lengthComputable) onProg(e.loaded/e.total); };
    x.onload = ()=> (x.status>=200 && x.status<300)
      ? res({body:x.responseText, xhr:x})
      : rej(new Error('Uppladdning misslyckades ('+x.status+')'));
    x.onerror = ()=> rej(new Error('Nätverksfel under uppladdning'));
    x.send(body);
  });
}

/* Per post, nyaste up vinner. Gör att en tappad skrivning läker av sig själv:
   enheten som har den nyare posten laddar upp den igen vid nästa synk. */
function mergeData(d){
  let add=0, upd=0;
  (d.b||[]).forEach(r=>{
    const nb = {id:r[0],studio:r[1],date:r[2],start:r[3],end:r[4],who:r[5],title:r[6],note:r[7],
      up:r[8]||0,del:!!r[9],paid:!!r[10],
      circleId:r[11]||'', status:r[12]||'', hours:(r[13]===''||r[13]==null)?null:Number(r[13]),
      present:Array.isArray(r[14])?r[14]:[], completedBy:r[15]||'',
      with:Array.isArray(r[16])?r[16]:[], artistId:r[17]||'', ran:!!r[18]};
    const ex = S.bookings.find(x=>x.id===nb.id);
    if(!ex){ S.bookings.push(nb); if(!nb.del) add++; }
    else if((nb.up||0) > (ex.up||0)){ Object.assign(ex, nb); upd++; }
  });
  (d.f||[]).forEach(r=>{
    const nf = {id:r[0],who:r[1],bookingId:r[2],name:r[3],mime:r[4],size:r[5],driveId:r[6],link:r[7],
      up:r[8]||0,del:!!r[9]};
    const ex = S.files.find(x=>x.id===nf.id);
    if(!ex) S.files.push(nf);
    else if((nf.up||0) > (ex.up||0)) Object.assign(ex, nf);
  });
  /* Cirklar, deltagare och läroplaner mergas per post, nyaste up vinner —
     samma regel som allt annat, så en tappad skrivning läker av sig själv. */
  /* Konton: acc när den finns, annars crew + pe från en v3-klient. */
  const accIn = (d.acc && d.acc.length) ? d.acc
    : [].concat((d.crew||[]), (d.pe||[]).map(p=>Object.assign({r:'participant',c:'#6633b8',g:'#9d5cf5'},p)));
  accIn.forEach(na=>{
    delete na.pinHash; delete na.pinSalt;      /* en äldre klient kan fortfarande skicka dem */
    const ex = S.accounts.find(x=>x.id===na.id);
    if(!ex) S.accounts.push(Object.assign({r:'participant',c:'#6633b8',g:'#9d5cf5',
      email:'',phone:'',active:true,del:false,up:0}, na));
    else if((na.up||0) > (ex.up||0)) Object.assign(ex, na);
  });
  [['ci','circles'],['cu','curricula'],
   ['ar','artists'],['rl','releases'],['bt','beats'],['ag','agenda'],['go','goals'],['pl','plans'],['md','media']]
  .forEach(([key,coll])=>{
    (d[key]||[]).forEach(nx=>{
      const ex = S[coll].find(x=>x.id===nx.id);
      if(!ex) S[coll].push(nx);
      else if((nx.up||0) > (ex.up||0)) Object.assign(ex, nx);
    });
  });
  if(d.s && (d.sUp||0) > (S.studiosUp||0)){ S.studios = d.s; S.studiosUp = d.sUp; }
  if(d.dbx && (d.dbx.up||0) > (S.dropbox.up||0)) S.dropbox = Object.assign({}, S.dropbox, d.dbx);
  if(d.rates && (d.rates.up||0) > (S.rates.up||0)) S.rates = d.rates;
  save();
  return {add, upd};

/* 1 240 000 → "1,24 M". Under miljonen visas exakt med mellanslag — "509 100"
   är både kortare att läsa och sannare än en avrundning. */
function fmtNum(n){
  n = +n || 0;
  if(n >= 1e6) return (Math.round(n/1e4)/100).toString().replace('.',',') + ' M';
  return Math.round(n).toLocaleString('sv-SE');
}
/* Det som besvarar "hur mycket måste han skapa för att släppa": genomförda
   pass delat med antal släpp. Bara pass som redan hänt räknas. */
function artistStats(aid){
  const now = new Date();
  const all = booked().filter(b=>b.artistId===aid);
  const done = all.filter(b=>startAt(b)<=now).sort((a,b)=>startAt(b)-startAt(a));
  const rel = lreleases().filter(r=>r.artistId===aid);
  const streams = rel.reduce((a,r)=>a+(+r.streams||0),0);
  return {sessions:done.length, upcoming:all.length-done.length,
    hours: done.reduce((a,b)=>a+dur(b),0), releases:rel.length, streams,
    perRelease: rel.length ? done.length/rel.length : null,
    beats: lbeats().filter(b=>b.artistId===aid).length,
    last: done[0] || null};
}
function rankBadge(id){
  const a = artistById(id); if(!a) return '';
  return `<span class="rank ${prioOf(a)===1?'top':''}">Prio ${prioOf(a)} · #${rankOf(id)}</span>`;
}

/* Ny ordning → numrera om alla (10, 20, 30…). Bara de som ändrats bumpas. */
function setArtistOrder(ids, prioChange){
  ids.forEach((id,i)=>{ const a = artistById(id); if(!a) return;
    const patch = {};
    if(a.rank !== (i+1)*10) patch.rank = (i+1)*10;
    if(prioChange && prioChange[id] && prioChange[id] !== prioOf(a)) patch.priority = prioChange[id];
    if(Object.keys(patch).length) bump(Object.assign(a, patch)); });
  save(); render(); sync(true);
}
/* upp/ner inom samma grad */
function moveArtist(id, dir){
  if(!can('manageArtists')) return;
  const a = artistById(id); if(!a) return;
  const all = artistsRanked().map(x=>x.id), grp = artistsRanked().filter(x=>prioOf(x)===prioOf(a)).map(x=>x.id);
  const i = grp.indexOf(id), j = i + dir;
  if(i<0 || j<0 || j>=grp.length) return;
  const ai = all.indexOf(grp[i]), aj = all.indexOf(grp[j]);
  [all[ai], all[aj]] = [all[aj], all[ai]];
  setArtistOrder(all);
}
/* flytta före en annan artist (eller sist i en grad), och byt grad om det behövs */
function moveArtistBefore(id, beforeId, prio){
  if(!can('manageArtists')) return;
  const ids = artistsRanked().map(a=>a.id).filter(x=>x!==id);
  let pos = beforeId ? ids.indexOf(beforeId) : -1;
  if(pos < 0){ const last = artistsRanked().filter(a=>a.id!==id && prioOf(a)===prio).pop();
    pos = last ? ids.indexOf(last.id) + 1 : ids.filter(x=>prioOf(artistById(x)) < prio).length; }
  ids.splice(pos, 0, id);
  setArtistOrder(ids, {[id]: prio});
}

/* Dra och släpp på datorn. Delegerat, så det överlever omritningar. */
(function(){
  let dragId = '';
  document.addEventListener('dragstart', e=>{
    const r = e.target.closest && e.target.closest('.rankrow[draggable]'); if(!r) return;
    dragId = r.dataset.id; r.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId);
  });
  document.addEventListener('dragover', e=>{
    const r = dragId && e.target.closest && e.target.closest('.rankrow'); if(!r) return;
    e.preventDefault();
    document.querySelectorAll('.rankrow.over').forEach(x=>x!==r && x.classList.remove('over'));
    r.classList.add('over');
  });
  document.addEventListener('drop', e=>{
    const r = dragId && e.target.closest && e.target.closest('.rankrow'); if(!r) return;
    e.preventDefault(); e.stopPropagation();
    const id = dragId; dragId = '';
    if(r.dataset.id === id){ render(); return; }
    moveArtistBefore(id, r.dataset.id || null, +r.dataset.p);
  });
  document.addEventListener('dragend', ()=>{ dragId = '';
    document.querySelectorAll('.rankrow.dragging,.rankrow.over').forEach(x=>x.classList.remove('dragging','over')); });

/* ---------- KALKYLARK ----------

   på rubrik (Namn, Prio, Genre, Anteckning, Instagram). XLSX läses utan

let impRows = [];
function openArtistImport(){

  openSheet(`${X}<h2>Importera artister</h2>
    <div class="sub">Från ett kalkylark med en rad per artist. Prio 1, 2 eller 3 (1 = prio, 3 = inte prio).</div>

async function importFile(f){
  if(!f) return;
  try{
    const rows = /\.xlsx$/i.test(f.name) ? await readXlsx(await f.arrayBuffer()) : parseTable(await f.text());
    previewImport(rows);
  }catch(e){ document.getElementById('impOut').innerHTML = `<div class="warn">Filen gick inte att läsa: ${esc(e.message)}</div>`; }
}
/* Text → rader. Tabb (inklistrat), semikolon (svensk Excel-CSV) eller komma. */
function parseTable(text){
  text = String(text||'').replace(/^﻿/,'').replace(/\r\n?/g,'\n');
  const first = text.split('\n')[0] || '';
  const sep = first.includes('\t') ? '\t' : (first.split(';').length > first.split(',').length ? ';' : ',');
  const rows = []; let row = [], cell = '', q = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q = false; } else cell += c; }
    else if(c==='"' && cell==='') q = true;
    else if(c===sep){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell += c;
  }
  if(cell || row.length){ row.push(cell); rows.push(row); }
  return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(Boolean));
}
function parsePrio(v){
  v = String(v||'').trim().toLowerCase();
  if(/^[123]([.,]0)?$/.test(v)) return +v[0];
  if(/^(hög|hog|high|ja|prio)/.test(v)) return 1;
  if(/^(mellan|medel|mid|medium)/.test(v)) return 2;
  if(/^(låg|lag|low|inte|nej|ingen)/.test(v)) return 3;
  return 0;
}
/* Rader → artister. Rubrikraden känns igen på ordet namn/artist. */
function mapArtistRows(rows){
  if(!rows.length) return [];
  const h = rows[0].map(x=>x.toLowerCase());
  const find = re => h.findIndex(x=>re.test(x));
  let ci = {n:find(/namn|artist|name/), p:find(/prio|grad|priority/), g:find(/genre/),
            t:find(/anteckning|note|kommentar|info|status/), i:find(/insta|^ig$/)};
  let body = rows.slice(1);
  if(ci.n < 0){ ci = {n:0, p:1, g:2, t:3, i:4}; body = rows; }   /* ingen rubrik: Namn, Prio, … */
  return body.map(r=>({n:(r[ci.n]||'').slice(0,40), p:ci.p>=0 ? parsePrio(r[ci.p]) : 0,
      genre:ci.g>=0 ? (r[ci.g]||'').slice(0,30) : '', note:ci.t>=0 ? (r[ci.t]||'').slice(0,300) : '',
      ig:ci.i>=0 ? (r[ci.i]||'').replace(/^@/,'').slice(0,30) : ''}))
    .filter(x=>x.n.length>=1);
}
function previewImport(rows){
  impRows = mapArtistRows(rows);
  const out = document.getElementById('impOut');
  if(!impRows.length){ out.innerHTML = `<div class="warn">Hittade inga artister. Första kolumnen ska vara namnet.</div>`; return; }
  out.innerHTML = `<div class="eyebrow">${nt(impRows.length,'RAD','RADER')}<span class="ln"></span></div>
    <div class="ranklist">${impRows.map((x,i)=>{ const ex = lartists().find(a=>a.n.toLowerCase()===x.n.toLowerCase());
      const what = ex ? (x.p && x.p!==prioOf(ex) ? `finns · prio ${prioOf(ex)} → ${x.p}` : 'finns · uppdateras') : `ny · prio ${x.p||2}`;
      return `<label class="rankrow" style="cursor:pointer"><input type="checkbox" class="impck" data-i="${i}" checked>
        <span class="grow"><span class="mname">${esc(x.n)}</span><span class="mrole" style="display:block">${what}${x.genre?' · '+esc(x.genre):''}</span></span></label>`;
    }).join('')}</div>
    <button class="btn" style="margin-top:14px" onclick="commitImport()">LÄGG IN</button>`;
}
function commitImport(){
  let add = 0, upd = 0;
  [...document.querySelectorAll('.impck')].filter(e=>e.checked).forEach(e=>{
    const x = impRows[+e.dataset.i]; if(!x) return;
    const ex = lartists().find(a=>a.n.toLowerCase()===x.n.toLowerCase());
    if(ex){
      const patch = {};
      if(x.p && x.p!==prioOf(ex)){ patch.priority = x.p; patch.rank = 1e9; }   /* ny grad: sist i den */
      ['genre','note','ig'].forEach(k=>{ if(x[k] && x[k]!==ex[k]) patch[k] = x[k]; });
      if(Object.keys(patch).length){ bump(Object.assign(ex, patch)); upd++; }
    } else {

/* Spara en fil. I iPhone-appen går det inte att ladda ner — där öppnas delningsmenyn
   (Spara i Filer, AirDrop, mejl) med filen. */
async function saveBlob(blob, name){
  if(isNative()){
    const data = await new Promise((res, rej)=>{ const r = new FileReader();
      r.onload = ()=>res(String(r.result).split(',')[1]); r.onerror = ()=>rej(r.error); r.readAsDataURL(blob); });
    const f = await plug('Filesystem').writeFile({path:name, data, directory:'CACHE'});
    await plug('Share').share({title:name, url:f.uri}).catch(()=>{});
    return;
  }
  const url = URL.createObjectURL(blob), el = document.createElement('a'); el.href = url; el.download = name;
  document.body.appendChild(el); el.click(); el.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
/* Länkar ut ur appen (Dropbox): i iPhone-appen i Safari-vyn ovanpå appen. */
function openExternal(url){
  if(isNative() && plug('Browser')) return plug('Browser').open({url});
  window.open(url, '_blank', 'noopener');
}
/* Minimal .xlsx-läsare: zipens centralkatalog → delade strängar + första bladet. */
async function readXlsx(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder();
  let eocd = -1;
  for(let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  if(eocd < 0) throw new Error('inte en xlsx-fil');
  const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const files = {};
  for(let k=0; k<n; k++){
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const off = dv.getUint32(p + 42, true), name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
    files[name] = {method, csize, off};
    p += 46 + nlen + xlen + clen;
  }
  const read = async name => { const f = files[name]; if(!f) return null;
    const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
    const data = u8.subarray(start, start + f.csize);
    if(f.method === 0) return dec.decode(data);
    const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return await new Response(stream).text(); };
  const xml = t => new DOMParser().parseFromString(t, 'application/xml');
  const ssT = await read('xl/sharedStrings.xml');
  const ss = ssT ? [...xml(ssT).getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')) : [];
  const sheetName = Object.keys(files).filter(f=>/^xl\/worksheets\/sheet\d+\.xml$/.test(f)).sort()[0];
  if(!sheetName) throw new Error('hittar inget blad');
  const rows = [];
  for(const r of xml(await read(sheetName)).getElementsByTagName('row')){
    const row = [];
    for(const c of r.getElementsByTagName('c')){
      const ref = c.getAttribute('r') || '', col = ref.replace(/\d+/g,'').split('').reduce((a,ch)=>a*26 + ch.charCodeAt(0) - 64, 0) - 1;
      const t = c.getAttribute('t'), v = (c.getElementsByTagName('v')[0]||{}).textContent;
      const val = t==='s' ? (ss[+v]||'') : t==='inlineStr' ? [...c.getElementsByTagName('t')].map(x=>x.textContent).join('') : (v||'');
      row[col >= 0 ? col : row.length] = val;
    }
    rows.push([...row].map(x=>x==null?'':String(x).trim()));
  }
  return rows.filter(r=>r.some(Boolean));
}
