<meta charset="utf-8"><title>BANDOHQ v7</title>
<style>body{background:#111;color:#eee;font:13px ui-monospace,Menlo,monospace;margin:0;display:flex}
pre{padding:16px;margin:0;white-space:pre-wrap;flex:1;max-height:100vh;overflow:auto}
iframe{width:390px;height:844px;border:0;flex:none;background:#000}</style>
<pre id="out">kör…</pre><iframe id="fr"></iframe>
<script>
const out=document.getElementById('out'), fr=document.getElementById('fr');
let pass=0,fail=0,lines=[];
const log=s=>{lines.push(s);out.textContent=lines.join('\n');};
const ok=(n,c,x)=>{c?pass++:fail++;log((c?'PASS  ':'FAIL  ')+n+(!c&&x!==undefined?'   → '+JSON.stringify(x):''));};

/* v3-format i seeden — heal() ska migrera den till S.accounts */
const CREW=[
 {id:'rkay',n:'RKAY',r:'producer',c:'#7c3aed',g:'#a855f7',email:'rkay@b.se',pinHash:'',pinSalt:'',active:true,up:1},
 {id:'adrey',n:'ADREY',r:'producer',c:'#0284c7',g:'#38bdf8',email:'',pinHash:'',pinSalt:'',active:true,up:1},
 {id:'az',n:'AZ',r:'manager',c:'#cbd5e1',g:'#f1f5f9',email:'az@b.se',pinHash:'',pinSalt:'',active:true,up:1}];
const PEOPLE=[
 {id:'p1',n:'William Ek',phone:'070-1',email:'w@b.se',active:true,del:false,up:1},
 {id:'p2',n:'Nora Lind',phone:'070-2',email:'n@b.se',active:true,del:false,up:1}];
const CURR=[{id:'cu1',subject:'Musikproduktion',title:'Aktuell läroplan – Musikproduktion',
  body:'Produktion\nArrangemang',from:'2026-09-01',del:false,up:1}];
const CIRC=[{id:'c1',n:'Musikproduktion – Grupp 1',subject:'Musikproduktion',leader:'RKAY',
  curriculumId:'cu1',members:['p1','p2'],active:true,del:false,up:1}];

function seed(extra){
  return Object.assign({v:2, session:{email:'',name:'AZ',picture:'',member:'AZ',ts:1,via:'pin'},
    crew:JSON.parse(JSON.stringify(CREW)), people:JSON.parse(JSON.stringify(PEOPLE)),
    circles:JSON.parse(JSON.stringify(CIRC)), curricula:JSON.parse(JSON.stringify(CURR)),
    studios:{A:'STUDIO A',B:'THE BOOTH'}, bookings:[], files:[],
    dropbox:{appKey:'',sharedId:'',setupAt:0,up:0}, seed8:1,   /* v8-kontona testas för sig */
    rates:{currency:'SEK',default:650,per:{},up:1}}, extra||{});
}
function boot(seedVal){
  return new Promise(res=>{
    fr.onload=null; fr.src='about:blank';
    setTimeout(()=>{
      localStorage.clear();
      if(seedVal) localStorage.setItem('bandosesh_v2', JSON.stringify(seedVal));
      fr.onload=()=>setTimeout(()=>res(fr.contentWindow),260);
      fr.src='../index.html?mock=1&cb='+Math.random()+(boot.hash||''); boot.hash='';
    },400);
  });
}
const ev=(w,c)=>w.eval('(async()=>{'+c+'})()');

(async function run(){
 try{
  /* ============ 1 · MIGRERING ============ */
  log('── migrering till en kontolista ──');
  let w = await boot(seed());
  let r = await ev(w,`return {
    hasAcc: Array.isArray(S.accounts), noCrew: S.crew===undefined, noPeople: S.people===undefined,
    total: accounts().length, crew: crew().length, parts: lpeople().length,
    ids: accounts().map(a=>a.id).sort().join(','),
    roles: accounts().map(a=>a.n+':'+a.r).sort().join(' '),
    members: membersOf('c1').map(p=>p.n).join(','),
    hasPhone: (byId('p1')||{}).phone==='070-1'};`);
  ok('S.accounts finns, crew och people är borta', r.hasAcc && r.noCrew && r.noPeople, r);
  ok('alla fem konton migrerade', r.total===5, r.total);
  ok('crewet är ett rollfilter (3)', r.crew===3, r.crew);
  ok('deltagarna fick rollen participant (2)', r.parts===2, r.parts);
  ok('id:n behölls', r.ids==='adrey,az,p1,p2,rkay', r.ids);
  ok('cirkelmedlemskapen pekar fortfarande rätt', r.members==='Nora Lind,William Ek', r.members);
  ok('telefonnumret följde med', r.hasPhone===true);

  /* ============ 2 · ROLLER OCH VYER ============ */
  log('\n── roller och vyer ──');
  r = await ev(w,`
    const res={};
    for(const [id,role] of [['az','manager'],['rkay','producer'],['p1','participant']]){
      byId(id).r = role; S.session.member = byId(id).n;
      res[role] = {view:roleView(), tabs: roleView()==='full'?tabs().length:0};
    }
    byId('adrey').r='leader'; S.session.member='ADREY';
    res.leader = {view:roleView(), tabs:0};
    byId('p2').r='customer'; S.session.member='Nora Lind';
    res.customer = {view:roleView(), tabs:0};
    S.session.member='AZ'; byId('rkay').r='producer'; byId('p1').r='participant';
    return res;`);
  ok('manager får hela appen (fem flikar + MER)', r.manager.view==='full' && r.manager.tabs===5, r.manager);
  ok('producent får hela appen med fem flikar', r.producer.view==='full' && r.producer.tabs===5, r.producer);
  ok('deltagare får sin egen vy', r.participant.view==='participant', r.participant);
  ok('cirkelledare utan producentroll får sin egen vy', r.leader.view==='leader', r.leader);
  ok('kund får sin egen vy', r.customer.view==='customer', r.customer);

  r = await ev(w,`
    /* producent som OCKSÅ leder en cirkel ska ha producentvyn */
    S.session.member='RKAY';
    return {leads: leadsAny('RKAY'), view: roleView()};`);
  ok('producent som leder cirkel behåller producentvyn', r.leads===true && r.view==='full', r);

  /* ============ 3 · FÖRFRÅGAN BLOCKERAR INTE STUDION ============ */
  log('\n── förfrågan tar ingen plats ──');
  w = await boot(seed());
  r = await ev(w,`
    byId('p1').r='participant'; S.session.member='William Ek';
    const c = circleById('c1');
    S.bookings.push({id:'rq1',studio:'',date:'2026-11-10',start:'18:00',end:'21:00',
      who:'RKAY',title:c.n,note:'',circleId:'c1',status:'request',reqBy:'p1',
      hours:null,present:[],up:Date.now(),del:false,paid:false});
    save();
    return {
      inLive: live().some(b=>b.id==='rq1'),
      inBooked: booked().some(b=>b.id==='rq1'),
      blocksA: clash({studio:'A',date:'2026-11-10',start:'19:00',end:'20:00'},null).length,
      blocksB: clash({studio:'B',date:'2026-11-10',start:'19:00',end:'20:00'},null).length,
      freeA: freeAt('A','2026-11-10','18:00','21:00',null),
      reqCount: requests().length,
      hours: hoursFor('p1')};`);
  ok('förfrågan finns i datan', r.inLive===true);
  ok('men räknas INTE som bokad', r.inBooked===false);
  ok('den blockerar inte studio A', r.blocksA===0, r.blocksA);
  ok('och inte studio B heller', r.blocksB===0, r.blocksB);
  ok('studion är fortfarande ledig', r.freeA===true);
  ok('förfrågan ger inga timmar', r.hours===0, r.hours);

  /* ============ 4 · GODKÄNNANDE ============ */
  log('\n── godkänna och avböja ──');
  r = await ev(w,`
    S.session.member='RKAY';
    doApprove('rq1','A');
    const b = S.bookings.find(x=>x.id==='rq1');
    return {studio:b.studio, status:b.status,
      nowBlocks: clash({studio:'A',date:'2026-11-10',start:'19:00',end:'20:00'},null).length,
      inBooked: booked().some(x=>x.id==='rq1')};`);
  ok('godkännandet sätter studio', r.studio==='A', r.studio);
  ok('och gör den till en bekräftad bokning', r.status==='', r.status);
  ok('nu blockerar den studion', r.nowBlocks===1, r.nowBlocks);
  ok('och räknas som bokad', r.inBooked===true);

  r = await ev(w,`
    /* upptagen tid ska nekas vid godkännandet */
    S.bookings.push({id:'rq2',studio:'',date:'2026-11-10',start:'19:00',end:'22:00',
      who:'RKAY',title:'x',note:'',circleId:'c1',status:'request',reqBy:'p1',
      hours:null,present:[],up:Date.now(),del:false,paid:false});
    save();
    const free = ['A','B'].filter(st=>freeAt(st,'2026-11-10','19:00','22:00','rq2'));
    doApprove('rq2','A');
    const blockedStays = S.bookings.find(x=>x.id==='rq2').status;   /* läs NU */
    doApprove('rq2','B');
    const b2 = S.bookings.find(x=>x.id==='rq2');
    return {free, blockedStays, otherWorks:b2.status, studio:b2.studio};`);
  ok('upptagen studio erbjuds inte', JSON.stringify(r.free)==='["B"]', r.free);
  ok('godkännande mot upptagen tid nekas', r.blockedStays==='request', r.blockedStays);
  ok('den lediga studion går att godkänna mot', r.otherWorks==='' && r.studio==='B', r);

  r = await ev(w,`
    S.bookings.push({id:'rq3',studio:'',date:'2026-12-01',start:'18:00',end:'21:00',
      who:'RKAY',title:'x',note:'',circleId:'c1',status:'request',reqBy:'p1',
      hours:null,present:[],up:Date.now(),del:false,paid:false});
    save();
    const b = S.bookings.find(x=>x.id==='rq3');
    Object.assign(b,{status:'declined',up:Date.now()}); save();
    return {inBooked: booked().some(x=>x.id==='rq3'),
      blocks: clash({studio:'A',date:'2026-12-01',start:'19:00',end:'20:00'},null).length,
      hours: hoursFor('p1')};`);
  ok('avböjd blir aldrig en bokning', r.inBooked===false);
  ok('avböjd blockerar ingen studio', r.blocks===0, r.blocks);
  ok('avböjd ger inga timmar', r.hours===0, r.hours);

  /* ============ 5 · TIMMAR BARA VIA LEDAREN ============ */
  log('\n── timmar ──');
  r = await ev(w,`
    S.session.member='RKAY';
    const b = S.bookings.find(x=>x.id==='rq1');
    Object.assign(b,{status:'done',hours:3,present:['p1'],completedBy:'RKAY',up:Date.now()});
    save();
    const after = {p1:hoursFor('p1'), p2:hoursFor('p2')};
    /* deltagaren har ingen väg att sätta timmar i gränssnittet */
    S.session.member='William Ek';
    const canAnswer = can('answerRequest', circleById('c1'));
    const canLead = can('leadCircle', circleById('c1'));
    const canReq = can('requestSession', circleById('c1'));
    S.session.member='AZ';
    return {after, canAnswer, canLead, canReq};`);
  ok('timmar landar på den närvarande', r.after.p1===3 && r.after.p2===0, r.after);
  ok('deltagaren kan inte svara på förfrågningar', r.canAnswer===false);
  ok('deltagaren kan inte leda cirkeln', r.canLead===false);
  ok('men får föreslå tider i sin egen cirkel', r.canReq===true);

  /* ============ 6 · BEFORDRAN ============ */
  log('\n── befordringssystemet ──');
  w = await boot(seed({bookings:[{id:'b1',studio:'A',date:'2026-11-20',start:'10:00',end:'12:00',
    who:'ADREY',title:'Pass',note:'',circleId:'',status:'',hours:null,present:[],
    up:1,del:false,paid:false}]}));
  r = await ev(w,`
    /* befordra en deltagare till cirkelledare */
    byId('p1').r='leader'; byId('p1').up=Date.now(); save();
    const promoted = byId('p1').r;
    /* namnbyte ska skriva om bokningar, filer och cirkelledarskap */
    const m = byId('adrey'); const old = m.n;
    S.bookings.forEach(b=>{ if(b.who===old){ b.who='AD'; } });
    S.circles.forEach(c=>{ if(c.leader===old){ c.leader='AD'; } });
    m.n='AD'; save();
    const renamed = S.bookings.find(b=>b.id==='b1').who;
    /* sista managern får inte degraderas */
    const mgrs = accounts().filter(a=>a.r==='manager').length;
    return {promoted, renamed, mgrs};`);
  ok('deltagare kan befordras till cirkelledare', r.promoted==='leader', r.promoted);
  ok('namnbyte skriver om bokningarna', r.renamed==='AD', r.renamed);
  ok('det finns exakt en manager att skydda', r.mgrs===1, r.mgrs);

  /* ============ 7 · SYNK ============ */
  log('\n── synk ──');
  w = await boot(seed());
  r = await ev(w,`
    const pay = JSON.parse(JSON.stringify(fullPayload()));
    return {hasAcc:!!pay.acc, accN:pay.acc.length,
      compatCrew: pay.crew.length, compatPe: pay.pe.length,
      accHasRole: pay.acc.every(a=>!!a.r)};`);
  ok('payload skickar acc med alla konton', r.hasAcc && r.accN===5, r.accN);
  ok('rollen följer med varje konto', r.accHasRole===true);
  ok('crew skickas fortfarande för v3-klienter (3)', r.compatCrew===3, r.compatCrew);
  ok('pe skickas fortfarande för v3-klienter (2)', r.compatPe===2, r.compatPe);

  w = await boot(seed());
  r = await ev(w,`
    /* en v3-payload utan acc ska läsas via crew + pe */
    mergeData({v:2, crew:[{id:'newp',n:'PKL',r:'producer',c:'#047857',g:'#34d399',
      email:'pkl@b.se',pinHash:'',pinSalt:'',active:true,up:9000}],
      pe:[{id:'newd',n:'Leo Native',email:'l@b.se',phone:'',active:true,del:false,up:9000}]});
    const crewIn = (byId('newp')||{}).r, peIn = (byId('newd')||{}).r;   /* läs NU */
    /* och en v4-payload med acc ska vinna på up */
    mergeData({v:2, acc:[{id:'newp',n:'PKL',r:'manager',c:'#047857',g:'#34d399',
      email:'pkl@b.se',phone:'',pinHash:'',pinSalt:'',active:true,del:false,up:99000}]});
    const promoted = byId('newp').r;
    mergeData({v:2, acc:[{id:'newp',n:'GAMMALT',r:'participant',active:true,del:false,up:1}]});
    const stays = byId('newp').n;
    return {crewIn, peIn, promoted, stays, total:accounts().length};`);
  ok('v3-crew läses in som konton', r.crewIn==='producer', r.crewIn);
  ok('v3-deltagare läses in som participant', r.peIn==='participant', r.peIn);
  ok('acc med nyare up vinner', r.promoted==='manager', r.promoted);
  ok('äldre post skriver inte över', r.stays==='PKL', r.stays);
  ok('inga dubbletter', r.total===7, r.total);

  /* ============ 8 · INLOGGNING UNDER BYGGET ============ */
  log('\n── inloggning under bygget ──');
  w = await boot(seed({session:null}));
  r = await ev(w,`
    const gateOn = document.getElementById('gate').classList.contains('on');
    const body = document.getElementById('gateBody').innerHTML;
    const tag  = document.getElementById('gateTag').innerHTML;
    const n = document.querySelectorAll('#gateBody .member').length;
    byId('adrey').active=false; save(); renderGate();
    const n2 = document.querySelectorAll('#gateBody .member').length;
    byId('adrey').active=true; save(); renderGate();
    const text = body.replace(/<[^>]+>/g,' ');
    return {gateOn, preview:/FÖRHANDSVISNING/.test(tag), n, total:activeAcc().length, n2,
      groups:['MANAGER','PRODUCENT','DELTAGARE'].every(g=>body.includes(g)),
      noPad:!/pinpad|pindots/.test(body), noCode:!/(^|[^a-zåäö])kod([^a-zåäö]|$)/i.test(text),
      noGoogle:!/Fortsätt med Google/.test(body),
      gone:['setPin','checkPin','sha256','pickPerson','submitPin','pinTap','lookupEmail',
            'googleLogin','claim','openSetPin','saveNewPin','clearPin','byEmail']
            .filter(f=>typeof window[f]!=='undefined')};`);
  ok('inloggningen visas utan session', r.gateOn===true);
  ok('sidan är märkt som förhandsvisning', r.preview===true);
  ok('alla aktiva konton går att välja', r.n===r.total, [r.n, r.total]);
  ok('kontona är grupperade per roll', r.groups===true);
  ok('avstängda konton syns inte', r.n2===r.n-1, [r.n, r.n2]);
  ok('ingen kodpanel', r.noPad===true);
  ok('ordet "kod" förekommer inte på sidan', r.noCode===true);
  ok('ingen Google-inloggning på sidan', r.noGoogle===true);
  ok('kodsystemets funktioner finns inte kvar', r.gone.length===0, r.gone);

  r = await ev(w,`
    const pick = n => [...document.querySelectorAll('#gateBody .member')].find(b=>b.textContent.includes(n));
    pick('AZ').click();
    const mgr = {member:S.session&&S.session.member, view:roleView(), via:S.session&&S.session.via,
      app:document.getElementById('app').style.display!=='none',
      gateOff:!document.getElementById('gate').classList.contains('on')};
    openMe();
    const prof = document.getElementById('sheetBody').innerHTML;
    signOut();                                   /* ingen bekräftelsedialog under bygget */
    const back = {gate:document.getElementById('gate').classList.contains('on'), session:S.session};
    pick('William').click();
    const part = {member:S.session&&S.session.member, view:roleView(),
      nav:document.getElementById('nav').style.display};
    openMe(); const pprof = document.getElementById('sheetBody').innerHTML; closeSheet();
    signOut();
    byId('adrey').active=false; save(); signIn(byId('adrey'));
    const blocked = !S.session;
    byId('adrey').active=true; save();
    return {mgr, back, part, blocked,
      prof:{switch:/BYT KONTO/.test(prof), code:/BYT KOD|SÄTT EN KOD/.test(prof)},
      pprof:{switch:/BYT KONTO/.test(pprof), code:/BYT KOD|SÄTT EN KOD/.test(pprof)}};`);
  ok('ett tryck loggar in managern med hela appen', r.mgr.member==='AZ' && r.mgr.view==='full' && r.mgr.app && r.mgr.gateOff, r.mgr);
  ok('sessionen är märkt som förhandsvisning', r.mgr.via==='preview', r.mgr.via);
  ok('BYT KONTO går direkt tillbaka till väljaren', r.back.gate===true && r.back.session===null, r.back);
  ok('deltagaren får sin enkla vy utan flikrad', r.part.member==='William Ek' && r.part.view==='participant' && r.part.nav==='none', r.part);
  ok('profilen har BYT KONTO och ingen kodknapp', r.prof.switch && !r.prof.code, r.prof);
  ok('även i den enkla vyn', r.pprof.switch && !r.pprof.code, r.pprof);
  ok('avstängt konto går inte att logga in på', r.blocked===true);

  /* gamla kodhashar ska rensas, inte ligga kvar och synkas runt */
  w = await boot(seed({session:null, crew:CREW.map(c=>Object.assign({},c,{pinHash:'gammal',pinSalt:'s'}))}));
  r = await ev(w,`
    const local = S.accounts.some(a=>'pinHash' in a || 'pinSalt' in a);
    mergeData({v:2, acc:[{id:'rkay',n:'RKAY',r:'producer',c:'#7c3aed',g:'#a855f7',email:'',
      pinHash:'från-äldre-klient',pinSalt:'x',active:true,del:false,up:99999}]});
    const merged = 'pinHash' in byId('rkay');
    const pay = JSON.stringify(fullPayload());
    return {local, merged, inPayload:/pinHash|pinSalt/.test(pay)};`);
  ok('sparade kodhashar rensas vid start', r.local===false);
  ok('kodhashar från en äldre telefon tas inte emot', r.merged===false);
  ok('inga kodfält skickas i synken', r.inPayload===false);

  /* ============ 9 · VYERNA RENDERAR ============ */
  log('\n── vyerna renderar ──');
  w = await boot(seed({bookings:[
    {id:'s1',studio:'A',date:'2026-11-10',start:'18:00',end:'21:00',who:'RKAY',title:'Grupp 1',
     note:'',circleId:'c1',status:'done',hours:3,present:['p1'],completedBy:'RKAY',up:1,del:false,paid:false},
    {id:'s2',studio:'',date:'2027-01-10',start:'18:00',end:'21:00',who:'RKAY',title:'Grupp 1',
     note:'',circleId:'c1',status:'request',reqBy:'p1',hours:null,present:[],up:1,del:false,paid:false}]}));
  r = await ev(w,`
    const res={};
    const check = (who, role) => {
      const acc = byName(who);
      if(role && acc) acc.r = role;
      S.session.member = who;
      try{ render(); const h=document.getElementById('view').innerHTML;
        return {len:h.length, html:h}; }
      catch(e){ return {err:e.message}; }
    };
    const part = check('William Ek','participant');
    const lead = check('ADREY','leader');
    S.circles[0].leader='ADREY';
    const lead2 = check('ADREY','leader');
    const cust = check('Nora Lind','customer');
    S.circles[0].leader='RKAY';
    S.session.member='AZ';
    return {
      part:{len:part.len, err:part.err,
        hasCurr:/Arrangemang/.test(part.html||''), hasBook:/FÖRESLÅ EN TID/.test(part.html||''),
        hasHours:/480/.test(part.html||''), noSchedule:!/RESTEN AV VECKAN/.test(part.html||''),
        noFiles:!/Lägg in ditt arbete/.test(part.html||'')},
      lead:{len:lead2.len, err:lead2.err,
        hasReq:/VÄNTAR PÅ DIG/.test(lead2.html||''), hasMembers:/William Ek/.test(lead2.html||''),
        noCrew:!/STUDIOBELÄGGNING/.test(lead2.html||'')},
      cust:{len:cust.len, err:cust.err, hasBook:/LEDIGA TIDER/.test(cust.html||''),
        noCircles:!/läroplan/i.test(cust.html||'')},
      navHidden: document.getElementById('nav').style.display};`);
  ok('deltagarvyn renderar', !r.part.err && r.part.len>300, r.part.err||r.part.len);
  ok('deltagaren ser läroplanen', r.part.hasCurr===true);
  ok('och kan föreslå en tid', r.part.hasBook===true);
  ok('och ser sina timmar', r.part.hasHours===true);
  ok('men INTE schemat', r.part.noSchedule===true);
  ok('och INTE filerna', r.part.noFiles===true);
  ok('ledarvyn renderar', !r.lead.err && r.lead.len>300, r.lead.err||r.lead.len);
  ok('ledaren ser förfrågningarna', r.lead.hasReq===true);
  ok('och sina deltagare', r.lead.hasMembers===true);
  ok('men INTE crewets studiostatistik', r.lead.noCrew===true);
  ok('kundvyn renderar med lediga tider', !r.cust.err && r.cust.hasBook===true, r.cust.err);
  ok('kunden ser ingen läroplan', r.cust.noCircles===true);

  r = await ev(w,`
    S.session.member='AZ';
    const res={};
    for(const v of ['today','week','agenda','beats','more','artists','goals','circles','team','dash']){
      try{ go(v); const h=document.getElementById('view').innerHTML;
        res[v]= h.length>200?'ok':'tunn:'+h.length; }catch(e){ res[v]='KRASCH: '+e.message; }
    }
    let sheets='ok';
    try{ openCrewAdmin(); closeSheet(); openAccount(); closeSheet(); openAccount('rkay'); closeSheet();
      openMe(); closeSheet(); openRates(); closeSheet(); openStudios(); closeSheet();
