<meta charset="utf-8"><title>shot</title>
<style>html,body{margin:0;background:#07050c}iframe{border:0;display:block;margin:0 auto}</style>
<iframe id="fr"></iframe>
<script src="../demo.js"></script>
<script>
const P=new URLSearchParams(location.search), fr=document.getElementById('fr');
fr.style.height=(P.get('h')||844)+'px'; fr.style.width=(P.get('w')||390)+'px';
const S = bandohqDemo({who:P.get('as')||'AZ', gate:P.get('gate'), leads:P.get('leads'), dbx:P.get('dbx'),
  join:P.get('join'), jrole:P.get('jrole')});
localStorage.clear();
localStorage.setItem('bandosesh_v2', JSON.stringify(S));
localStorage.setItem('bandosesh_cloud', JSON.stringify(P.get('cloud') ? {url:'http://localhost:8738', key:'anon-test-key'} : {url:'', key:''}));
if(P.get('dbx')) localStorage.setItem('bandosesh_dbx', JSON.stringify({access:'mock',refresh:'mock',exp:Date.now()+864e5,root:'/bandosesh'}));
fr.onload=()=>setTimeout(()=>{
  try{
    const w=fr.contentWindow;
    if(P.get('mode')) w.eval(`gateMode='${P.get('mode')}';renderGate()`);
    if(P.get('dbx') && w.__mockDbx){ S.beats.forEach(b=>{ w.__mockDbx.f[b.fileId]={id:b.fileId,name:b.file,path:b.path,size:b.size}; });
      S.media.forEach(m=>{ w.__mockDbx.f[m.fileId]={id:m.fileId,name:m.file,path:m.path,size:m.size}; }); }
    if(P.get('tab')) w.eval(`go('${P.get('tab')}')`);
    if(P.get('circle')) w.eval(`openCircleView('${P.get('circle')}')`);
    if(P.get('sheet')) w.eval(P.get('sheet'));
  }catch(e){ document.title='ERR '+e.message; }
  setTimeout(()=>document.title='READY',300);
},600);
/* page=access: registreringssidan (BANDO HQ ACCESS) i stället för appen; scroll=px rullar ner */
if(P.get('scroll')) fr.addEventListener('load', ()=>setTimeout(()=>{ try{ fr.contentWindow.scrollTo(0, +P.get('scroll')); }catch(e){} }, 400));
fr.src = P.get('page')==='access' ? '../access.html?static=1&cb='+Math.random()
  : '../index.html?mock=1&cb='+Math.random()+(P.get('join')?'#join='+P.get('join'):'');
</script>
