<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bando Foundation · HQ</title>
<meta name="theme-color" content="#0b090e">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/barlow-condensed-800.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* BANDO FOUNDATION — arbetsytan i BANDO HQ (fas 1). Samma konton och inloggning som studion,
   samma designsystem (DESIGN.md): natten i studion, en rosa accent, skylten bara i vyns rubrik,
   handlingar som meningar, etiketter och status som små lugna versaler. Telefon först. */
@font-face { font-family: "Barlow Condensed"; src: url("fonts/barlow-condensed-800.woff2") format("woff2"); font-weight: 800; font-display: block; }
@font-face { font-family: "Barlow"; src: url("fonts/barlow-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Barlow"; src: url("fonts/barlow-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Barlow"; src: url("fonts/barlow-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
:root{
  --bg:#0b090e; --surface:#141119; --surface2:#1a1620;
  --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.13); --line3:rgba(255,255,255,.05);
  --r:16px; --r-sm:12px; --r-pill:999px; --navW:236px;
  --pink:#ff3ebf; --tube:#ff6ad8; --btn:#d01b8c; --btn-hover:#b9167f; --glow:rgba(255,62,191,.5);
  --txt:#f3eff7; --mut:#a39bae; --mut2:#6f6779;
  --ok2:#34d399; --warn:#fab219; --bad2:#fb7185;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --sans:"Barlow","Helvetica Neue",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --disp:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:clip;
  padding-bottom:calc(86px + var(--safeB));-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
h1,h2,h3,p{margin:0}
.nums{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- topp och meny ---------- */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safeT)) 16px 10px;
  background:rgba(11,9,14,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.brand{font:800 19px/1 var(--disp);letter-spacing:.05em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.brand span{color:var(--tube)}
.top .grow{flex:1}
.iconbtn{position:relative;flex:none;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.06);display:grid;place-items:center;
  transition:transform .15s var(--ease)}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:2px;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--btn);color:#fff;
  font-size:11px;font-weight:600;line-height:18px;text-align:center}
.av{flex:none;display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:rgba(255,106,216,.14);color:var(--txt);
  font-weight:600;font-size:13px}
.av.lg{width:44px;height:44px;font-size:16px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;justify-content:space-around;padding:8px 6px calc(8px + var(--safeB));
  background:rgba(11,9,14,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;text-decoration:none;color:var(--mut);
  font-size:10.5px;font-weight:600;border-radius:var(--r-sm);transition:transform .15s var(--ease)}
nav a:active{transform:scale(.95)}
nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a.on{color:#fff}
nav a.on svg{stroke:var(--tube)}
nav .brand,nav .nsep,nav a.dsk{display:none}

main{padding:4px 16px 40px;max-width:1120px;margin:0 auto}
.h1{font:800 clamp(34px,10vw,46px)/1.02 var(--disp);text-transform:uppercase;letter-spacing:.02em;margin:14px 0 6px;overflow-wrap:anywhere}
.h1 .tube{color:transparent;-webkit-text-stroke:1.5px var(--tube)}
.sub{color:var(--mut);font-size:15px}
.back{display:inline-flex;align-items:center;gap:6px;margin-top:10px;color:var(--mut);font-size:14px;text-decoration:none}
.back:active{opacity:.55}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:30px 2px 10px}
.eyebrow .n{margin-left:auto;letter-spacing:.02em}
.eyebrow a{margin-left:auto;text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--tube);text-decoration:none}

/* ---------- kort och rader ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:13px 14px;text-decoration:none;color:inherit;transition:transform .15s var(--ease),background-color .15s}
.item:active{transform:scale(.985)}
@media (hover:hover) and (pointer:fine){ .item:hover{background:var(--surface2)} }
.item.attn{border-color:rgba(255,106,216,.32)}
.item .grow{flex:1;min-width:0}
.item b{display:block;font-weight:600;overflow-wrap:anywhere}
.item em{display:block;font-style:normal;color:var(--mut);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.item .side{flex:none;text-align:right;font-size:13px;color:var(--mut)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;box-shadow:inset 0 0 0 1px var(--line2);color:var(--txt);white-space:nowrap}
.pill.warn{color:var(--warn);box-shadow:inset 0 0 0 1px rgba(250,178,25,.42)}
.pill.ok{color:var(--ok2);box-shadow:inset 0 0 0 1px rgba(52,211,153,.42)}
.pill.live{color:var(--tube);box-shadow:inset 0 0 0 1px rgba(255,106,216,.5)}
.pill.bad{color:var(--bad2);box-shadow:inset 0 0 0 1px rgba(251,113,133,.45)}
.pill.mute{color:var(--mut)}
.dept{flex:none;display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.06);
  font:800 16px/1 var(--disp);color:var(--txt)}
.dept.sm{width:22px;height:22px;font-size:12.5px}
.empty{color:var(--mut);font-size:15px;padding:18px 4px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line3);font-size:15px}
.kv:first-child{border-top:0}
.kv>span{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding-top:3px;flex:none}
.kv>b{font-weight:500;text-align:right;overflow-wrap:anywhere}
.prose{white-space:pre-wrap;overflow-wrap:anywhere}
.okbox,.warnbox,.infobox{border-radius:var(--r-sm);padding:12px 14px;font-size:15px;margin-top:12px}
.okbox{border:1px solid rgba(52,211,153,.2);background:rgba(52,211,153,.07)}
.warnbox{border:1px solid rgba(250,178,25,.25);background:rgba(250,178,25,.07)}
.infobox{border:1px solid rgba(255,106,216,.25);background:rgba(255,62,191,.07)}

/* ---------- knappar, flikar, chips och fält ---------- */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:13px 18px;border:0;
  border-radius:var(--r-pill);background:var(--btn);color:#fff;font:600 15.5px var(--sans);text-decoration:none;
  transition:transform .15s var(--ease),background-color .15s}
.btn:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){ .btn:not(:disabled):hover{background:var(--btn-hover)} .btn.ghost:not(:disabled):hover{background:rgba(255,255,255,.1)} }
.btn.ghost{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.16);color:var(--txt)}
.btn.danger{background:rgba(251,113,133,.05);border:1px solid rgba(251,113,133,.38);color:var(--bad2)}
.btn.slim{min-height:40px;padding:8px 16px;font-size:14px;width:auto}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center}
.row>.btn{flex:1}
.row>.btn.slim{flex:none}
.linkbtn{background:none;border:0;padding:0;color:var(--tube);font-size:14px;text-decoration:none}
.linkbtn:active{opacity:.55}
.seg{display:flex;background:rgba(255,255,255,.045);border-radius:var(--r-pill);padding:3px;margin:14px 0 4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:none;border-radius:var(--r-pill);padding:9px 12px;font-size:13.5px;font-weight:600;color:var(--mut);white-space:nowrap}
.seg button.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:7px 14px;border-radius:var(--r-pill);
  border:1px solid rgba(255,255,255,.14);background:none;font-size:13.5px;font-weight:600;color:var(--txt);transition:transform .15s var(--ease)}
.chip:active{transform:scale(.96)}
.chip.on{background:rgba(255,62,191,.16);border-color:rgba(255,106,216,.5);color:#fff}
.chip .n{color:var(--mut);font-weight:500}
label.lbl{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:18px 2px 8px}
input,textarea,select{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:var(--r-sm);
  padding:12px 14px;font:16px var(--sans);color:var(--txt);outline:none}
textarea{min-height:92px;resize:vertical;line-height:1.45}
input:focus,textarea:focus,select:focus{border-color:rgba(255,106,216,.65);box-shadow:0 0 0 3px rgba(255,62,191,.15)}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
  background-position:calc(100% - 20px) 52%,calc(100% - 14px) 52%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
select option{background:#141119}
input[type=checkbox]{width:20px;height:20px;flex:none;padding:0;accent-color:var(--tube)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:15px}
.hint{color:var(--mut);font-size:13.5px;margin-top:6px}
.err{color:var(--bad2);font-size:14px;margin-top:10px;min-height:1px}
fieldset{border:0;padding:0;margin:0;min-width:0}
details.more{margin-top:18px;border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 14px 14px}
details.more summary{cursor:pointer;padding:10px 0 4px;font-weight:600;font-size:15px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:" +";color:var(--tube)}
details.more[open] summary::after{content:" −"}

/* ---------- överlämningens steg ---------- */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:16px 0 4px;list-style:none;padding:0}
.steps li{position:relative;padding-top:12px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut2)}
.steps li::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;border-radius:999px;background:rgba(255,255,255,.08)}
.steps li.done{color:var(--mut)}
.steps li.done::before{background:rgba(255,106,216,.45)}
.steps li.now{color:#fff}
.steps li.now::before{background:var(--tube);box-shadow:0 0 12px -2px var(--glow)}
.steps small{display:block;font-weight:500;letter-spacing:0;text-transform:none;color:var(--mut);font-size:12px;margin-top:2px}

/* ---------- meddelanden ---------- */
.msgs{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.msg{max-width:min(560px,88%);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 13px}
.msg.mine{align-self:flex-end;background:rgba(255,62,191,.1);border-color:rgba(255,106,216,.22)}
.msg .who{display:flex;gap:8px;font-size:12.5px;color:var(--mut);margin-bottom:2px}
.msg .who b{color:var(--txt);font-weight:600}
.msg .body{white-space:pre-wrap;overflow-wrap:anywhere}
.mention{color:var(--tube);font-weight:600}
.composer{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.composer textarea{min-height:64px}
.mentions{display:flex;flex-wrap:wrap;gap:6px}
.unread{display:inline-block;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--btn);color:#fff;font-size:11.5px;font-weight:600;line-height:20px;text-align:center}

/* ---------- ark, besked ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(5,4,8,.6);opacity:0;pointer-events:none;transition:opacity .28s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
  background:#141119;border-radius:22px 22px 0 0;border-top:1px solid rgba(255,255,255,.1);padding:22px 18px calc(24px + var(--safeB));
  transform:translateY(105%);transition:transform .28s var(--ease-drawer);visibility:hidden}
.sheet.on{transform:translateY(0);transition-duration:.42s;visibility:visible}
.sheet h2{font:800 27px/1.08 var(--disp);text-transform:uppercase;letter-spacing:.02em;padding-right:44px;margin-bottom:4px}
.sheet .x{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.07);display:grid;place-items:center}
.sheet .x svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none}
.sheet .btn{margin-top:22px}
.toast{position:fixed;left:50%;bottom:calc(98px + var(--safeB));z-index:90;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#1f1a27;border:1px solid var(--line2);border-radius:999px;padding:12px 20px;font-size:15px;max-width:calc(100vw - 32px);
  transition:opacity .2s,transform .28s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.skel{height:64px;border-radius:var(--r);background:linear-gradient(90deg,rgba(255,255,255,.03),rgba(255,255,255,.06),rgba(255,255,255,.03));margin-bottom:8px}

.grid2,.grid3{display:block}
.gate{max-width:440px;margin:18vh auto 0;padding:0 20px;text-align:center}
.gate .btn{margin-top:22px}
.ai{position:relative;overflow:hidden}
.ai input{margin-top:10px}
.stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.stat div{background:rgba(255,255,255,.035);border-radius:var(--r-sm);padding:8px 10px}
.stat b{display:block;font:600 20px/1.1 var(--sans);font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:10.5px;font-weight:600;letter-spacing:.04em;line-height:1.25;text-transform:uppercase;color:var(--mut);overflow-wrap:anywhere;hyphens:auto}
.upd{display:grid;gap:10px;margin-top:4px}
.upd div{border-top:1px solid var(--line3);padding-top:10px}
.upd div:first-child{border-top:0;padding-top:0}
.upd span{display:block;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.upd p{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.upd p.none{color:var(--mut2)}
.doc{display:flex;gap:12px;align-items:center}
.mdbody{margin-top:10px;font-size:15.5px;line-height:1.55;overflow-wrap:anywhere}
.mdbody p{margin:6px 0}
.mdh1{font:800 22px/1.1 var(--disp);text-transform:uppercase;letter-spacing:.02em;margin:18px 0 6px;color:#fff}
.mdh2{font-weight:600;margin:14px 0 4px;color:var(--txt)}
.mdl{margin:6px 0 6px 18px;padding:0}
.mdl li{margin:3px 0}
.doc .ic{flex:none;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--mut)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:0 8px 8px}
.tbl td{padding:9px 8px;border-top:1px solid var(--line3);vertical-align:top}
.scrollx{overflow-x:auto}

@media (min-width:1024px){
  body{padding:0 0 0 var(--navW)}
  .top{padding:14px 32px;background:rgba(11,9,14,.9)}
  .top .brand{display:none}
  nav{top:0;right:auto;bottom:0;width:var(--navW);flex-direction:column;justify-content:flex-start;gap:2px;padding:22px 14px;
    border-top:0;border-right:1px solid var(--line)}
  nav .brand{display:block;padding:4px 10px 22px;font-size:21px}
  nav .nsep{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);padding:20px 12px 8px}
  nav a{flex:none;flex-direction:row;gap:12px;padding:10px 12px;font-size:14.5px;font-weight:500}
  nav a.dsk{display:flex}
  nav a.mob{display:none}
  nav a.on{background:rgba(255,255,255,.06)}
  main{padding:0 32px 60px}
  .h1{font-size:52px;margin-top:6px}
  .grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .grid3 .item{height:100%}
  .sheet{left:auto;top:8px;bottom:8px;right:0;width:480px;max-height:none;border-radius:22px 0 0 22px;border-top:0;
    border-left:1px solid rgba(255,255,255,.08);transform:translateX(105%);padding:30px 28px}
  .sheet.on{transform:translateX(0)}
  .toast{bottom:28px}
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important} }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#hq">Bando <span>Foundation</span></a>
  <div class="grow"></div>
  <button class="iconbtn" id="bell" aria-label="Notiser" onclick="openNotes()"><svg viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></button>
  <button class="iconbtn" id="meBtn" aria-label="Du" onclick="openMe()"></button>
</header>
<nav id="nav" style="display:none"></nav>
<main id="view"><div class="skel" style="margin-top:24px"></div><div class="skel"></div><div class="skel"></div></main>
<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ===================== SERVERN (samma som studion) =====================
   Samma Supabase, samma konto: sessionen som index.html sparat i bandosesh_auth. Tester pekar
   om servern via bandosesh_cloud (bara samma webbplats kan sätta den). */
const CLOUD_CONFIG = { url: 'https://gwvtqrbrkkfgyesamcfy.supabase.co', key: 'sb_publishable_jdhJX4ns98mvM2qSuUFCQg_rRUvmxpf' };
const ls = k => { try{ return JSON.parse(localStorage.getItem(k) || 'null'); }catch(e){ return null; } };
const CLOUD = Object.assign({}, CLOUD_CONFIG, ls('bandosesh_cloud') || {});
CLOUD.url = String(CLOUD.url || '').replace(/\/$/, '');
let AUTH = ls('bandosesh_auth');
function saveAuth(a){ AUTH = a; try{ a ? localStorage.setItem('bandosesh_auth', JSON.stringify(a)) : localStorage.removeItem('bandosesh_auth'); }catch(e){} }
function toLogin(){
  /* länken från en notis följer med genom inloggningen */
  try{ if(location.hash.length > 1) sessionStorage.setItem('fd_next', location.hash); }catch(e){}
  location.replace('index.html');
}
/* En inbjudningslänk (#join=KOD): ny person → studions vanliga join-sida (konto och lösenord);

async function sbErr(r){
  let m = 'Servern svarade ' + r.status;
  try{ const j = await r.json(); m = j.message || j.msg || j.error_description || j.error || m; }catch(e){}
  if(/row-level security|violates/i.test(m)) m = 'Du har inte behörighet till det här';
  return m;
}
const jwtSub = t => { try{ return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub; }catch(e){ return null; } };
async function token(){
  if(AUTH.expires_at - Date.now() > 60000) return AUTH.access_token;
  const r = await fetch(CLOUD.url + '/auth/v1/token?grant_type=refresh_token', {method:'POST',
    headers:{apikey:CLOUD.key, 'Content-Type':'application/json'}, body:JSON.stringify({refresh_token:AUTH.refresh_token})});
  if(!r.ok){ saveAuth(null); toLogin(); throw new Error('Inloggningen har gått ut'); }
  const j = await r.json();
  saveAuth(Object.assign({}, AUTH, {access_token:j.access_token, refresh_token:j.refresh_token, expires_at:Date.now() + (j.expires_in||3600)*1000, uid:jwtSub(j.access_token)}));
  return AUTH.access_token;
}
async function sb(path, opts){
  const o = Object.assign({}, opts || {});
  o.headers = Object.assign({apikey:CLOUD.key, Authorization:'Bearer ' + await token(), 'Content-Type':'application/json'}, o.headers || {});
  const r = await fetch(CLOUD.url + '/rest/v1' + path, o);
  if(!r.ok) throw new Error(await sbErr(r));
  const t = r.status === 204 ? '' : await r.text();
  return t ? JSON.parse(t) : null;
}
const get = p => sb(p);
const rpc = (fn, args) => sb('/rpc/' + fn, {method:'POST', body:JSON.stringify(args || {})});
const insert = (table, row) => sb('/' + table, {method:'POST', headers:{Prefer:'return=representation'}, body:JSON.stringify(row)}).then(r => r && r[0]);
const patch = (table, id, row) => sb('/' + table + '?id=eq.' + encodeURIComponent(id), {method:'PATCH', headers:{Prefer:'return=representation'}, body:JSON.stringify(row)}).then(r => r && r[0]);
const del = (table, id) => sb('/' + table + '?id=eq.' + encodeURIComponent(id), {method:'DELETE'});
async function storage(method, path, body, type){
  const r = await fetch(CLOUD.url + '/storage/v1/object/' + path, {method, body,
    headers:Object.assign({apikey:CLOUD.key, Authorization:'Bearer ' + await token()}, type ? {'Content-Type':type} : {})});
  if(!r.ok) throw new Error(await sbErr(r));
  return r.json();
}

  if(s < t){ const n = Math.round((new Date(t + 'T12:00') - new Date(s + 'T12:00')) / 864e5); return 'Försenad ' + n + ' d'; }

function taskRow(t){
  const late = t.due && t.due < TODAY() && t.status !== 'done';
  return `<a class="item" href="#task-${attr(t.id)}" data-task="${attr(t.id)}">
    <span class="dept sm" title="${attr(dept(t.dept).name)}">${esc(t.dept)}</span>
    <span class="grow"><b>${esc(t.title)}</b><em>${t.assignee ? esc(pname(t.assignee)) : 'Ingen ansvarig'}${t.handover_id ? ' · från en överlämning' : ''}</em>
      <span class="meta"><span class="pill ${TSC[t.status]}">${TS[t.status]}</span>${t.due ? `<span class="pill ${late?'bad':'mute'}">${esc(dueText(t.due))}</span>` : ''}${t.protected ? '<span class="pill mute">Skyddad</span>' : ''}</span></span></a>`;
}
function handoverRow(h){
  const mine = canReceive(h), waitingOther = h.status === 'sent' && isOutgoing(h);
  return `<a class="item${mine ? ' attn' : ''}" href="#handover-${attr(h.id)}" data-ho="${attr(h.id)}">
    <span class="dept sm">${esc(h.from_dept)}</span>
    <span class="grow"><b>${esc(h.subject)}</b><em>${esc(h.from_dept)} → ${esc(h.to_dept)}${h.to_member ? ' · ' + esc(pname(h.to_member)) : ''}</em>
      <span class="meta"><span class="pill ${HSC[h.status]}">${HS[h.status]}</span>${mine ? '<span class="pill live">Bekräfta mottagandet</span>' : ''}${waitingOther ? '<span class="pill mute">Väntar på mottagaren</span>' : ''}${h.due && h.status !== 'done' ? `<span class="pill ${h.due < TODAY() ? 'bad' : 'mute'}">${esc(dueText(h.due))}</span>` : ''}${h.protected ? '<span class="pill mute">Skyddad</span>' : ''}</span></span></a>`;
}
function deptRow(c){
  const d = dept(c), ch = chiefOf(c), u = upd(c);
  return `<a class="item" href="#dept-${attr(c)}"><span class="dept">${esc(c)}</span>
    <span class="grow"><b>${esc(d.name)}</b><em>${ch ? 'Chef: ' + esc(ch.name) : d.has_chief === false ? 'Gemensam redaktion' : 'Ingen chef utsedd'} · ${nt(deptPeople(c).length, 'person', 'personer')}</em>
    ${u.working_on ? `<em style="margin-top:6px;color:var(--txt)">Nu: ${esc(u.working_on.slice(0, 110))}${u.working_on.length > 110 ? '…' : ''}</em>` : ''}</span></a>`;
}
function docRow(d){
  const ext = d.kind === 'link' ? 'Länk' : (String(d.name).split('.').pop() || 'Fil').slice(0, 4).toUpperCase();
  return `<div class="item doc"><span class="ic">${esc(ext)}</span>
    <span class="grow"><b>${esc(d.name)}</b><em>${esc(ownerLabel(d))} · ${esc(pname(d.uploaded_by))} · ${when(d.created_at)}</em></span>
    <button class="btn ghost slim" onclick="openDoc('${attr(d.id)}')">Öppna</button></div>`;
}
function ownerLabel(d){
  if(d.owner_type === 'task'){ const t = task(d.owner_id); return t ? 'Uppgift: ' + t.title : 'Uppgift'; }
  if(d.owner_type === 'handover'){ const h = handover(d.owner_id); return h ? 'Överlämning: ' + h.subject : 'Överlämning'; }
  if(d.owner_type === 'project'){ const t = thread(d.owner_id); return t ? 'Projekt: ' + t.title : 'Projekt'; }
  const c = contact(d.owner_id); return c ? 'Kontakt: ' + c.name : 'Kontakt';
}

/* ===================== UPPGIFTER ===================== */
let tFilter = 'mine', tStatus = 'open';
function vTasks(){
  const chips = [['mine','Mina'], ['all','Alla jag ser']].concat((isAdmin() ? F.depts.map(d => d.code) : myDepts()).map(c => [c, 'Avdelning ' + c]));
  let list = F.tasks.filter(t => tFilter === 'mine' ? t.assignee === myId() || t.created_by === myId() : tFilter === 'all' ? true : t.dept === tFilter);
  list = list.filter(t => tStatus === 'open' ? t.status !== 'done' : t.status === tStatus);
  list.sort((a, b) => (a.due || '9999') < (b.due || '9999') ? -1 : 1);
  return `
    <div class="h1">Uppgifter</div>
    <p class="sub">Det som ska göras, vem som gör det och när.</p>
    <div class="chips">${chips.map(([k, l]) => `<button class="chip ${tFilter===k?'on':''}" onclick="tFilter='${k}';paint()">${esc(l)}</button>`).join('')}</div>
    <div class="seg">${[['open','Öppna'],['todo','Att göra'],['doing','Pågår'],['waiting','Väntar'],['done','Klar']].map(([k, l]) => `<button class="${tStatus===k?'on':''}" onclick="tStatus='${k}';paint()">${l}</button>`).join('')}</div>
    ${(isAdmin() || myDepts().length) ? `<div style="margin:14px 0"><button class="btn" id="newTask" onclick="openTaskForm()">Ny uppgift</button></div>` : ''}
    <div class="list grid3" id="tasklist">${list.length ? list.map(taskRow).join('') : '<div class="empty">Inga uppgifter här.</div>'}</div>`;
}
function peopleOptions(sel, filterDept){
  const ppl = F.people.filter(p => (p.depts||[]).length || p.admin).filter(p => !filterDept || (p.depts||[]).some(d => d.dept === filterDept));
  return `<option value="">Ingen ansvarig än</option>` + ppl.map(p => `<option value="${attr(p.id)}" ${p.id === sel ? 'selected' : ''}>${esc(p.name)}${(p.depts||[]).length ? ' · ' + p.depts.map(d => d.dept).join('') : ''}</option>`).join('');
}
function deptOptions(sel, onlyMine){
  const list = onlyMine && !isAdmin() ? F.depts.filter(d => inDept(d.code)) : F.depts;
  return list.map(d => `<option value="${d.code}" ${d.code === sel ? 'selected' : ''}>${d.code} · ${esc(d.name)}</option>`).join('');
}
function openTaskForm(from){
  const h = from ? handover(from) : null;
  const d0 = h ? h.to_dept : (myDepts()[0] || 'A');
  openSheet(`<h2>Ny uppgift</h2>${h ? `<p class="sub">Från överlämningen "${esc(h.subject)}".</p>` : ''}
    <label class="lbl" for="tT">Vad ska göras?</label><input id="tT" maxlength="160" autocomplete="off">
    <label class="lbl" for="tD">Beskrivning</label><textarea id="tD"></textarea>
    <label class="lbl" for="tDept">Avdelning</label><select id="tDept" onchange="$('tA').innerHTML=peopleOptions($('tA').value)">${deptOptions(d0, true)}</select>
    <label class="lbl" for="tA">Ansvarig</label><select id="tA">${peopleOptions(h ? h.to_member || myId() : myId())}</select>
    <label class="lbl" for="tDue">Deadline</label><input id="tDue" type="date">
    ${F.me.protected ? `<label class="check"><input type="checkbox" id="tP"><span>Skyddad uppgift. Bara de med behörighet för skyddade uppgifter ser den, inte heller admin.</span></label>` : ''}
    <div class="err" id="tErr"></div>
    <button class="btn" id="tSave" onclick="saveTask(${h ? `'${attr(h.id)}'` : 'null'})">Skapa uppgiften</button>`);
  setTimeout(() => $('tT').focus(), 60);
}
async function saveTask(hid){
  const title = $('tT').value.trim();
  if(title.length < 2){ $('tErr').textContent = 'Skriv vad som ska göras.'; return; }
  const h = hid ? handover(hid) : null;
  $('tSave').disabled = true;
  try{
    const t = await insert('fd_tasks', {dept:$('tDept').value, title, description:$('tD').value.trim(), assignee:$('tA').value || null,
      due:$('tDue').value || null, created_by:myId(), handover_id:hid || null, contact_id:h ? h.contact_id : null, protected:!!($('tP') && $('tP').checked)});
    closeSheet(); toast('Uppgiften är skapad'); await loadAll(); go('task-' + t.id);
  }catch(e){ $('tErr').textContent = e.message; $('tSave').disabled = false; }
}
function vTask(){
  const t = task(arg);
  if(!t) return notFound('Uppgiften');
  const canEdit = canDept(t.dept) || t.assignee === myId() || t.created_by === myId();

    <div class="h1">${esc(t.title)}</div>
    <div class="meta"><span class="pill ${TSC[t.status]}">${TS[t.status]}</span><span class="pill mute">Avdelning ${esc(t.dept)}</span>${t.protected ? '<span class="pill mute">Skyddad</span>' : ''}</div>
    <div class="grid2"><div>
      ${canEdit ? `<div class="seg" id="tStatus">${Object.keys(TS).map(k => `<button class="${t.status===k?'on':''}" onclick="setTaskStatus('${attr(t.id)}','${k}')">${TS[k]}</button>`).join('')}</div>` : ''}
      <div class="card" style="margin-top:12px">
        <div class="kv"><span>Ansvarig</span><b>${t.assignee ? esc(pname(t.assignee)) : 'Ingen än'}</b></div>
        <div class="kv"><span>Deadline</span><b>${t.due ? esc(dueWhen(t.due)) : 'Ingen'}</b></div>
        <div class="kv"><span>Avdelning</span><b>${esc(t.dept)} · ${esc(dept(t.dept).name)}</b></div>
        <div class="kv"><span>Skapad av</span><b>${esc(pname(t.created_by))} · ${when(t.created_at)}</b></div>
        ${h ? `<div class="kv"><span>Överlämning</span><b><a class="linkbtn" href="#handover-${attr(h.id)}">${esc(h.subject)}</a></b></div>` : ''}
        ${c ? `<div class="kv"><span>Kontakt</span><b>${esc(c.name)}</b></div>` : ''}
      </div>
      ${t.description ? `<div class="eyebrow">Beskrivning</div><div class="card prose">${esc(t.description)}</div>` : ''}
      ${canEdit ? `<div class="row" style="margin-top:12px"><button class="btn ghost slim" onclick="openAssign('${attr(t.id)}')">Byt ansvarig</button></div>` : ''}
      ${docsBlock('task', t.id, t.dept, canEdit)}
    </div><div>
      ${commentsBlock('task', t.id)}
    </div></div>`;
}
async function setTaskStatus(id, s){
  try{ await patch('fd_tasks', id, {status:s}); await loadAll(); paint(); toast('Status: ' + TS[s]); }catch(e){ toast(e.message); }
}
function openAssign(id){
  const t = task(id);
  openSheet(`<h2>Byt ansvarig</h2><p class="sub">${esc(t.title)}</p>
    <label class="lbl" for="aA">Ansvarig</label><select id="aA">${peopleOptions(t.assignee)}</select>

async function saveAssign(id){

  catch(e){ $('aErr').textContent = e.message; }
}

/* ===================== ÖVERLÄMNINGAR ===================== */
let hTab = 'in';
function vHandovers(){
  const inc = F.handovers.filter(deptIn), out = F.handovers.filter(deptOut);
  const list = hTab === 'in' ? inc : hTab === 'out' ? out : F.handovers;
  const sorted = list.slice().sort((a, b) => (a.status === 'done') - (b.status === 'done') || (a.created_at < b.created_at ? 1 : -1));
  return `
    <div class="h1">Överlämningar</div>
    <p class="sub">Ett ärende som båda avdelningarna följer. Mottagaren bekräftar att den tagit över.</p>
    <div class="seg"><button class="${hTab==='in'?'on':''}" onclick="hTab='in';paint()">Inkommande</button><button class="${hTab==='out'?'on':''}" onclick="hTab='out';paint()">Skickade</button><button class="${hTab==='all'?'on':''}" onclick="hTab='all';paint()">${isAdmin() ? 'Alla' : 'Alla jag ser'}</button></div>
    ${(isAdmin() || myDepts().length) ? `<div style="margin:14px 0"><button class="btn" id="newHo" onclick="openHandoverForm()">Ny överlämning</button></div>` : ''}
    <div class="list grid3" id="holist">${sorted.length ? sorted.map(handoverRow).join('') : '<div class="empty">Inga överlämningar här.</div>'}</div>`;
}
function openHandoverForm(){
  const from = myDepts()[0] || 'A';
  const to = F.depts.find(d => d.code !== from).code;
  openSheet(`<h2>Ny överlämning</h2><p class="sub">Lämna över ett ärende till en annan avdelning. Den får en notis och bekräftar att den tar över.</p>
    <fieldset id="hoForm">
    <label class="lbl" for="hFrom">Från avdelning</label><select id="hFrom">${deptOptions(from, true)}</select>
    <label class="lbl" for="hTo">Till avdelning</label><select id="hTo" onchange="hoPeople()">${deptOptions(to, false)}</select>
    <label class="lbl" for="hToM">Mottagare</label><select id="hToM"></select>
    <p class="hint">Utan namngiven mottagare får hela avdelningen notisen, och den som tar emot blir ansvarig.</p>
    <label class="lbl" for="hSubj">Vad gäller det?</label><input id="hSubj" maxlength="160" autocomplete="off">
    <label class="lbl" for="hBg">Bakgrund</label><textarea id="hBg" placeholder="Vad har hänt, vem har ni pratat med?"></textarea>
    <label class="lbl" for="hExp">Förväntad åtgärd</label><textarea id="hExp" placeholder="Vad behöver mottagaren göra?"></textarea>
    <label class="lbl" for="hDue">Deadline</label><input id="hDue" type="date">
    <details class="more" id="hCont"><summary>Gäller en verksamhet eller person</summary>
      <p class="hint">Registreras hos din avdelning och följer med överlämningen.</p>
      <label class="lbl" for="cName">Organisation eller namn</label><input id="cName" autocomplete="off">
      <label class="lbl" for="cPerson">Kontaktperson</label><input id="cPerson" autocomplete="off">
      <label class="lbl" for="cPhone">Telefon</label><input id="cPhone" type="tel" autocomplete="off">
      <label class="lbl" for="cArea">Område</label><input id="cArea" autocomplete="off">
      <label class="lbl" for="cStatus">Status</label><input id="cStatus" placeholder="Till exempel Intresserad" autocomplete="off">
      <label class="lbl" for="cNote">Kommentar</label><textarea id="cNote"></textarea>
      <label class="lbl" for="cNext">Nästa steg</label><input id="cNext" autocomplete="off">
    </details>
    <label class="lbl" for="hLink">Länk (Drive, video, presentation)</label><input id="hLink" type="url" placeholder="https://" autocomplete="off">
    <label class="lbl" for="hFiles">Bilagor</label><input id="hFiles" type="file" multiple accept=".pdf,.ppt,.pptx,.key,.doc,.docx,.xls,.xlsx,.txt,.csv,image/*">
    <p class="hint">PDF, presentationer, dokument och bilder, högst 50 MB per fil. Video läggs som länk.</p>
    ${F.me.protected ? `<label class="check"><input type="checkbox" id="hP"><span>Skyddad överlämning. Bara de med behörighet för skyddade uppgifter ser den.</span></label>` : ''}
    </fieldset>
    <div class="err" id="hErr"></div>
    <button class="btn" id="hSend" onclick="sendHandover()">Skicka överlämningen</button>`);
  hoPeople();
}
function hoPeople(){
  const c = $('hTo').value, ppl = deptPeople(c), ch = chiefOf(c);
  $('hToM').innerHTML = `<option value="">Hela avdelning ${esc(c)}</option>` + ppl.map(p => `<option value="${attr(p.id)}" ${ch && ch.id === p.id ? 'selected' : ''}>${esc(p.name)}${(p.depts.find(d => d.dept === c) || {}).role === 'chief' ? ' · chef' : ''}</option>`).join('');
}
async function sendHandover(){
  const subj = $('hSubj').value.trim(), from = $('hFrom').value, to = $('hTo').value, link = $('hLink').value.trim();
  if(subj.length < 2){ $('hErr').textContent = 'Skriv vad överlämningen gäller.'; return; }
  if(from === to){ $('hErr').textContent = 'Välj en annan avdelning att lämna över till.'; return; }
  if(link && !/^https?:\/\//i.test(link)){ $('hErr').textContent = 'Länken ska börja med https://'; return; }
  const files = [...($('hFiles').files || [])];
  const big = files.find(f => f.size > 50 * 1024 * 1024);
  if(big){ $('hErr').textContent = big.name + ' är större än 50 MB. Lägg den som länk i stället.'; return; }
  $('hSend').disabled = true; $('hErr').textContent = '';
  try{
    let cid = window.HO_CONTACT || null; window.HO_CONTACT = null;
    const cname = $('cName').value.trim();
    if(cname){
      const c = await insert('fd_contacts', {dept:from, kind:'org', name:cname, contact_person:$('cPerson').value.trim(), phone:$('cPhone').value.trim(),
        area:$('cArea').value.trim(), status:$('cStatus').value.trim(), note:$('cNote').value.trim(), next_step:$('cNext').value.trim(),
        created_by:myId(), protected:!!($('hP') && $('hP').checked)});
      cid = c.id;
    }
    const h = await rpc('fd_handover_send', {p_from_dept:from, p_to_dept:to, p_to_member:$('hToM').value || null, p_subject:subj,
      p_background:$('hBg').value.trim(), p_expected:$('hExp').value.trim(), p_due:$('hDue').value || null, p_contact:cid,
      p_protected:!!($('hP') && $('hP').checked)});
    const failed = [];
    if(link) await addLink('handover', h.id, from, link.replace(/^https?:\/\//, '').slice(0, 60), link).catch(() => failed.push('länken'));
    for(const f of files) await uploadFile('handover', h.id, from, f).catch(e => failed.push(f.name + ' (' + e.message + ')'));
    closeSheet(); await loadAll(); go('handover-' + h.id);
    toast(failed.length ? 'Skickad, men det gick inte att lägga till ' + failed.join(', ') : 'Överlämningen är skickad');
  }catch(e){ $('hErr').textContent = e.message; $('hSend').disabled = false; }
}
function vHandover(){
  const h = handover(arg);
  if(!h) return notFound('Överlämningen');
  const order = ['sent','received','in_progress','done'], at = order.indexOf(h.status);
  const stamp = {sent:h.created_at, received:h.received_at, in_progress:null, done:h.done_at};
  const c = h.contact_id && contact(h.contact_id);
  const tasks = F.tasks.filter(t => t.handover_id === h.id);
  let action = '';
  if(canReceive(h)) action = `<button class="btn" id="hoAct" onclick="receive('${attr(h.id)}')">Bekräfta att ${h.to_member === myId() ? 'du' : 'ni'} tar emot den</button>`;
  else if(canAdvance(h) && h.status === 'received') action = `<button class="btn" id="hoAct" onclick="hoStatus('${attr(h.id)}','in_progress')">Markera som pågående</button>`;
  else if(canAdvance(h) && h.status === 'in_progress') action = `<button class="btn" id="hoAct" onclick="hoStatus('${attr(h.id)}','done')">Markera som slutförd</button>`;
  const waiting = h.status === 'sent' && !canReceive(h)
    ? `<div class="warnbox" id="hoWait">Väntar på att ${h.to_member ? esc(pname(h.to_member)) + ' i ' : ''}avdelning ${esc(h.to_dept)} bekräftar mottagandet.</div>` : '';
  const doneBox = h.status !== 'sent' && h.received_by ? `<div class="okbox">${esc(pname(h.received_by))} tog emot den ${when(h.received_at)}.</div>` : '';
  return `<a class="back" href="#handovers">‹ Överlämningar</a>
    <div class="h1">${esc(h.subject)}</div>
    <div class="meta"><span class="pill ${HSC[h.status]}" id="hoStatus">${HS[h.status]}</span><span class="pill mute">${esc(h.from_dept)} → ${esc(h.to_dept)}</span>${h.protected ? '<span class="pill mute">Skyddad</span>' : ''}</div>
    <ol class="steps" aria-label="Status">${order.map((s, i) => `<li class="${i < at ? 'done' : i === at ? 'now' : ''}">${HS[s]}${stamp[s] && i <= at ? `<small>${when(stamp[s])}</small>` : ''}</li>`).join('')}</ol>
    <div class="grid2"><div>
      ${waiting}${doneBox}
      ${action ? `<div style="margin-top:14px">${action}</div>` : ''}
      <div class="card" style="margin-top:14px">
        <div class="kv"><span>Från</span><b>${esc(pname(h.from_member))} · ${esc(h.from_dept)} ${esc(dept(h.from_dept).name)}</b></div>
        <div class="kv"><span>Till</span><b>${h.to_member ? esc(pname(h.to_member)) + ' · ' : ''}${esc(h.to_dept)} ${esc(dept(h.to_dept).name)}</b></div>
        <div class="kv"><span>Deadline</span><b>${h.due ? esc(h.status !== 'done' ? dueWhen(h.due) : dlabel(h.due)) : 'Ingen'}</b></div>
        <div class="kv"><span>Skickad</span><b>${when(h.created_at)}</b></div>
      </div>
      ${h.background ? `<div class="eyebrow">Bakgrund</div><div class="card prose">${esc(h.background)}</div>` : ''}
      ${h.expected_action ? `<div class="eyebrow">Förväntad åtgärd</div><div class="card prose">${esc(h.expected_action)}</div>` : ''}
      ${c ? `<div class="eyebrow">Verksamhet</div><div class="card" id="hoContact">
        <div class="kv"><span>Namn</span><b>${esc(c.name)}</b></div>
        ${c.contact_person ? `<div class="kv"><span>Kontaktperson</span><b>${esc(c.contact_person)}</b></div>` : ''}
        ${c.phone ? `<div class="kv"><span>Telefon</span><b><a class="linkbtn" href="tel:${attr(c.phone.replace(/[^\d+]/g, ''))}">${esc(c.phone)}</a></b></div>` : ''}
        ${c.area ? `<div class="kv"><span>Område</span><b>${esc(c.area)}</b></div>` : ''}
        ${c.status ? `<div class="kv"><span>Status</span><b>${esc(c.status)}</b></div>` : ''}
        ${c.note ? `<div class="kv"><span>Kommentar</span><b>${esc(c.note)}</b></div>` : ''}
        ${c.next_step ? `<div class="kv"><span>Nästa steg</span><b>${esc(c.next_step)}</b></div>` : ''}</div>` : ''}
      <div class="eyebrow">Uppgifter <span class="n">${tasks.length || ''}</span></div>
      <div class="list">${tasks.map(taskRow).join('') || '<div class="empty" style="padding-top:4px">Inga uppgifter kopplade än.</div>'}</div>
      ${canDept(h.to_dept) && h.status !== 'sent' ? `<button class="btn ghost slim" style="margin-top:10px" onclick="openTaskForm('${attr(h.id)}')">Skapa en uppgift från överlämningen</button>` : ''}
      ${docsBlock('handover', h.id, h.from_dept, true)}
    </div><div>
      ${commentsBlock('handover', h.id)}
    </div></div>`;
}
async function receive(id){
  const b = $('hoAct'); if(b) b.disabled = true;
  try{ await rpc('fd_handover_receive', {p_id:id}); await loadAll(); paint(); toast('Du har tagit emot överlämningen'); }
  catch(e){ toast(e.message); if(b) b.disabled = false; }
}
async function hoStatus(id, s){
  const b = $('hoAct'); if(b) b.disabled = true;
  try{ await rpc('fd_handover_status', {p_id:id, p_status:s}); await loadAll(); paint(); toast(HS[s]); }

async function saveDocs(type, id, deptCode){
  const files = [...($('dFile').files || [])], url = $('dUrl').value.trim();
  if(!files.length && !url){ $('dErr').textContent = 'Välj en fil eller klistra in en länk.'; return; }
  if(url && !/^https?:\/\//i.test(url)){ $('dErr').textContent = 'Länken ska börja med https://'; return; }
  $('dSave').disabled = true;
  try{
    for(const f of files){
      if(f.size > 50 * 1024 * 1024) throw new Error(f.name + ' är större än 50 MB');
      await uploadFile(type, id, deptCode, f);
    }
    if(url) await addLink(type, id, deptCode, $('dName').value.trim() || url.replace(/^https?:\/\//, '').slice(0, 60), url);
    closeSheet(); await loadAll(); paint(); toast('Tillagt');
  }catch(e){ $('dErr').textContent = e.message; $('dSave').disabled = false; }
}
const ownerProtected = (type, id) => !!((type === 'task' ? task(id) : type === 'handover' ? handover(id) : null) || {}).protected;
function addLink(type, id, deptCode, name, url){
  return insert('fd_documents', {owner_type:type, owner_id:id, dept:deptCode || null, kind:'link', name, url, uploaded_by:myId(), protected:ownerProtected(type, id)});
}
async function uploadFile(type, id, deptCode, f){
  const safe = f.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\-]+/g, '_').slice(-80);
  const path = `${type}/${id}/${Date.now().toString(36)}-${safe}`;
  await storage('POST', 'foundation/' + path, f, f.type || 'application/octet-stream');
  try{
    return await insert('fd_documents', {owner_type:type, owner_id:id, dept:deptCode || null, kind:'file', name:f.name, storage_path:path,
      mime:f.type || null, size:f.size, uploaded_by:myId(), protected:ownerProtected(type, id)});
  }catch(e){ await storage('DELETE', 'foundation/' + path).catch(() => {}); throw e; }
}
async function openDoc(id){
  const d = F.docs.find(x => x.id === id); if(!d) return;
  if(d.kind === 'link'){ window.open(d.url, '_blank', 'noopener'); return; }
  const w = window.open('', '_blank');
  try{
    const r = await storage('POST', 'sign/foundation/' + d.storage_path, JSON.stringify({expiresIn:300}), 'application/json');
    const u = CLOUD.url + '/storage/v1' + r.signedURL;
    if(w) w.location = u; else location.href = u;
  }catch(e){ if(w) w.close(); toast(e.message); }
}
async function removeDoc(id){
  const d = F.docs.find(x => x.id === id); if(!d || !confirm('Ta bort ' + d.name + '?')) return;
  try{
    if(d.kind === 'file') await storage('DELETE', 'foundation/' + d.storage_path);
    await del('fd_documents', id); await loadAll(); paint(); toast('Borttaget');
  }catch(e){ toast(e.message); }
}

function adminLog(){
  if(!LOG) return '<div class="skel" style="margin-top:14px"></div><div class="skel"></div>';

    const a = r.after || {}, b = r.before || {};
    if(r.kind === 'fd.task' && r.op === 'status') return TS[b.status] + ' → ' + TS[a.status];
    if(r.kind === 'fd.handover' && r.op === 'status') return HS[b.status] + ' → ' + HS[a.status];

    if(r.kind === 'fd.perm') return a.perm + (a.on ? ' given' : ' borttagen');
    return a.protected ? 'skyddad' : (a.title || a.subject || a.name || '');
  };
  return `<div class="card scrollx" style="margin-top:14px"><table class="tbl" id="logtbl"><thead><tr><th>När</th><th>Vad</th><th>Händelse</th><th>Vem</th></tr></thead><tbody>

/* ---------- enkel markdown för AI-resultat (allt är escapat först) ---------- */
function md(s){
  const lines = esc(s || '').split('\n'); let out = '', list = false;
  const inline = t => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[(Verifierat|Hypotes|Öppen fråga)\]/g, '<span class="pill mute" style="padding:1px 6px">$1</span>');
  for(const l of lines){
    const h = l.match(/^(#{1,3})\s+(.*)/), li = l.match(/^\s*[-*•]\s+(.*)/) || l.match(/^\s*\d+[.)]\s+(.*)/);
    if(li){ if(!list){ out += '<ul class="mdl">'; list = true; } out += `<li>${inline(li[1])}</li>`; continue; }
    if(list){ out += '</ul>'; list = false; }
    if(h) out += `<div class="${h[1].length === 1 ? 'mdh1' : 'mdh2'}">${inline(h[2])}</div>`;
    else if(l.trim()) out += `<p>${inline(l)}</p>`;
  }
  return out + (list ? '</ul>' : '');
}
const section = (s, title) => { const m = String(s || '').split(/^#\s+/m).find(x => x.toLowerCase().startsWith(title.toLowerCase())); return m ? m.slice(title.length).trim() : ''; };

function pollRuns(){

    RUNPOLL = setTimeout(() => { if(!$('sheet').classList.contains('on')) refresh().catch(() => {}); else pollRuns(); }, 12000);
}
function runCard(r, opts){

  return `<div class="card airun" data-run="${attr(r.id)}" style="margin-top:10px">
    <div class="row" style="flex-wrap:wrap"><b style="flex:1">${esc(a.name)}</b><span class="pill ${r.status==='done'?'ok':busy?'live':r.status==='error'||r.status==='blocked'?'bad':'mute'}">${RUNST[r.status]}</span></div>

  const f = (k, l, type) => `<label class="lbl" for="gf_${k}">${l}</label><input id="gf_${k}" ${type ? `type="${type}"` : ''} value="${attr(g[k] || '')}" autocomplete="off">`;
  const ta = (k, l) => `<label class="lbl" for="gf_${k}">${l}</label><textarea id="gf_${k}">${esc(g[k] || '')}</textarea>`;
  const sel = (k, l, o) => `<label class="lbl" for="gf_${k}">${l}</label><select id="gf_${k}">${Object.entries(o).map(([v, t]) => `<option value="${v}" ${g[k]===v?'selected':''}>${t}</option>`).join('')}</select>`;
  openSheet(`<h2>${id ? 'Ändra bidrag' : 'Nytt bidrag'}</h2>${f('name', 'Bidragets namn')}${f('funder', 'Finansiär')}${f('url', 'Officiell länk', 'url')}
    ${f('deadline', 'Deadline', 'date')}${f('deadline_text', 'Deadline (text, t.ex. klockslag)')}${f('amount_text', 'Belopp')}
    ${sel('eligibility', 'Behörighet', ELIG)}${sel('priority', 'Prioritet', {A:'A · Sökbart nu', B:'B · Förbered', C:'C · Bevaka'})}${sel('status', 'Status', GST)}
    ${ta('fit_projects', 'Passande Foundation-projekt')}${ta('requirements', 'Krav och begränsningar')}${f('next_action', 'Nästa åtgärd')}${f('verified_at', 'Senast verifierad', 'date')}
    ${f('applied_amount', 'Sökt belopp')}${f('granted_amount', 'Beviljat belopp')}${ta('decision_terms', 'Beslut och villkor')}${f('report_due', 'Återrapportering', 'date')}
    <label class="lbl" for="gf_owner">Ansvarig</label><select id="gf_owner"><option value="">Ingen än</option>${F.people.filter(p => (p.depts||[]).some(d => ['I','J','E'].includes(d.dept)) || p.admin).map(p => `<option value="${attr(p.id)}" ${g.owner===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
    <div class="err" id="gfErr"></div><button class="btn" onclick="saveGrant(${id ? `'${attr(id)}'` : 'null'})">Spara</button>`);
}
async function saveGrant(id){
  const v = k => ($('gf_' + k) || {value:''}).value.trim();
  const row = {}; ['name','funder','url','deadline_text','amount_text','eligibility','priority','status','fit_projects','requirements','next_action','applied_amount','granted_amount','decision_terms'].forEach(k => row[k] = v(k));
  ['deadline','verified_at','report_due','owner'].forEach(k => row[k] = v(k) || null);
  if(row.name.length < 2){ $('gfErr').textContent = 'Fyll i namn.'; return; }
  if(row.url && !/^https?:\/\//.test(row.url)){ $('gfErr').textContent = 'Länken ska börja med https://'; return; }
  try{ const r = id ? await patch('fd_grants', id, row) : await insert('fd_grants', Object.assign(row, {created_by:myId()}));
       closeSheet(); await loadAll(); id ? paint() : go('grant-' + r.id); toast('Sparat'); }
  catch(e){ $('gfErr').textContent = e.message; }
}

      <div class="card" style="margin-top:12px">${[['Finansiär', g.funder], ['Deadline', g.deadline ? dlabel(g.deadline) + ' · ' + dueText(g.deadline) : g.deadline_text], ['Belopp', g.amount_text],
        ['Passande projekt', g.fit_projects], ['Krav', g.requirements], ['Nästa åtgärd', g.next_action], ['Senast verifierad', g.verified_at ? dlabel(g.verified_at) : 'Inte verifierad'],
        ['Ansvarig', pname(g.owner)], ['Sökt', g.applied_amount], ['Beviljat', g.granted_amount], ['Beslut och villkor', g.decision_terms], ['Återrapportering', g.report_due ? dlabel(g.report_due) : '']]

      ${g.url ? `<p style="margin-top:10px"><a class="linkbtn" href="${attr(g.url)}" target="_blank" rel="noopener noreferrer">Officiell utlysning</a></p>` : ''}

      ${g.analysis ? `<div class="eyebrow">Analys</div><div class="card"><div class="mdbody">${md(g.analysis)}</div></div>` : ''}
      ${g.previous_recipients ? `<div class="eyebrow">Tidigare mottagare</div><div class="card prose">${esc(g.previous_recipients)}</div>` : ''}
      ${docsBlock('grant', g.id, 'I', true)}
    </div><div>${aiBlock('grant', g.id, 'a_funding', 'Fördjupad analys', {placeholder:'Till exempel: är vi behöriga, och vilka kostnader godkänns?', button:'Analysera'})}${commentsBlock('grant', g.id)}</div></div>`;

async function setGrantStatus(id, s){ try{ await patch('fd_grants', id, {status:s}); await loadAll(); paint(); toast(GST[s]); }catch(e){ toast(e.message); } }
async function importReport(){
  const body = $('frBody').value.trim(); if(body.length < 20) return toast('Klistra in rapporten först');
  try{ const r = await insert('fd_funding_reports', {body, created_by:myId()});
       await rpc('fd_agent_request', {p_agent:'a_fundimport', p_owner_type:'funding_report', p_owner_id:r.id, p_question:''});
       await loadAll(); paint(); toast('Rapporten läses in. Bidragen dyker upp om några minuter.'); }
  catch(e){ toast(e.message); }
}

/* ---------- H: UNDERSÖKNINGAR ---------- */
let SVR = {};
const surveyUrl = s => location.origin + '/enkat.html?t=' + s.token;
function vSurveys(){
  if(arg) return vSurvey();
  const can = isAdmin() || inDept('H');
  return `<div class="h1">Undersökningar</div><p class="sub">Utvärderingar efter aktiviteter och större undersökningar om ungas villkor. Svaren är alltid anonyma.</p>
    ${can ? `<div style="margin:14px 0"><button class="btn" onclick="openSurveyForm()">Ny undersökning</button></div>` : ''}
    <div class="list grid3" id="surveylist">${F.surveys.map(s => `<a class="item" href="#survey-${attr(s.id)}"><span class="dept sm">H</span><span class="grow"><b>${esc(s.title)}</b>
      <em>${s.kind === 'internal' ? 'Utvärdering' : 'Samhällsundersökning'}${s.activity_id && activity(s.activity_id) ? ' · ' + esc(activity(s.activity_id).title) : ''} · ${nt(s.questions.length, 'fråga', 'frågor')}</em>
      <span class="meta"><span class="pill ${s.status==='open'?'live':s.status==='closed'?'mute':''}">${{draft:'Utkast', open:'Öppen', closed:'Stängd'}[s.status]}</span></span></span></a>`).join('') || '<div class="empty">Inga undersökningar än.</div>'}</div>`;
}
const DEFAULT_EVAL = [{id:'q1', type:'scale', label:'Vad tyckte du om aktiviteten?'}, {id:'q2', type:'text', label:'Vad lärde du dig?'},
  {id:'q3', type:'text', label:'Upptäckte du något nytt?'}, {id:'q4', type:'text', label:'Vad vill du göra mer av?'}];
function openSurveyForm(actId){
  window.SQ = actId ? DEFAULT_EVAL.map(q => Object.assign({}, q)) : [{id:'q1', type:'scale', label:''}];
  openSheet(`<h2>${actId ? 'Utvärdering' : 'Ny undersökning'}</h2>
    <label class="lbl" for="sf_t">Namn</label><input id="sf_t" value="${actId ? attr('Utvärdering: ' + activity(actId).title) : ''}">
    <label class="lbl" for="sf_k">Typ</label><select id="sf_k"><option value="internal">Utvärdering</option><option value="societal" ${actId ? '' : 'selected'}>Samhällsundersökning</option></select>
    <label class="lbl" for="sf_a">Aktivitet</label><select id="sf_a"><option value="">Ingen</option>${F.activities.map(a => `<option value="${attr(a.id)}" ${a.id===actId?'selected':''}>${esc(a.title)} · ${esc(dlabel(a.date))}</option>`).join('')}</select>
    <label class="lbl" for="sf_i">Inledning</label><textarea id="sf_i">${actId ? 'Tack för att du var med! Dina svar är anonyma och hjälper oss att göra nästa gång bättre.' : 'Dina svar är anonyma.'}</textarea>
    <div class="lbl">Frågor</div><div id="sfq"></div><button class="btn ghost slim" onclick="SQ.push({id:'q'+(SQ.length+1)+Math.random().toString(36).slice(2,5),type:'text',label:''});sqPaint()">Lägg till fråga</button>
    <div class="err" id="sfErr"></div><button class="btn" onclick="saveSurvey()">Spara som utkast</button>`);
  sqPaint();
}
function sqPaint(){
  $('sfq').innerHTML = SQ.map((q, i) => `<div class="card" style="margin-bottom:8px"><input value="${attr(q.label)}" placeholder="Frågan" oninput="SQ[${i}].label=this.value">
    <div class="row" style="margin-top:8px"><select style="flex:1" onchange="SQ[${i}].type=this.value;sqPaint()">${[['scale','Skala 1–5'],['choice','Flerval'],['text','Fritext']].map(([k, l]) => `<option value="${k}" ${q.type===k?'selected':''}>${l}</option>`).join('')}</select>
    <button class="btn ghost slim" onclick="SQ.splice(${i},1);sqPaint()">Ta bort</button></div>
    ${q.type === 'choice' ? `<input style="margin-top:8px" placeholder="Alternativ, separerade med komma" value="${attr((q.options||[]).join(', '))}" oninput="SQ[${i}].options=this.value.split(',').map(x=>x.trim()).filter(Boolean)">` : ''}</div>`).join('');
}
async function saveSurvey(){
  const qs = SQ.filter(q => q.label.trim()).map(q => q.type === 'choice' ? q : {id:q.id, type:q.type, label:q.label});
  if(!$('sf_t').value.trim() || !qs.length){ $('sfErr').textContent = 'Fyll i namn och minst en fråga.'; return; }
  try{ const s = await insert('fd_surveys', {title:$('sf_t').value.trim(), kind:$('sf_k').value, activity_id:$('sf_a').value || null, intro:$('sf_i').value.trim(), questions:qs, created_by:myId()});
       closeSheet(); await loadAll(); go('survey-' + s.id); }
  catch(e){ $('sfErr').textContent = e.message; }
}
function vSurvey(){
  const s = survey(arg); if(!s) return notFound('Undersökningen');
  const can = isAdmin() || inDept('H') || s.created_by === myId();
  const seeRes = isAdmin() || inDept('H') || (s.activity_id && (youthOk() || (activity(s.activity_id) && inDept(activity(s.activity_id).dept))));
  if(seeRes && SVR[s.id] === undefined){ SVR[s.id] = null; rpc('fd_survey_report', {p_survey:s.id}).then(r => { SVR[s.id] = r; if(route === 'survey') paint(); }).catch(() => { SVR[s.id] = false; }); }
  const R = SVR[s.id];
  return `<a class="back" href="#surveys">‹ Undersökningar</a><div class="h1">${esc(s.title)}</div>
    <div class="meta"><span class="pill live">${{draft:'Utkast', open:'Öppen', closed:'Stängd'}[s.status]}</span><span class="pill mute">${s.kind === 'internal' ? 'Utvärdering' : 'Samhällsundersökning'}</span></div>
    <div class="grid2"><div>
      ${can ? `<div class="row" style="margin-top:12px;flex-wrap:wrap">${s.status !== 'open' ? `<button class="btn slim" onclick="setSurvey('${attr(s.id)}','open')">Öppna för svar</button>` : `<button class="btn ghost slim" onclick="setSurvey('${attr(s.id)}','closed')">Stäng</button>`}</div>` : ''}
      ${s.status === 'open' ? `<div class="card" style="margin-top:12px"><b>Länken till enkäten</b><p class="hint" style="user-select:all;overflow-wrap:anywhere">${esc(surveyUrl(s))}</p>
        <button class="btn slim" style="margin-top:8px" onclick="copyText('${attr(surveyUrl(s))}').then(()=>toast('Kopierad'),()=>toast('Markera och kopiera'))">Kopiera länken</button>
        <p class="hint">Skicka den i gruppchatten eller visa som QR. Ingen behöver logga in, och svaren sparas utan namn.</p></div>` : ''}
      <div class="eyebrow">Frågor</div><div class="card">${s.questions.map((q, i) => `<div class="kv"><span>${i + 1}</span><b>${esc(q.label)} <span class="hint">${{scale:'Skala 1–5', choice:'Flerval', text:'Fritext'}[q.type]}</span></b></div>`).join('')}</div>
    </div><div>
      ${seeRes ? `<div class="eyebrow">Resultat ${R ? `<span class="n">${nt(+R.svar, 'svar', 'svar')}</span>` : ''}</div>
        <div id="sres">${R === null ? '<div class="skel"></div>' : !R ? '<div class="empty">Kunde inte hämta resultatet.</div>' : (R['frågor'] || []).map(q => `<div class="card" style="margin-bottom:8px"><b>${esc(q['fråga'])}</b>
          ${q.typ === 'scale' && q.resultat ? `<p class="sub">Snitt ${q.resultat.snitt == null ? '–' : String(q.resultat.snitt).replace('.', ',')} av 5</p>${[1,2,3,4,5].map(v => { const n = +((q.resultat['fördelning'] || {})[v] || 0), tot = +R.svar || 1;
              return `<div class="row" style="gap:8px;margin-top:4px"><span class="nums" style="width:14px">${v}</span><span style="flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.06)"><span style="display:block;height:8px;border-radius:99px;background:var(--tube);width:${Math.round(n / tot * 100)}%"></span></span><span class="nums hint" style="margin:0">${n}</span></div>`; }).join('')}`
          : q.typ === 'choice' ? Object.entries(q.resultat || {}).map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><b class="nums">${v}</b></div>`).join('')
          : `<ul class="mdl">${(q.resultat || []).slice(0, 30).map(t => `<li>${esc(t)}</li>`).join('')}</ul>`}</div>`).join('')}</div>
        ${aiBlock('survey', s.id, 'a_insights', 'Sammanställ med AI', {placeholder:'Till exempel: vilka mönster ser du, med metodförbehåll?'})}` : '<p class="hint" style="margin-top:14px">Resultatet ser H och admin, och för en utvärdering även aktivitetens ansvariga.</p>'}
    </div></div>`;
}
async function setSurvey(id, st){ try{ await patch('fd_surveys', id, {status:st}); await loadAll(); paint(); }catch(e){ toast(e.message); } }
async function makeEval(aid){ openSurveyForm(aid); }

      ${F.runs.slice(0, 60).map(r => `<tr><td class="nums">${when(r.created_at)}</td><td>${esc((agent(r.agent_id) || {}).name || r.agent_id)}</td><td>${RUNST[r.status]}</td><td class="nums">${(+r.cost_usd * (AI.usd_sek || 10.5)).toFixed(2).replace('.', ',')} kr</td><td>${esc(pname(r.started_by))}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">Inga körningar än.</td></tr>'}</tbody></table></div>`}`;
}
async function saveAI(){ try{ AI = Object.assign(await rpc('fd_save_ai_settings', {p_budget_sek:+$('aiB').value, p_usd_sek:+$('aiR').value, p_enabled:$('aiOn').checked}), {loaded:true}); paint(); toast('Sparat'); }catch(e){ toast(e.message); } }
function openAgent(id){
  const a = agent(id);
  openSheet(`<h2>${esc(a.name)}</h2><p class="sub">${esc(a.purpose)}</p>
    <label class="lbl" for="ag_i">Arbetsinstruktion</label><textarea id="ag_i" style="min-height:200px">${esc(a.instructions)}</textarea>
    <label class="lbl" for="ag_o">Vad den levererar</label><textarea id="ag_o">${esc(a.output)}</textarea>
    <label class="lbl" for="ag_ap">Regel för mänskligt godkännande</label><input id="ag_ap" value="${attr(a.approval)}">
    <label class="lbl" for="ag_e">Ansträngning</label><select id="ag_e">${['low','medium','high','xhigh','max'].map(e => `<option ${a.effort===e?'selected':''}>${e}</option>`).join('')}</select>
    <label class="lbl" for="ag_s">Max webbsökningar per steg</label><input id="ag_s" type="number" min="0" max="40" value="${a.max_searches}">
    <label class="check"><input type="checkbox" id="ag_w" ${a.web?'checked':''} ${a.mode==='funding_import'?'disabled':''}><span>Får söka och läsa på webben</span></label>
    <label class="check"><input type="checkbox" id="ag_a" ${a.active?'checked':''}><span>Aktiv</span></label>
    <p class="hint">Modell: ${esc(a.model)}. Agenten får bara det körningen gäller och kunskapsbasen, aldrig ungdomarnas uppgifter.</p>
    <div class="err" id="agErr"></div><button class="btn" onclick="saveAgent('${attr(id)}')">Spara</button>`);
}
async function saveAgent(id){
  try{ await patch('fd_agents', id, {instructions:$('ag_i').value, output:$('ag_o').value, approval:$('ag_ap').value, effort:$('ag_e').value,
         max_searches:Math.max(0, Math.min(40, +$('ag_s').value || 0)), web:$('ag_w').checked, active:$('ag_a').checked, updated_by:myId()});
       closeSheet(); await loadAll(); paint(); toast('Sparat'); }
  catch(e){ $('agErr').textContent = e.message; }
}
function openKnowledge(id){
  const k = id ? F.knowledge.find(x => x.id === id) : {title:'', body:'', dept:null};
  openSheet(`<h2>Kunskapsbas</h2><label class="lbl" for="kb_t">Rubrik</label><input id="kb_t" value="${attr(k.title)}">
    <label class="lbl" for="kb_d">Gäller</label><select id="kb_d"><option value="">Alla agenter</option>${F.depts.map(d => `<option value="${d.code}" ${k.dept===d.code?'selected':''}>${d.code} · ${esc(d.name)}</option>`).join('')}</select>
    <label class="lbl" for="kb_b">Text</label><textarea id="kb_b" style="min-height:240px">${esc(k.body)}</textarea>
    <div class="err" id="kbErr"></div><button class="btn" onclick="saveKnowledge(${id ? `'${attr(id)}'` : 'null'})">Spara</button>`);
}
async function saveKnowledge(id){
  const row = {title:$('kb_t').value.trim(), body:$('kb_b').value, dept:$('kb_d').value || null, updated_by:myId()};
  try{ id ? await patch('fd_knowledge', id, row) : await insert('fd_knowledge', row); closeSheet(); await loadAll(); paint(); toast('Sparat'); }
  catch(e){ $('kbErr').textContent = e.message; }
}
/* ===================== NOTISER, PROFIL, ARK ===================== */
function openNotes(){
  const ids = F.notes.filter(n => !n.read_at).map(n => n.id);
  openSheet(`<h2>Notiser</h2><div class="list" style="margin-top:14px" id="notes">${F.notes.length ? F.notes.map(n => `<a class="item${n.read_at ? '' : ' attn'}" href="#${n.ref_type === 'admin' ? 'admin' : attr(n.ref_type) + '-' + attr(n.ref_id)}" onclick="closeSheet()">
      <span class="grow"><b>${esc(n.title)}</b><em>${esc(n.body)}</em></span><span class="side">${when(n.created_at)}</span></a>`).join('') : '<div class="empty">Inga notiser.</div>'}</div>`);
  if(ids.length) rpc('fd_mark_read', {p_ids:ids}).then(() => { F.notes.forEach(n => { if(ids.includes(n.id)) n.read_at = new Date().toISOString(); }); paintBell(); }).catch(() => {});
}
function paintBell(){ const n = unreadNotes(); const b = $('bell').querySelector('.badge'); if(b && !n) b.remove(); else if(b) b.textContent = n; }
function openMe(){
  const me = F.me;
  openSheet(`<div class="row" style="gap:14px"><span class="av lg">${esc(initials(me.name))}</span><div><h2 style="margin:0">${esc(me.name)}</h2>
    <p class="sub">${me.admin ? 'Foundation-admin' : 'Bando Foundation'}${me.depts.length ? ' · ' + me.depts.map(d => d.dept + (d.role === 'chief' ? ' chef' : '')).join(', ') : ''}</p></div></div>
    ${me.role !== 'foundation' && me.role !== 'customer' ? `<a class="btn ghost" href="index.html">Till studion</a>` : ''}
    <button class="btn ghost" onclick="signOut()">Logga ut</button>`);
}
async function signOut(){
  try{ await fetch(CLOUD.url + '/auth/v1/logout', {method:'POST', headers:{apikey:CLOUD.key, Authorization:'Bearer ' + AUTH.access_token}}); }catch(e){}
  saveAuth(null); location.replace('index.html');
}
let lastFocus = null;
function openSheet(html){
  lastFocus = document.activeElement;
  const s = $('sheet');
  s.innerHTML = `<button class="x" aria-label="Stäng" onclick="closeSheet()"><svg viewBox="0 0 24 24">${ICON.x}</svg></button>` + html;
  s.scrollTop = 0; s.classList.add('on'); $('scrim').classList.add('on'); s.focus({preventScroll:true});
}
function closeSheet(quiet){
  const s = $('sheet'); if(!s.classList.contains('on')) return;
  s.classList.remove('on'); $('scrim').classList.remove('on');
  if(!quiet && lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true});
}
addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });
function notFound(what){ return `<a class="back" href="#hq">‹ Mitt HQ</a><div class="h1">Hittades inte</div><p class="sub">${what} finns inte, eller så har du inte behörighet att se den.</p>`; }
function gate(msg){
  $('nav').style.display = 'none';
  $('view').innerHTML = `<div class="gate"><div class="h1">Bando <span class="tube">Foundation</span></div><p class="sub" style="margin-top:10px">${msg}</p>
    <a class="btn ghost" href="index.html">Till BANDO HQ</a><button class="btn ghost" style="margin-top:10px" onclick="signOut()">Logga ut</button></div>`;
}

/* ===================== START ===================== */
async function start(){
  if(!AUTH) return;
  try{ await loadAll(); }
  catch(e){ return gate(esc(e.message)); }
  /* länken: direkt, eller sparad genom inloggningen */
  let jt = JOIN, joinMsg = '';
  try{ const m = (sessionStorage.getItem('fd_next') || '').match(/^#join=([A-Za-z0-9-]{6,})/); if(!jt && m) jt = m[1]; if(m) sessionStorage.removeItem('fd_next'); }catch(e){}
  if(jt){
    history.replaceState(null, '', location.pathname + location.search + '#hq');
    try{
      const r = await rpc('fd_join_link', {p_token:jt});
      joinMsg = r.added.length ? 'Du är nu med i avdelning ' + deptsText(r.added) : 'Du är redan med i avdelning ' + deptsText(r.depts);
      await loadAll();
    }catch(e){ joinMsg = e.message; }
  }
  setTimeout(() => { if(joinMsg) toast(joinMsg); }, 300);
  window.FD_JOIN = joinMsg;
  if(!F.me || !F.me.member) return gate('Du har inte tillgång till Bando Foundations arbetsyta än. En admin lägger till dig i en avdelning.');
  try{ const nx = sessionStorage.getItem('fd_next'); if(nx && location.hash.length < 2){ sessionStorage.removeItem('fd_next'); history.replaceState(null, '', nx); } }catch(e){}
  buildNav(); parseHash(); paint();
  /* nya notiser och ändringar: hämta när fliken visas igen och varje minut */
  setInterval(() => { if(!document.hidden && !$('sheet').classList.contains('on')) refresh().catch(() => {}); }, 60000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) refresh().catch(() => {}); });
  addEventListener('resize', markNav);
  window.FD_READY = true;
}
start();
</script>
