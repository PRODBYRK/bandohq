# BANDOHQ · iPhone-appen byggs, signeras och laddas upp till TestFlight här (Codemagic).
# Appen själv är https://bandohq.se — en vanlig webbändring kräver inget nytt bygge.
# Bygg bara när skalet i app/ ändras: push till grenen "ios", eller "Start new build" i Codemagic.
#
# Engångsinställningar i Codemagic (se SETUP.md, steg 6):
#   · Teams → Integrations → Developer Portal: App Store Connect-nyckeln, med namnet "BANDOHQ"
#   · Teams → Code signing identities: generera ett Apple Distribution-certifikat och hämta
#     App Store-profilen för se.bandohq.app (med Push Notifications och Associated Domains)
# Inga hemligheter ligger i den här filen.
workflows:
  ios-testflight:
    name: BANDOHQ iPhone → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: BANDOHQ
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: se.bandohq.app
      node: 22
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios
          include: true
    scripts:
      - name: Installera Capacitor
        working_directory: app
        script: npm ci
      - name: Synka iOS-projektet
        working_directory: app
        script: npx cap sync ios
      - name: Byggnummer (räknas upp för varje bygge)
        working_directory: app/ios/App
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $((100 + BUILD_NUMBER));/" App.xcodeproj/project.pbxproj
      - name: Signering
        script: xcode-project use-profiles
      - name: Bygg
        working_directory: app/ios/App
        script: xcode-project build-ipa --project App.xcodeproj --scheme App
    artifacts:
      - app/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
